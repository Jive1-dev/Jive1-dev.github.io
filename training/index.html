<!doctype html><html lang="de-CH"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b09"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="52 Wochen Calisthenics: Plan, Training Schritt für Schritt, Skills, Körper und Essen.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style></head><body><title>Winter Arc Training</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>/* Winter Arc Training · Spartan
   Layout: eine Spalte (max 560px), Kopf mit Schild-Logo, Inhalt, Tab-Leiste unten fix.
   Dunkel zuerst: Nacht-Schwarz, Knochenweiss, Bronze, Spartanerrot. */
:root{
  --bg:#0d0b09; --surface:#16120e; --raise:#201a14; --line:#33291f; --bone:#ede4d1; --bone-2:#a99d88; --bone-3:#7b705f;
  --crimson:#c0281f; --crimson-2:#8f1c16; --on-crimson:#fbf3e7; --bronze:#c4934f; --bronze-2:#8a6532; --good:#8bb067;
  --fig:#dccfb5; --fig-far:#8c816c; --fig-ol:#16120e; --mu:#e0392d;
  --display:"Oswald","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif;
  --tab-h:64px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#ece5d7; --surface:#f6f1e7; --raise:#fffaf2; --line:#d4c8b3; --bone:#1a1612; --bone-2:#5e5345; --bone-3:#8a7e6c;
  --crimson:#a8231b; --crimson-2:#7d1913; --on-crimson:#fff8ee; --bronze:#8e6833; --bronze-2:#b48a4e; --good:#4c7a2c;
  --fig:#3a322a; --fig-far:#9b8f7c; --fig-ol:#f6f1e7; --mu:#c0281f; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#ece5d7; --surface:#f6f1e7; --raise:#fffaf2; --line:#d4c8b3; --bone:#1a1612; --bone-2:#5e5345; --bone-3:#8a7e6c;
  --crimson:#a8231b; --crimson-2:#7d1913; --on-crimson:#fff8ee; --bronze:#8e6833; --bronze-2:#b48a4e; --good:#4c7a2c;
  --fig:#3a322a; --fig-far:#9b8f7c; --fig-ol:#f6f1e7; --mu:#c0281f; color-scheme:light}
:root[data-theme="dark"]{
  --bg:#0d0b09; --surface:#16120e; --raise:#201a14; --line:#33291f; --bone:#ede4d1; --bone-2:#a99d88; --bone-3:#7b705f;
  --crimson:#c0281f; --crimson-2:#8f1c16; --on-crimson:#fbf3e7; --bronze:#c4934f; --bronze-2:#8a6532; --good:#8bb067;
  --fig:#dccfb5; --fig-far:#8c816c; --fig-ol:#16120e; --mu:#e0392d; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--bone);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}
h1,h2,h3,h4,.d{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:1.02;margin:0;font-weight:700;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px))}

/* Kopf */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.hdr .brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.06em}
.hdr .brand small{display:block;font-size:10px;letter-spacing:.2em;color:var(--bone-3);font-weight:500}
.hdr .sp{flex:1}
.rank{font-family:var(--display);font-size:12px;letter-spacing:.1em;color:var(--bronze);border:1px solid var(--bronze-2);padding:4px 8px;border-radius:3px;white-space:nowrap}
.icon-btn{color:var(--bone);text-decoration:none;width:44px;height:44px;border-radius:6px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo .lg-rim{fill:var(--bronze)}.logo .lg-face{fill:var(--crimson-2)}.logo .lg-ring{fill:none;stroke:var(--bronze-2);stroke-width:2}.logo .lg-lambda{fill:var(--bronze)}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs a{height:var(--tab-h);display:grid;place-items:center;align-content:center;gap:3px;color:var(--bone-3);text-decoration:none;font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.tabs a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--bone)}
.tabs a[aria-current="page"] svg{stroke:var(--crimson)}
body.agoge .tabs{display:none}
body.agoge .app{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}

/* Bausteine */
.stack{display:grid;gap:14px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.card.hero{border-top:3px solid var(--crimson);padding:16px}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.14em;color:var(--bone-3);text-transform:uppercase}
.kicker{font-family:var(--display);font-size:13px;letter-spacing:.1em;color:var(--bronze);text-transform:uppercase;font-weight:500;margin-bottom:8px}
.title-xl{font-size:clamp(34px,10vw,46px)}
.muted{color:var(--bone-2);font-size:14px}
.small{font-size:13px;color:var(--bone-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--line);padding:4px 9px;border-radius:4px;background:var(--raise)}
button.chip{min-height:38px}
button.chip[aria-pressed="true"]{background:var(--bronze);border-color:var(--bronze);color:var(--bg);font-weight:600}
.mchip{font-size:12px;padding:2px 8px;border-radius:3px;border:1px solid var(--crimson-2);color:var(--bone)}
.btn{min-height:52px;border-radius:6px;border:1px solid var(--line);background:var(--raise);padding:0 16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--crimson);border-color:var(--crimson);color:var(--on-crimson);font-family:var(--display);font-size:20px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;min-height:60px;width:100%}
.btn.primary:active{background:var(--crimson-2)}
.btn.wide{width:100%}
.btn.ghost{background:none}
.btn.sm{min-height:42px;font-size:14px;padding:0 12px}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.split{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.list{display:grid;gap:8px}
.line{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:8px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line b{font-family:var(--display);font-weight:500;letter-spacing:.02em}
.quote{border-left:3px solid var(--bronze);padding:4px 0 4px 12px}
.quote p{font-family:var(--display);font-size:20px;line-height:1.2;text-transform:none;letter-spacing:.01em}
.quote small{display:block;margin-top:6px;color:var(--bone-3);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:10px}
.tile b{display:block;font:700 28px/1 var(--display)}
.tile span{font-size:11px;color:var(--bone-3);text-transform:uppercase;letter-spacing:.08em}
.timeline{display:grid;grid-template-columns:36px 1fr;gap:6px 10px;font-size:14px}
.timeline i{font-style:normal;color:var(--bone-3);text-align:right;font-variant-numeric:tabular-nums}
.timeline span b{font-weight:600}
input.field,select.field,textarea.field{width:100%;min-height:48px;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
label.lbl{display:grid;gap:6px;font-size:13px;color:var(--bone-2)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bone);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:60;font-weight:600;max-width:90vw;text-align:center}
body.agoge .toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more summary.plain{text-transform:none;font-family:var(--body);font-weight:600;letter-spacing:0;font-size:15px}
details.more summary{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-size:14px;cursor:pointer;min-height:36px;display:flex;align-items:center}
.gl{background:none;border:0;padding:0;border-bottom:1px dotted var(--bronze);color:inherit;cursor:help}

/* Figuren */
.fig{width:100%;height:auto;display:block;background:radial-gradient(120% 90% at 50% 100%,var(--raise),var(--surface));border-radius:8px}
.fig line{stroke-linecap:round;fill:none}
.fig .ol{stroke:var(--fig-ol)}.fig .sk{stroke:var(--fig)}.fig .far .sk{stroke:var(--fig-far)}
.fig .mu{stroke:var(--mu);display:none}.fig .mu.on{display:inline}
.fig .hipc,.fig .delt{fill:transparent}.fig .hipc.on,.fig .delt.on{fill:var(--mu)}
.fig .head{fill:var(--fig)}.fig .headol{fill:var(--fig-ol)}.fig .db,.fig .ball{fill:var(--bronze)}
.fig .prop,.fig .ground{stroke:var(--bronze-2);stroke-width:3;fill:none}
.fig .prop.thin{stroke-width:2}
.fig .ghost line{opacity:.35}
.fig-sm{max-width:120px}

/* Muskelkarte */
.mmap{width:100%;height:auto;max-width:360px;display:block;margin:0 auto}
.mmap .mm-body *{fill:var(--raise);stroke:var(--line);stroke-width:.8}
.mmap .mm-r{fill:var(--line);stroke:var(--surface);stroke-width:.6}
.mmap .mm-r.s1{fill:color-mix(in srgb,var(--crimson) 35%,var(--line))}
.mmap .mm-r.s2{fill:color-mix(in srgb,var(--crimson) 70%,var(--line))}
.mmap .mm-r.s3{fill:var(--crimson)}
.mmap .mm-t{fill:var(--bone-3);font:9px var(--display);letter-spacing:.15em}

/* Schild-Kette */
.shield-row{display:flex;gap:6px;justify-content:space-between}
.shield-day{flex:1;display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--bone-3);font-family:var(--display);letter-spacing:.08em}
.shield-day svg{width:100%;max-width:38px;height:auto}
.shield-day .sd-o{fill:none;stroke:var(--line);stroke-width:4}
.shield-day.done .sd-o{stroke:var(--bronze)}
.shield-day .sd-f{fill:transparent}
.shield-day.done .sd-f{fill:var(--crimson-2)}
.shield-day.today{color:var(--bone)}
.shield-day.rest .sd-o{stroke-dasharray:4 4}

/* Agoge (Training) */
.ag-top{display:grid;gap:8px;padding-top:10px}
.ag-prog{height:6px;background:var(--raise);border-radius:3px;overflow:hidden}
.ag-prog i{display:block;height:100%;background:var(--crimson);transition:width .3s}
.ag-meta{display:flex;justify-content:space-between;font-family:var(--display);font-size:13px;letter-spacing:.08em;color:var(--bone-2)}
.ag-card{display:grid;gap:12px;margin-top:12px}
.ag-name{font-size:clamp(28px,8vw,36px)}
.goal{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.goal b{font:700 40px/1 var(--display)}
.goal span{color:var(--bone-2)}
.beat{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.beat b{font-family:var(--display);color:var(--bronze);font-weight:500}
.hint{font-size:14px;border-left:3px solid var(--bronze);padding-left:10px;color:var(--bone-2)}
.steps{margin:0;padding-left:22px;display:grid;gap:4px}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:10px}
.stepper button{height:64px;border-radius:8px;border:1px solid var(--line);background:var(--raise);font:700 32px var(--display)}
.stepper input{min-width:0;width:100%;text-align:center;font:700 40px var(--display);background:var(--surface);border:1px solid var(--line);border-radius:8px}
.watch{min-height:56px;border-radius:8px;border:1px solid var(--bronze-2);background:var(--raise);font:700 22px var(--display);letter-spacing:.05em;width:100%}
.watch.run{background:var(--bronze);color:var(--bg)}
.btn.primary.rest{background:var(--raise);border-color:var(--bronze);color:var(--bone)}
.btn.primary.rest b{color:var(--bronze)}
.ag-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ag-tools .btn{min-height:48px;font-size:13px;padding:0 6px}
.pain{border:1px solid var(--crimson);background:color-mix(in srgb,var(--crimson) 12%,var(--surface));border-radius:8px;padding:12px;display:grid;gap:10px}
.video-box{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:8px;overflow:hidden;background:var(--raise)}
.video-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.next{font-size:13px;color:var(--bone-3)}

/* Plan */
.wgrid{display:grid;grid-template-columns:24px repeat(13,minmax(0,1fr));gap:3px;align-items:center}
.wgrid .rn{font-family:var(--display);font-size:13px;color:var(--crimson)}
.wc{aspect-ratio:1;border-radius:3px;background:var(--raise);border:1px solid var(--line);font-size:9px;display:grid;place-items:center;color:var(--bone-3);padding:0}
.wc.dl{background:repeating-linear-gradient(45deg,var(--raise) 0 3px,var(--line) 3px 5px)}
.wc.ts{background:var(--bronze-2);color:var(--on-crimson);font-weight:700}
.wc.past{background:var(--bronze);border-color:var(--bronze)}
.wc.now{outline:2px solid var(--crimson);outline-offset:1px}
.wc.sel{box-shadow:inset 0 0 0 2px var(--bone)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--bone-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend .wc{width:14px}
.dayrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.dayrow b{font-family:var(--display);font-size:18px}
.dayrow .ok{color:var(--good);font-weight:700}

/* Skills */
.ladder{display:grid;gap:6px}
.lstep{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:8px;border-radius:6px;border:1px solid transparent}
.lstep .ic{font-weight:700;text-align:center}
.lstep.done .ic{color:var(--good)}
.lstep.cur{background:var(--raise);border-color:var(--crimson)}
.lstep.lock{color:var(--bone-3)}
.lstep small{color:var(--bone-3);font-size:12px}

/* Körper */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--bone-3);font:10px var(--body)}
.chart .gl1{stroke:var(--line)}
.chart .band{fill:var(--bronze);opacity:.18}
.chart .ln{stroke:var(--crimson);stroke-width:2.2;fill:none}
.chart .pt{fill:var(--crimson)}
.chart .end{fill:var(--crimson);stroke:var(--surface);stroke-width:2}

/* Essen */
.check{display:grid;gap:6px}
.check button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;min-height:52px;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.check button i{width:24px;height:24px;flex:none;border:2px solid var(--bone-3);border-radius:4px;display:grid;place-items:center;font-style:normal;font-weight:700}
.check button[aria-pressed="true"] i{background:var(--good);border-color:var(--good);color:var(--bg)}
.check button small{display:block;color:var(--bone-3);font-size:12px}
.meter{height:10px;background:var(--raise);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--bronze)}
.meter.over i{background:var(--crimson)}

/* Bericht */
.report{text-align:center;display:grid;gap:14px;justify-items:center;padding-top:18px}
.report .logo{width:96px;height:96px}
.recs{display:grid;gap:6px;width:100%;text-align:left}
.rec{display:flex;justify-content:space-between;background:var(--raise);border:1px solid var(--bronze-2);border-radius:6px;padding:10px 12px}
.rec b{font-family:var(--display);color:var(--bronze);font-weight:500}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

// Strichfigur mit fester Gliederlänge. Eine Pose nennt nur Hüfte (p), Rumpfwinkel (t), Hände und Füsse;
// Ellbogen und Knie rechnet die inverse Kinematik aus. So bleiben Arme und Beine beim Animieren gleich lang.
// Seitenansicht schaut nach rechts, Boden bei y = 110.
const LEN = {T:34, UA:17, FA:16, TH:23, SH:22, TOE:7, HO:11, HR:7};
const D2R = Math.PI / 180;

function ik(a, t, l1, l2, s){
  const dx = t[0]-a[0], dy = t[1]-a[1], d = Math.hypot(dx, dy) || 0.001, max = l1 + l2 - 0.01;
  if (d >= max){ const ux = dx/d, uy = dy/d; return [[a[0]+ux*l1, a[1]+uy*l1], [a[0]+ux*max, a[1]+uy*max]]; }
  const base = Math.atan2(dy, dx), c = Math.max(-1, Math.min(1, (l1*l1 + d*d - l2*l2) / (2*l1*d))), ang = Math.acos(c);
  return [[a[0]+l1*Math.cos(base+s*ang), a[1]+l1*Math.sin(base+s*ang)], t];
}

// Spezifikation -> Schlüsselwerte (Hüfte, Winkel, Ziele), die sich linear mischen lassen
function keyOf(sp){
  let p, t, lg = sp.lg;
  if (sp.L){ // Brett-Linie ab den Füssen: L = [Fuss x, Fuss y, Winkel]
    const [fx, fy, a] = sp.L, ux = Math.cos(a*D2R), uy = Math.sin(a*D2R);
    p = [fx + 45*ux, fy + 45*uy]; t = a;
    if (!lg) lg = [[fx, fy, 1, sp.toe ?? 60]];
  } else if (sp.S){ // Linie ab den Schultern: S = [Schulter x, y, Winkel Richtung Füsse]
    const [nx, ny, a] = sp.S, ux = Math.cos(a*D2R), uy = Math.sin(a*D2R);
    p = [nx + LEN.T*ux, ny + LEN.T*uy]; t = a + 180;
    if (!lg) lg = [[nx + 79*ux, ny + 79*uy, 1, sp.toe ?? null]];
  } else { p = sp.p; t = sp.t ?? -90; }
  return {p, t, bow: sp.bow || 0, hd: sp.hd || 0, hx: sp.hx || 0, ar: sp.ar || [], lg: lg || [], ball: sp.ball};
}
function mixKey(A, B, k){
  const l = (a, b) => a + (b - a) * k;
  let dt = B.t - A.t; if (dt > 180) dt -= 360; if (dt < -180) dt += 360;
  return {
    p:[l(A.p[0],B.p[0]), l(A.p[1],B.p[1])], t: A.t + dt*k, bow: l(A.bow,B.bow), hd: l(A.hd,B.hd), hx: l(A.hx,B.hx), ball: A.ball,
    ar: A.ar.map((h,i)=>[l(h[0],B.ar[i][0]), l(h[1],B.ar[i][1]), h[2]]),
    lg: A.lg.map((f,i)=>[l(f[0],B.lg[i][0]), l(f[1],B.lg[i][1]), f[2], f[3]==null ? null : l(f[3], B.lg[i][3] ?? f[3])])
  };
}
function solve(K){
  const ux = Math.cos(K.t*D2R), uy = Math.sin(K.t*D2R);
  const n = [K.p[0] + LEN.T*ux, K.p[1] + LEN.T*uy];
  const hd = (K.t + K.hd) * D2R, h = [n[0] + LEN.HO*Math.cos(hd) + K.hx, n[1] + LEN.HO*Math.sin(hd)];
  const m = [(n[0]+K.p[0])/2 + K.bow*uy, (n[1]+K.p[1])/2 - K.bow*ux];
  const arms = K.ar.map(a => { const [e, w] = ik(n, [a[0],a[1]], LEN.UA, LEN.FA, a[2]); return [e, w]; });
  const legs = K.lg.map(f => {
    const [k, an] = ik(K.p, [f[0],f[1]], LEN.TH, LEN.SH, f[2]);
    const toe = f[3]==null ? null : [an[0] + LEN.TOE*Math.cos(f[3]*D2R), an[1] + LEN.TOE*Math.sin(f[3]*D2R)];
    return [k, an, toe];
  });
  return {n, h, m, p:K.p, arms, legs, ball:K.ball};
}

const FIG_KEYS = new Map();
function figKeys(id){
  if (!FIG_KEYS.has(id)){ const f = FIGS[id]; FIG_KEYS.set(id, f.k.map(keyOf)); }
  return FIG_KEYS.get(id);
}
// ---------- Körper-Darstellung v2 ----------
// Statt Strichen ein Körper mit Volumen: Rumpf, Arme, Beine als runde Glieder mit Umriss.
// Die arbeitenden Muskeln einer Übung leuchten rot. Die abgewandte Körperseite ist dunkler (Tiefe).
const FRONT_VIEW = new Set(["circles","wallangel","lat","dbpress","cossack","twist"]);
const SEG_W = {chest:16, belly:13, neck:6, ua:8.5, fa:6.5, th:11.5, sh:8.5, ft:5};
const MUSCLE_SEG = {
  brust:["chest"], schulter_vorne:["chest","delt"], schulter_seite:["delt"], schulter_hinten:["delt","chest"],
  ruecken_breit:["chest"], ruecken_oben:["chest"], nacken:["neck"], ruecken_unten:["belly"],
  bauch:["belly"], bauch_seite:["belly"], hueftbeuger:["belly","th"],
  trizeps:["ua"], bizeps:["ua"], unterarm:["fa"], handgelenk:["fa"], finger:["fa"],
  po:["hip","th"], bein_vorne:["th"], bein_hinten:["th"], bein_innen:["th"], wade:["sh"], schienbein:["sh"], fuss:["ft"]
};
function figSVG(id, muscles = [], cls = ""){
  const f = FIGS[id] || FIGS.squat;
  const props = (f.props || []).map(([k, x]) => PROP[k](x)).join("");
  return `<svg class="fig ${cls}" viewBox="14 -16 172 130" data-fig="${id}" data-mu="${muscles.join(" ")}" aria-hidden="true">
    <path class="ground" d="M14 111 H186"/>${props}<g class="ghost"></g><g class="live"></g></svg>`;
}
function segEls(k){ return `<line class="ol" data-s="${k}"/><line class="sk" data-s="${k}"/><line class="mu" data-s="${k}"/>`; }
function figBody(id){
  const front = FRONT_VIEW.has(id);
  const limb = (side, i) => `<g class="${side}" data-i="${i}">` + segEls("th") + segEls("sh") + segEls("ft") + `</g>`;
  const arm = (side, i) => `<g class="${side}" data-a="${i}">` + segEls("ua") + segEls("fa") + `</g>`;
  const far = front ? "near" : "far";
  return limb(far,1) + arm(far,1) +
    `<g class="near">${segEls("neck")}${segEls("belly")}${segEls("chest")}<circle class="hipc" r="6.5"/><circle class="delt" r="5.6"/></g>` +
    limb("near",0) + arm("near",0) +
    `<rect class="db" data-k="d0" width="13" height="7" rx="2"/><rect class="db" data-k="d1" width="13" height="7" rx="2"/><circle class="ball" data-k="b" r="7"/>` +
    `<circle class="headol" data-k="ho" r="9.6"/><circle class="head" data-k="h" r="8"/>`;
}
function setLine(els, a, b, w){
  els.forEach(el => {
    if (!a || !b){ el.style.display = "none"; return; }
    el.style.display = ""; el.setAttribute("x1", a[0].toFixed(1)); el.setAttribute("y1", a[1].toFixed(1)); el.setAttribute("x2", b[0].toFixed(1)); el.setAttribute("y2", b[1].toFixed(1));
    const c = el.getAttribute("class"); el.setAttribute("stroke-width", c === "ol" ? w + 3.2 : c === "mu" ? Math.max(2, w - 3.5) : w);
  });
}
function figDraw(g, id, S){
  const f = FIGS[id], q = sel => g.querySelectorAll(sel);
  const seg = (scope, k, a, b) => setLine([...scope.querySelectorAll(`[data-s="${k}"]`)], a, b, SEG_W[k]);
  const core = g.querySelector(".near");
  seg(core, "chest", S.n, S.m); seg(core, "belly", S.m, S.p); seg(core, "neck", S.n, S.h);
  [0,1].forEach(i => {
    const ag = g.querySelector(`[data-a="${i}"]`), a = S.arms[i];
    if (ag){ ag.style.display = a ? "" : "none"; if (a){ seg(ag, "ua", S.n, a[0]); seg(ag, "fa", a[0], a[1]); } }
    const lg = g.querySelector(`[data-i="${i}"]`), l = S.legs[i];
    if (lg){ lg.style.display = l ? "" : "none"; if (l){ seg(lg, "th", S.p, l[0]); seg(lg, "sh", l[0], l[1]); seg(lg, "ft", l[1], l[2]); } }
  });
  const hc = g.querySelector(".hipc"); hc.setAttribute("cx", S.p[0]); hc.setAttribute("cy", S.p[1]);
  const dc = g.querySelector(".delt"); dc.setAttribute("cx", S.n[0]); dc.setAttribute("cy", S.n[1]);
  [0,1].forEach(i => { const r = g.querySelector(`[data-k="d${i}"]`), on = (f.db || []).includes(i) && S.arms[i]; r.style.display = on ? "" : "none"; if (on){ r.setAttribute("x", S.arms[i][1][0]-6.5); r.setAttribute("y", S.arms[i][1][1]-3.5); } });
  const b = g.querySelector('[data-k="b"]'); if (S.ball && S.arms[1]){ b.style.display = ""; b.setAttribute("cx", (S.arms[0][1][0]+S.arms[1][1][0])/2); b.setAttribute("cy", S.arms[0][1][1]-4); } else b.style.display = "none";
  ["h","ho"].forEach(k => { const h = g.querySelector(`[data-k="${k}"]`); h.setAttribute("cx", S.h[0].toFixed(1)); h.setAttribute("cy", S.h[1].toFixed(1)); });
}
function figMuscles(svg, muscles){
  const on = new Set(); muscles.forEach(m => (MUSCLE_SEG[m] || []).forEach(s => on.add(s)));
  svg.querySelectorAll(".mu").forEach(el => el.classList.toggle("on", on.has(el.dataset.s)));
  svg.querySelectorAll(".hipc").forEach(el => el.classList.toggle("on", on.has("hip")));
  svg.querySelectorAll(".delt").forEach(el => el.classList.toggle("on", on.has("delt")));
}
function figState(id, now){
  const f = FIGS[id], K = figKeys(id), n = K.length;
  const ease = x => 0.5 - 0.5*Math.cos(Math.PI*x);
  if (n === 2){
    let x = (now % (2*f.ms)) / (2*f.ms), k;
    if (f.asym){ k = x < f.asym ? ease(x/f.asym) : ease(1 - (x-f.asym)/(1-f.asym)); }
    else k = ease(x < .5 ? x*2 : 2 - x*2);
    return solve(mixKey(K[0], K[1], k));
  }
  const c = (now / f.ms) % n, i = Math.floor(c);
  return solve(mixKey(K[i], K[(i+1) % n], ease(c - i)));
}
// Alle sichtbaren Figuren in einem Takt animieren; ausserhalb des Bildschirms pausieren sie
const live = new Set();
const figObserver = typeof IntersectionObserver === "function" ? new IntersectionObserver(es => es.forEach(e => { e.target.__vis = e.isIntersecting; }), {rootMargin:"100px"}) : null;
function mountFigs(root){
  root.querySelectorAll("svg.fig").forEach(svg => {
    if (svg.dataset.ready) return; svg.dataset.ready = 1;
    const id = svg.dataset.fig, g = svg.querySelector(".live"), ghost = svg.querySelector(".ghost");
    g.innerHTML = figBody(id);
    const K = figKeys(id), mus = (svg.dataset.mu || "").split(" ").filter(Boolean);
    if (REDUCED){ ghost.innerHTML = figBody(id); figDraw(ghost, id, solve(K[K.length-1])); }
    figDraw(g, id, solve(K[0])); figMuscles(svg, mus);
    svg.__vis = true; if (figObserver) figObserver.observe(svg);
    if (!REDUCED) live.add({svg, g, id});
  });
}
function figLoop(now){
  for (const it of live){ if (!it.svg.isConnected){ live.delete(it); figObserver && figObserver.unobserve(it.svg); continue; } if (it.svg.__vis !== false) figDraw(it.g, it.id, figState(it.id, now)); }
  requestAnimationFrame(figLoop);
}
const REDUCED = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
if (!REDUCED && typeof requestAnimationFrame === "function") requestAnimationFrame(figLoop);

// ---------- Datum ----------
const dkey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return dkey(d); };
const today = () => dkey(new Date());
const dayIdx = k => (parse(k).getDay() + 6) % 7;
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const longDate = k => { const d = parse(k); return `${DAYS_LONG[dayIdx(k)]} ${d.getDate()}. ${MONTHS[d.getMonth()]}`; };

// ---------- Programm ----------
function weekOf(k){ return Math.floor(diffDays(S.settings.start, k) / 7) + 1; }
function progWeek(w){ if (w < 1) w = 1; if (w > 52) w = 40 + ((w - 53) % 13); return PROG.wochen[w - 1]; }
function progDay(k){ const w = weekOf(k); return { w, week: progWeek(w), day: progWeek(w).tage[dayIdx(k)], pre: w < 1 }; }
function phaseOf(w){ const ph = PROG._meta.phasen; return ph.find(p => w >= p.von && w <= p.bis) || ph[ph.length - 1]; }
const ROMAN = ["I","II","III","IV"];
const exName = id => EX[id]?.name || (S.custom.find(c => c.id === id) || {}).name || id;
const muscleShort = k => (META.muskeln[k] || k).split(" (")[0];

const isSec = u => u === "sek" || u === "sek_seite";

// Ablauf eines Tages: eine Übung nach der anderen (Regel 1)
function buildSteps(day, log){
  const steps = [];
  const pre = PROG._meta.vorDemTraining?.antworten || [];
  const preGroups = new Set(pre.filter(a => log.pre.includes(a.text)).flatMap(a => a.gruppen));
  (day.plan || []).forEach((b, bi) => {
    const once = b.block === "aufwaermen" || b.block === "abschluss" || b.block === "test";
    let rounds = once ? 1 : (b.runden || 1);
    if (!once && log.light) rounds = Math.max(1, rounds - 1);
    if (b.block === "paar" && preGroups.size && b.uebungen.some(u => preGroups.has(EX[log.swaps[`${bi}.${b.uebungen.indexOf(u)}`] || u.id]?.gruppe))) rounds = Math.max(1, rounds - 1);
    for (let r = 1; r <= rounds; r++) b.uebungen.forEach((u, ui) => {
      const id = log.swaps[`${bi}.${ui}`] || u.id;
      let ziel = u.ziel; if (log.light && ziel) ziel = Math.max(1, Math.round(ziel * .8));
      steps.push({ key:`${bi}.${ui}.${r}`, bi, ui, r, rounds, block:b.block, title:b.titel, id, ziel, bereich:u.bereich, einheit:u.einheit || EX[id]?.einheit || "wdh",
        tempo:u.tempo || null, kg:u.hantelKg || null, text:u.text || null, test: b.block === "test",
        pause: once ? (b.block === "test" ? 90 : 10) : (b.pauseSek || 35) });
    });
  });
  return steps;
}

// Verlauf: letzter Wert und Rekord pro Übung (ohne den Tag k)
function history(id, k){
  let last = null, lastDate = null, best = null;
  Object.keys(S.logs).sort().forEach(d => {
    if (d >= k) return;
    const vals = Object.values(S.logs[d].sets).filter(s => s.id === id).map(s => s.v);
    (S.logs[d].extra || []).filter(e => e.id === id).forEach(e => vals.push(e.v));
    if (!vals.length) return;
    const m = Math.max(...vals); last = m; lastDate = d; best = best == null ? m : Math.max(best, m);
  });
  return { last, lastDate, best };
}

function quotes(){

}
function dayPick(list, salt = 0){ if (!list?.length) return null; const n = diffDays("2026-01-01", today()) + salt; return list[((n % list.length) + list.length) % list.length]; }
function line(kind){
  const own = MOT.saetze?.[kind] || MOT.eigene?.[kind];
  const fb = { start:["Heute zählt nur diese eine Übung. Dann die nächste."], pause:["Atmen. Gleich wieder."], ende:["Erledigt. So baut man einen Körper: Tag für Tag."],
    rekord:["Neuer Rekord. Gestern geschlagen."], verpasst:["Ein verpasster Tag ist kein verlorener Krieg. Heute wieder."] }[kind];
  const l = Array.isArray(own) && own.length ? own : fb;
  const pick = dayPick(l, kind.length); return typeof pick === "string" ? pick : (pick?.text || "");
}
function weeksDone(){
  const done = new Set(); Object.entries(S.logs).forEach(([d, l]) => { if (l.done) done.add(weekOf(d)); });
  let n = 0; done.forEach(w => { const c = DAYS.slice(0,6).filter((_, i) => S.logs[addDays(S.settings.start, (w-1)*7 + i)]?.done).length; if (c >= 4) n++; });
  return n;
}
function rank(){
  const r = MOT.raenge || MOT.raenge_list || [{ab:0,name:"Rekrut"},{ab:2,name:"Agoge-Schüler"},{ab:4,name:"Hoplit"},{ab:8,name:"Veteran"},{ab:13,name:"Krieger"},{ab:26,name:"Spartiat"},{ab:39,name:"Polemarch"},{ab:52,name:"Legende"}];
  const w = weeksDone(); let cur = r[0], next = null;
  r.forEach((x, i) => { const ab = x.ab ?? x.wochen ?? 0; if (w >= ab){ cur = x; next = r[i+1] || null; } });
  return { name: cur.name, next, w };
}
function streak(){
  let k = today(), n = 0; if (!S.logs[k]?.done) k = addDays(k, -1);
  for (let i = 0; i < 400; i++){ if (dayIdx(k) === 6){ k = addDays(k, -1); continue; } if (k < S.settings.start) break; if (S.logs[k]?.done){ n++; k = addDays(k, -1); } else break; }
  return n;
}

function glossify(text){
  let out = esc(text); const used = new Set();
  Object.keys(META.glossar || {}).sort((a, b) => b.length - a.length).forEach(w => {
    if (used.has(w)) return;
    const re = new RegExp(`(^|[^\\p{L}>])(${w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})(?![\\p{L}])`, "iu");
    if (re.test(out)){ out = out.replace(re, (m, a, b) => `${a}<button class="gl" data-gl="${esc(w)}">${b}</button>`); used.add(w); }
  });
  return out;
}

    if (!ex){ let c = S.custom.find(c => c.name.toLowerCase() === name.toLowerCase()); if (!c){ c = {id:"c" + Date.now().toString(36), name, einheit:"wdh"}; S.custom.push(c); } ex = c; }

// ---------- AGOGE (Training, Schritt für Schritt) ----------
let T = null; // laufender Timer
function stopTimers(){ if (T){ clearInterval(T.iv); T = null; } unlockScreen(); }
function viewAgoge(){
  const k = today(), { day } = progDay(k), log = logOf(k);
  if (!day.plan){ location.hash = "#heute"; return; }
  const steps = buildSteps(day, log);
  log.pos = Math.min(log.pos || 0, steps.length - 1); save();
  lockScreen();
  renderStep(steps, log, k);
}
function renderStep(steps, log, k){
  stopTimers(); lockScreen();
  const i = log.pos, s = steps[i], u = EX[s.id] || {name: exName(s.id), schritte:[], muskeln:[], fehler:[]};
  const h = history(s.id, k), next = steps[i + 1];
  const started = log.started || Date.now(); log.started = started;
  const remainMin = steps.slice(i).reduce((a, x) => a + (isSec(x.einheit) ? (x.ziel || 20) : (x.ziel || 10) * 3) + x.pause, 0) / 60;
  const endAt = new Date(Date.now() + remainMin * 6e4);
  const prev = log.sets[s.key]?.v;
  const startVal = prev ?? (h.last != null ? h.last : (s.ziel || 0));
  const goal = s.test ? "Maximum" : (s.bereich ? `${s.bereich[0]}–${s.bereich[1]}` : (s.ziel ?? ""));
  const vid = VIDEOS[s.id];
  const showKg = (u.material || []).includes("hanteln");
  $("#view").innerHTML = `
    <div class="ag-top">
      <div class="row"><a class="icon-btn" href="#heute" aria-label="Zurück zu Heute">${ICON.back}</a>
        <div class="grow ag-meta"><span class="num">Übung ${i + 1} von ${steps.length}</span><span class="num" id="clock">0:00</span><span class="num">fertig ca. ${String(endAt.getHours()).padStart(2,"0")}:${String(endAt.getMinutes()).padStart(2,"0")}</span></div></div>
      <div class="ag-prog"><i style="width:${(i / steps.length) * 100}%"></i></div>
    </div>
    <div class="ag-card">
      <div class="eyebrow">${esc(s.title)}${s.rounds > 1 ? ` · ${s.rounds - s.r === 0 ? "letztes Mal" : `noch ${s.rounds - s.r + 1} Mal`}` : ""}</div>
      ${figSVG(s.id, u.muskeln || [])}
      <h2 class="ag-name">${esc(u.name)}</h2>
      <div class="chips">${(u.muskeln || []).slice(0, 4).map(m => `<span class="mchip">${esc(muscleShort(m))}</span>`).join("")}</div>
      <div class="goal"><b class="num">${esc(goal)}</b><span>${esc(s.test ? (s.text || "") : unitText(s.einheit))}${s.kg ? ` · ${S.settings.hantelKg} kg` : ""}</span></div>
      ${h.last != null ? `<div class="beat"><span>Letztes Mal <b class="num">${h.last}</b></span><span>Heute? <b class="num">${h.last + 1}</b></span><span>Rekord <b class="num">${h.best}</b></span></div>` : ""}

      ${isSec(s.einheit) ? `<button class="watch" id="watch">Stoppuhr starten</button>` : ""}

      ${showKg ? `<div class="row small"><span>Hanteln</span><button class="chip" id="kgm">−</button><b class="num" id="kgv">${S.settings.hantelKg} kg</b><button class="chip" id="kgp">+</button></div>` : ""}

      <div class="ag-tools">
        <button class="btn" id="easier">${u.leichter ? "Zu schwer?" : "Leichter?"}</button>

      </div>
      <div id="panel"></div>

        <button class="btn ghost sm" id="prev" ${i === 0 ? "disabled" : ""}>Zurück</button>

  $("#watch")?.addEventListener("click", () => {
    const b = $("#watch");
    if (T && T.kind === "watch"){ const sec = T.start ? Math.round((Date.now() - T.start) / 1000) : 0; stopTimers(); lockScreen(); b.classList.remove("run"); b.textContent = "Stoppuhr starten"; if (sec) val.value = sec; return; }
    stopTimers(); lockScreen(); b.classList.add("run");
    T = {kind:"watch", start:0, prep: Date.now() + 3000, last:4};
    T.iv = setInterval(() => {
      if (!T.start){ const left = Math.ceil((T.prep - Date.now()) / 1000); if (left <= 0){ T.start = Date.now(); beep(); } else if (left !== T.last){ T.last = left; beep(620, .06); b.textContent = `Bereit … ${left}`; } }

      <button class="btn wide" id="painJoint">Gelenk sticht: leichtere oder andere Übung</button>

}

function muscleLoad(days){

  const st = {}; Object.entries(c).forEach(([m, n]) => st[m] = n >= 9 ? 3 : n >= 5 ? 2 : 1);

}

// ---------- SKILLS ----------
function ladderPos(L){
  if (S.skills[L.id]) return S.skills[L.id];
  const done = new Set(D.skills._meta?.startStand?.geschafft || []);
  let pos = 1; L.stufen.forEach(st => { if (done.has(st.uebung)) pos = Math.max(pos, st.nr + 1); });
  if (pos === 1 && L.startUebung){ const st = L.stufen.find(x => x.uebung === L.startUebung); if (st) pos = st.nr; }
  return Math.min(pos, L.stufen.length);
}
function viewSkills(){
  $("#view").innerHTML = `<div class="stack"><div><div class="eyebrow">Skill-Leitern</div><h1 class="title-xl" style="margin-top:6px">Meisterschaft</h1>
    <p class="muted" style="margin-top:6px">${esc(D.skills._meta?.regel || "")}</p></div>
    ${D.skills.leitern.map(L => { const pos = ladderPos(L), cur = L.stufen.find(s => s.nr === pos) || L.stufen[L.stufen.length - 1]; const ex = EX[cur.uebung] || {};
      return `<div class="card" id="L-${L.id}"><div class="split"><h3>${esc(L.name)}</h3><span class="small num">Stufe ${pos} von ${L.stufen.length}</span></div>
        <div style="margin-top:10px">${figSVG(cur.uebung, ex.muskeln || [])}</div>
        <p style="margin-top:10px"><b>${esc(cur.name)}</b></p><p class="hint" style="margin-top:6px">Test: ${esc(cur.test.text)}</p>
        <button class="btn wide" style="margin-top:10px" data-pass="${L.id}">Test geschafft ✓</button>
        <div class="ladder" style="margin-top:12px">${L.stufen.map(st => `<div class="lstep ${st.nr < pos ? "done" : st.nr === pos ? "cur" : "lock"}"><span class="ic">${st.nr < pos ? "✓" : st.nr === pos ? "●" : "○"}</span><span>${esc(st.name)}</span><small class="num">${st.test.wert} ${esc(D.skills._meta.einheiten?.[st.test.einheit] || st.test.einheit)}</small></div>`).join("")}</div></div>`; }).join("")}
  </div>`;
  $$("[data-pass]").forEach(b => b.onclick = () => {
    if (b.dataset.armed !== "1"){ b.dataset.armed = "1"; b.textContent = "Wirklich sauber geschafft? Nochmal tippen"; setTimeout(() => { b.dataset.armed = ""; b.textContent = "Test geschafft ✓"; }, 3500); return; }
    const L = D.skills.leitern.find(x => x.id === b.dataset.pass); const pos = ladderPos(L);
    if (pos >= L.stufen.length){ toast("Höchste Stufe erreicht. Legende."); return; }
    S.skills[L.id] = pos + 1; save(); toast(`Freigeschaltet: ${L.stufen[pos].name}`); viewSkills(); mountFigs($("#view"));
  });
}

// ---------- KÖRPER ----------
function weightChart(){
  const W = S.body.w; if (W.length < 2) return `<p class="small">Ab 2 Messungen siehst du hier die Kurve.</p>`;
  const X0 = 36, X1 = 300, Y0 = 130, Y1 = 12, start = W[0].d, span = Math.max(7, diffDays(start, W[W.length - 1].d));
  const vals = W.map(x => x.kg); const lo = Math.floor(Math.min(...vals) - .5), hi = Math.ceil(Math.max(...vals, W[0].kg + span / 7 * .5) + .5);
  const x = d => X0 + (X1 - X0) * diffDays(start, d) / span, y = v => Y0 - (Y0 - Y1) * (v - lo) / (hi - lo || 1);
  let s = ""; for (let v = lo; v <= hi; v++) if ((hi - lo) <= 6 || v % 2 === 0) s += `<line class="gl1" x1="${X0}" x2="${X1}" y1="${y(v)}" y2="${y(v)}"/><text x="2" y="${y(v) + 3}">${v} kg</text>`;
  const e = W[W.length - 1].d; s += `<polygon class="band" points="${x(start)},${y(W[0].kg)} ${x(e)},${y(W[0].kg + diffDays(start, e) / 7 * .25)} ${x(e)},${y(W[0].kg + diffDays(start, e) / 7 * .5)}"/>`;
  s += `<polyline class="ln" points="${W.map(p => `${x(p.d)},${y(p.kg)}`).join(" ")}"/>` + W.map((p, i) => `<circle class="${i === W.length - 1 ? "end" : "pt"}" cx="${x(p.d)}" cy="${y(p.kg)}" r="${i === W.length - 1 ? 4.5 : 2.5}"/>`).join("");
  return `<svg class="chart" viewBox="0 0 310 150" role="img" aria-label="Gewichtsverlauf">${s}</svg><p class="small">Bronzenes Band = Ziel +0.25 bis +0.5 kg pro Woche.</p>`;
}
function viewKoerper(){
  const k = today(), mon = addDays(k, -dayIdx(k)), weekDays = DAYS.map((_, i) => addDays(mon, i));
  const recs = {}, skipG = new Set(["aufwaermen","dehnen","haltung"]); Object.keys(S.logs).forEach(d => { Object.values(S.logs[d].sets).forEach(s => { if (skipG.has(EX[s.id]?.gruppe)) return; recs[s.id] = Math.max(recs[s.id] || 0, s.v); }); (S.logs[d].extra || []).forEach(e => { recs[e.id] = Math.max(recs[e.id] || 0, e.v); }); });
  const W = S.body.w, gain = W.length > 1 ? (W[W.length - 1].kg - W[0].kg) : 0;
  const lastPhoto = S.body.photos[S.body.photos.length - 1], nextPhoto = lastPhoto ? addDays(lastPhoto, 14) : S.settings.start;
  const M = S.body.m[S.body.m.length - 1] || {};
  $("#view").innerHTML = `<div class="stack">
    <div><div class="eyebrow">Fortschritt</div><h1 class="title-xl" style="margin-top:6px">Dein Körper</h1></div>
    <div class="tiles"><div class="tile"><b class="num">${latestKg()}</b><span>kg aktuell</span></div><div class="tile"><b class="num">${gain >= 0 ? "+" : ""}${gain.toFixed(1)}</b><span>kg seit Start</span></div></div>
    <div class="card"><div class="kicker">Gewicht</div>${weightQuick()}<div style="margin-top:12px">${weightChart()}</div></div>
    <div class="card"><div class="kicker">Diese Woche trainiert</div>${muscleMapSVG(muscleLoad(weekDays))}<p class="small" style="margin-top:6px">Je röter, desto mehr harte Sätze. Graue Muskeln kommen zu kurz.</p></div>
    <div class="card"><div class="kicker">Rekorde</div><div class="list">${Object.keys(recs).length ? Object.entries(recs).sort((a, b) => exName(a[0]).localeCompare(exName(b[0]))).map(([id, v]) => `<div class="line"><span>${esc(exName(id))}</span><b class="num">${v}</b></div>`).join("") : `<p class="small">Noch keine. Nach dem ersten Training stehen sie hier.</p>`}</div></div>
    <div class="card"><div class="kicker">Masse · einmal im Monat</div>
      <div class="tiles">${[["arm","Oberarm"],["brust","Brust"],["taille","Taille"],["bein","Oberschenkel"]].map(([kk, l]) => `<label class="lbl">${l} (cm)<input class="field" data-m="${kk}" type="number" step="0.5" inputmode="decimal" value="${M[kk] ?? ""}"></label>`).join("")}</div>
      <button class="btn wide" id="mSave" style="margin-top:10px">Masse speichern</button>${M.d ? `<p class="small" style="margin-top:6px">Zuletzt: ${longDate(M.d)}</p>` : ""}</div>
    <div class="card"><div class="kicker">Fotos · alle 2 Wochen</div><p class="muted">${nextPhoto <= k ? "Heute fällig" : `Nächste: ${longDate(nextPhoto)}`}. Gleiches Licht, gleiche Zeit: vorne, seitlich, hinten. Die Fotos bleiben auf deinem Handy.</p>
      <button class="btn wide" id="pSave" style="margin-top:10px">Fotos gemacht</button></div>
  </div>`;
  bindWeight();
  $("#mSave").onclick = () => { const m = {d:k}; $$("[data-m]").forEach(i => { const v = parseFloat(String(i.value).replace(",", ".")); if (v) m[i.dataset.m] = v; }); S.body.m.push(m); save(); toast("Masse gespeichert"); };
  $("#pSave").onclick = () => { S.body.photos.push(k); save(); toast("Notiert. Nächste Fotos in 2 Wochen."); viewKoerper(); };
}

// ---------- ESSEN ----------
function targets(){
  const kg = latestKg(), { cm, alter } = S.profile, R = D.nut.rechnung;
  const r50 = v => Math.round(v / 50) * 50, r5 = v => Math.round(v / 5) * 5;
  return { kcal: r50((10 * kg + 6.25 * cm - 5 * alter + 5) * R.aktivitaet + R.plusZunehmen), protein: r5(R.proteinProKg * kg), kg };
}
function viewEssen(){
  const k = today(), f = (S.food[k] ||= {checks:[], koffein:[]}), t = targets(), N = D.nut;
  const mg = f.koffein.reduce((a, x) => a + x, 0), max = Math.round((N.koffein.maxMgProKg || 3) * t.kg), late = new Date().getHours() >= (N.koffein.nachUhr || 14);
  $("#view").innerHTML = `<div class="stack">
    <div><div class="eyebrow">Ohne Kalorienzählen</div><h1 class="title-xl" style="margin-top:6px">Essen</h1></div>
    <div class="tiles"><div class="tile"><b class="num">${t.kcal}</b><span>kcal pro Tag</span></div><div class="tile"><b class="num">${t.protein} g</b><span>Protein pro Tag</span></div></div>
    <p class="small">Aus ${t.kg} kg, ${S.profile.cm} cm, ${S.profile.alter} Jahren. Ziel: +0.25 bis +0.5 kg pro Woche.</p>
    <div class="card"><div class="split"><span class="kicker" style="margin:0">Heute</span><span class="small num">${f.checks.length} / ${N.checkliste.length}</span></div>
      <div class="check" style="margin-top:10px">${N.checkliste.map(c => `<button data-c="${c.id}" aria-pressed="${f.checks.includes(c.id)}"><i>${f.checks.includes(c.id) ? "✓" : ""}</i><span>${esc(c.text)}<small>${esc(c.tipp || "")}</small></span></button>`).join("")}</div></div>
    <div class="card"><div class="split"><span class="kicker" style="margin:0">Koffein heute</span><span class="small num">${mg} / ${max} mg</span></div>
      <div class="meter ${mg > max ? "over" : ""}" style="margin-top:8px"><i style="width:${Math.min(100, mg / max * 100)}%"></i></div>
      <p class="small" style="margin-top:6px">${mg > max ? "Über der Grenze. Kein Koffein mehr heute, viel Wasser trinken." : late ? `Nach ${N.koffein.nachUhr} Uhr: kein Koffein mehr, sonst schläfst du schlecht.` : esc(N.koffein.text)}</p>
      <div class="chips" style="margin-top:8px">${N.koffein.getraenke.map((g, i) => `<button class="chip" data-k="${i}">+ ${esc(g.name)} (${g.mg})</button>`).join("")}${f.koffein.length ? `<button class="chip" id="kUndo">Rückgängig</button>` : ""}</div></div>
    <div class="card"><div class="kicker">Mahlzeiten ohne Kochen</div><div class="list">${N.mahlzeiten.map(m => `<details class="more"><summary class="plain">${esc(m.name)} · ${m.kcal} kcal · ${m.protein} g Protein</summary><p class="small" style="margin-top:4px">${esc((m.zutaten || []).join(", "))}${m.hinweis ? ` · ${esc(m.hinweis)}` : ""}${m.preis ? ` · ca. ${m.preis.toFixed(2)} Fr.` : ""}</p></details>`).join("")}</div></div>
    <div class="card"><div class="kicker">Einkauf pro Woche</div><div class="list">${N.einkauf.proWoche.map(e => `<div class="line"><span>${esc(e.was)}</span><b class="num">${esc(e.menge)}</b></div>`).join("")}</div>${N.einkauf.summeCHF ? `<p class="small" style="margin-top:6px">Ca. ${N.einkauf.summeCHF} Fr. pro Woche (Schätzung).</p>` : ""}</div>
    ${N.nichtNehmen ? `<div class="card"><details class="more"><summary>Nicht nehmen (unter 18)</summary><ul class="steps" style="margin-top:6px">${(Array.isArray(N.nichtNehmen) ? N.nichtNehmen : N.nichtNehmen.liste || []).map(x => `<li>${esc(typeof x === "string" ? x : (x.was || x.text || ""))}${x.warum ? `: ${esc(x.warum)}` : ""}</li>`).join("")}</ul></details></div>` : ""}
  </div>`;
  $$("[data-c]").forEach(b => b.onclick = () => { const id = b.dataset.c; f.checks = f.checks.includes(id) ? f.checks.filter(x => x !== id) : [...f.checks, id]; save(); viewEssen(); });
  $$("[data-k]").forEach(b => b.onclick = () => { f.koffein.push(N.koffein.getraenke[Number(b.dataset.k)].mg); save(); viewEssen(); });
  $("#kUndo")?.addEventListener("click", () => { f.koffein.pop(); save(); viewEssen(); });
}

// ---------- EINSTELLUNGEN ----------
function viewSettings(){
  const P = S.profile;
  $("#view").innerHTML = `<div class="stack">
    <div><div class="eyebrow">Einstellungen</div><h1 class="title-xl" style="margin-top:6px">Dein Profil</h1></div>
    <div class="card"><div class="tiles">
      <label class="lbl">Name<input class="field" id="sName" value="${esc(P.name)}" placeholder="Jive"></label>
      <label class="lbl">Alter<input class="field" id="sAlter" type="number" inputmode="numeric" value="${P.alter}"></label>
      <label class="lbl">Grösse (cm)<input class="field" id="sCm" type="number" inputmode="numeric" value="${P.cm}"></label>
      <label class="lbl">Hanteln (kg)<input class="field" id="sKg" type="number" step="0.5" inputmode="decimal" value="${S.settings.hantelKg}"></label>
      <label class="lbl">Start des Plans<input class="field" id="sStart" type="date" value="${S.settings.start}"></label>
      <label class="lbl">Aussehen<select class="field" id="sTheme"><option value="">wie das Gerät</option><option value="dark" ${S.settings.theme === "dark" ? "selected" : ""}>Dunkel</option><option value="light" ${S.settings.theme === "light" ? "selected" : ""}>Hell</option></select></label>
    </div><button class="btn wide" id="sSave" style="margin-top:12px">Speichern</button></div>
    <div class="card"><div class="kicker">Daten sichern</div><p class="small">Alles bleibt in diesem Browser. Sichere ab und zu eine Kopie.</p>
      <div class="row wrap" style="margin-top:10px"><button class="btn sm" id="exp">Als Datei sichern</button><button class="btn sm" id="copy">Kopieren</button><label class="btn sm">Datei laden<input type="file" id="imp" accept="application/json" hidden></label></div>
      <textarea class="field" id="io" rows="3" placeholder="Oder hier eine Kopie einfügen und «Einfügen» tippen" style="margin-top:10px"></textarea>
      <button class="btn sm" id="paste" style="margin-top:8px">Einfügen</button></div>
    <div class="card"><div class="kicker">Neu anfangen</div><button class="btn sm" id="reset">Alles löschen</button></div>
    <p class="small">Winter Arc Training · Inhalte von Claude A (App, Figuren) und Claude B (Übungen, Programm, Essen). Keine Medizin: bei Schmerzen oder Unsicherheit Arzt fragen.</p>
  </div>`;
  $("#sSave").onclick = () => {
    P.name = $("#sName").value.trim(); P.alter = Number($("#sAlter").value) || P.alter; P.cm = Number($("#sCm").value) || P.cm;
    S.settings.hantelKg = parseFloat($("#sKg").value) || S.settings.hantelKg; S.settings.start = $("#sStart").value || S.settings.start; S.settings.theme = $("#sTheme").value || null;
    save(); applyTheme(); toast("Gespeichert");
  };
  const dump = () => JSON.stringify(S, null, 1);
  $("#exp").onclick = () => { try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([dump()], {type:"application/json"})); a.download = `winterarc-training-${today()}.json`; a.click(); toast("Datei wird gespeichert"); } catch(e) { $("#io").value = dump(); toast("Kopie unten, bitte selbst kopieren"); } };
  $("#copy").onclick = () => { navigator.clipboard?.writeText(dump()).then(() => toast("Kopiert"), () => { $("#io").value = dump(); $("#io").select(); toast("Unten markiert, bitte kopieren"); }); };
  const load = txt => { try { const o = JSON.parse(txt); if (o.v !== 1 || !o.logs) throw 0; S = Object.assign(fresh(), o); save(); applyTheme(); toast("Geladen"); route(); } catch(e) { toast("Das ist keine gültige Sicherung."); } };
  $("#imp").onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => load(r.result); r.readAsText(f); };
  $("#paste").onclick = () => load($("#io").value);
  $("#reset").onclick = e => { const b = e.currentTarget; if (b.dataset.armed !== "1"){ b.dataset.armed = "1"; b.textContent = "Wirklich alles löschen? Nochmal tippen"; return; } S = fresh(); save(); toast("Gelöscht"); route(); };
}

// ---------- Start ----------
function applyTheme(){ const t = S.settings.theme; if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
applyTheme();
shell();
route();
if ("serviceWorker" in navigator && location.protocol === "https:" && document.querySelector('link[rel="manifest"]')){
  addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script></body></html>
