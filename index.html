omische Formel: (6x − (5x−4))(6x + (5x−4)) = (x + 4)(11x − 4)",lang:"math",math:{form:"factored",expected:"(x+4)(11x-4)"}},{id:"i318",type:"input",q:"Faktorisiere: 2a² − 11a − 21",answers:["(2a+3)(a-7)"],why:"Kontrolle: 2a² − 14a + 3a − 21 ✓",lang:"math",math:{form:"factored",expected:"(2a+3)(a-7)"}},{id:"i319",type:"input",q:"Faktorisiere: x² + 5x + 6",answers:["(x+2)(x+3)"],why:"Produkt 6, Summe 5 → 2 und 3.",lang:"math",math:{form:"factored",expected:"(x+2)(x+3)"}},{id:"i320",type:"input",q:"Faktorisiere: ax + ay + bx + by",answers:["(a+b)(x+y)"],why:"a(x + y) + b(x + y) = (a + b)(x + y)",lang:"math",math:{form:"factored",expected:"(a+b)(x+y)"}}]}]},{id:"m4",title:"Bruchrechnen mit Termen",units:[{id:"mf",nr:"4",title:"Kürzen, erweitern, multiplizieren, dividieren, addieren, Doppelbrüche",core:["<b>Kürzen</b>: erst Zähler und Nenner faktorisieren, dann gleiche <b>Faktoren</b> streichen. Nie Summanden kürzen!","Multiplizieren: a/b · c/d = ac/bd · Dividieren: mit dem <b>Kehrwert</b> multiplizieren.","Addieren: auf den Hauptnenner bringen: 1/x + 1/y = (y + x)/(xy).","Doppelbruch: (a/b)/(c/d) = (a·d)/(b·c)."],rule:"Aus Summen kürzen nur die Dummen!",items:[{id:"i321",type:"input",q:"Kürze: (28e² − 49e)/(14e³)",answers:["(4e-7)/(2e^2)"],why:"7e(4e − 7)/(14e³) = (4e − 7)/(2e²)",lang:"math",math:{form:"reduced",expected:"(4e-7)/(2e^2)",original:"(28e^2-49e)/(14e^3)"}},{id:"i322",type:"input",q:"Kürze: (2s³ − 4s² + 2s)/(st − t)",answers:["2s(s-1)/t"],why:"2s(s − 1)²/(t(s − 1)) = 2s(s − 1)/t",lang:"math",math:{form:"reduced",expected:"2s(s-1)/t",original:"(2s^3-4s^2+2s)/(st-t)"}},{id:"i323",type:"input",q:"Kürze: (kx − ky + mx − my)/(5x − 5y)",answers:["(k+m)/5"],why:"(k + m)(x − y)/(5(x − y)) = (k + m)/5",lang:"math",math:{form:"reduced",expected:"(k+m)/5",original:"(kx-ky+mx-my)/(5x-5y)"}},{id:"i324",type:"input",q:"Kürze: (x² − 9)/(x + 3)",answers:["x-3"],why:"(x − 3)(x + 3)/(x + 3) = x − 3",lang:"math",math:{form:"reduced",expected:"x-3",original:"(x^2-9)/(x+3)"}},{id:"i325",type:"input",q:"Rechne und kürze: x/(x+1) · (x² − 1)/x²",answers:["(x-1)/x"],why:"x(x − 1)(x + 1)/((x + 1)x²) = (x − 1)/x",lang:"math",math:{form:"reduced",expected:"(x-1)/x",original:"x/(x+1)*(x^2-1)/x^2"}},{id:"i326",type:"input",q:"1/2 + 1/3 = ?",answers:["5/6"],why:"Hauptnenner 6: 3/6 + 2/6 = 5/6",lang:"math",math:{form:"fraction",expected:"5/6"}},{id:"i327",type:"input",q:"Doppelbruch: (3/4)/(6/5) = ?",answers:["5/8"],why:"3/4 · 5/6 = 15/24 = 5/8",lang:"math",math:{form:"fraction",expected:"5/8"}},{id:"i328",type:"input",q:"2/3 · 9/4 = ?",answers:["3/2"],why:"18/12 = 3/2",lang:"math",math:{form:"fraction",expected:"3/2"}}]}],exam:{id:"ma-exam",title:"Probeprüfung (Niveau leicht über der echten Prüfung)",minutes:45,intro:"Mit Taschenrechner und Formelsammlung. Lösungsweg im Kopf, Resultat hier.",questions:[{type:"choice",q:"A = [−2; 4[, B = ]1; 6]. A ∩ B = ?",options:["]1; 4[","[−2; 6]","[−2; 1]"],correct:0},{type:"open",q:"kgV(40, 100) und ggT(40, 100) über die Primfaktorzerlegung.",a:"40 = 2³·5, 100 = 2²·5² → kgV = 2³·5² = 200, ggT = 2²·5 = 20"},{type:"open",q:"(3x − 2y)(5x − 6y) als einfache Summe.",a:"15x² − 28xy + 12y²"},{type:"open",q:"(a² + 3b)² und (xy − 4a)²",a:"a⁴ + 6a²b + 9b² · x²y² − 8axy + 16a²"},{type:"open",q:"Faktorisiere: 36x² − (5x − 4)² und 2a² − 11a − 21",a:"(x + 4)(11x − 4) · (2a + 3)(a − 7)"},{type:"open",q:"Kürze: (28e² − 49e)/(14e³) und (2s³ − 4s² + 2s)/(st − t)",a:"(4e − 7)/(2e²) · 2s(s − 1)/t"},{type:"open",q:"Kürze: (kx − ky + mx − my)/(5x − 5y)",a:"(k + m)/5"}]}}],yd={id:ud,subject:bd,name:md,world:pd,lang:fd,examDate:gd,generators:vd,chapters:kd},wd="de1",$d="Deutsch",xd="Wortarten (BM1, Prüfung 29.9.)",Sd="archive",zd="de",Pd="2026-09-29",jd=JSON.parse(`[{"id":"g1","title":"Grundlagen und Verben","units":[{"id":"w1","nr":"1.1","title":"Die fünf Wortarten","core":["<b>Veränderbar:</b> Verb (konjugierbar), Nomen, Adjektiv, Pronomen (deklinierbar).","<b>Unveränderbar:</b> Partikel – mit vier Unterarten: Präposition, Konjunktion, Adverb, Interjektion.","Einzahl = <b>Singular</b>, Mehrzahl = <b>Plural</b>.","Abgetrennte Verbzusätze gehören zum Verb (sie teilt <b>mit</b> → mitteilen). «nichts, alles, wenig, viel, etwas» sind Pronomen. «am, ins, zum» sind Präpositionen."],"rule":"Konjugieren = nur Verben. Deklinieren = Nomen, Adjektive, Pronomen. Partikeln verändern sich nie.","items":[{"id":"m101","type":"choice","q":"Welche Wortart ist <b>konjugierbar</b>?","options":["Verb","Nomen","Adjektiv","Partikel"],"correct":0,"why":"Konjugieren = in die Person setzen: ich gehe, du gehst.","typeable":true},{"id":"m102","type":"choice","q":"Welche Wortart ist <b>unveränderbar</b>?","options":["Pronomen","Partikel","Adjektiv","Nomen"],"correct":1,"why":"Partikeln (Präposition, Konjunktion, Adverb, Interjektion) verändern sich nie.","typeable":true},{"id":"m103","type":"choice","q":"Welche Wortarten sind <b>deklinierbar</b>?","options":["Nomen, Adjektiv, Pronomen","nur Verben","Partikeln","Verb und Adverb"],"correct":0,"why":"Deklinieren = nach Fall, Zahl, Geschlecht verändern.","typeable":false},{"id":"i104","type":"input","q":"Fachbegriffe für «Einzahl» und «Mehrzahl»? (mit Komma)","answers":["Singular, Plural"],"why":"Singular = Einzahl, Plural = Mehrzahl.","loose":true},{"id":"s105","type":"sort","q":"Veränderbar oder unveränderbar?","bins":["veränderbar","unveränderbar"],"items":[{"x":"laufen","bin":0},{"x":"Haus","bin":0},{"x":"schön","bin":0},{"x":"dieser","bin":0},{"x":"und","bin":1},{"x":"mit","bin":1},{"x":"oben","bin":1},{"x":"ach","bin":1}],"why":"Nur die Partikeln (und, mit, oben, ach) sind unveränderbar."},{"id":"c106","type":"card","q":"Zu welcher Wortart gehören «nichts, alles, wenig, viel, etwas»?","a":"Pronomen – obwohl sie unveränderbar sind."},{"id":"c107","type":"card","q":"Zu welcher Wortart gehört «zum» (zu + dem)?","a":"Präposition – Verschmelzungen aus Partikel und Pronomen zählen zu den Partikeln."}]},{"id":"w2","nr":"1.2","title":"Verben: Arten, schwach/stark, Stammformen","core":["<b>Vollverb</b> (Kern des Satzes), <b>Hilfsverb</b> (sein, haben, werden), <b>Modalverb</b> (dürfen, müssen, können, mögen, sollen, wollen).","<b>Schwach</b>: Präteritum -te, Partizip ge…t (lernen – lernte – gelernt). <b>Stark</b>: Vokalwechsel, Partizip -en (springen – sprang – gesprungen). Mischform (denken – dachte – gedacht) = stark.","Drei <b>Stammformen</b>: Infinitiv, Präteritum, Partizip II.","<b>Finit</b> = konjugiert (ich spiele, er las). <b>Infinit</b> = Infinitiv, Partizip I (singend), Partizip II (gespielt).","<b>Verbzusatz</b>: abtrennbarer Teil, der die Bedeutung ändert: Die Sonne geht <b>auf</b> (aufgehen). Drei <b>Modi</b>: Indikativ, Konjunktiv, Imperativ."],"rule":"Verben auf -ieren haben kein ge- im Partizip II: repariert, funktioniert.","items":[{"id":"i108","type":"input","q":"Zähle alle Hilfsverben auf (mit Komma).","answers":["sein, haben, werden","haben, sein, werden","werden, sein, haben","sein, werden, haben","haben, werden, sein","werden, haben, sein"],"why":"Hilfsverben: sein, haben, werden.","loose":true},{"id":"i109","type":"input","q":"Nenne die drei Stammformen (mit Komma).","answers":["Infinitiv, Präteritum, Partizip II","Infinitiv, Präteritum, Partizip 2"],"why":"Infinitiv – Präteritum – Partizip II (gehen – ging – gegangen).","loose":true},{"id":"s110","type":"sort","q":"Hilfsverb oder Modalverb?","bins":["Hilfsverb","Modalverb"],"items":[{"x":"sein","bin":0},{"x":"haben","bin":0},{"x":"werden","bin":0},{"x":"dürfen","bin":1},{"x":"müssen","bin":1},{"x":"können","bin":1},{"x":"sollen","bin":1},{"x":"wollen","bin":1}],"why":"Modalverben: dürfen, müssen, können, mögen, sollen, wollen."},{"id":"s96","type":"sort","q":"Schwach (regelmässig) oder stark (unregelmässig)?","bins":["schwach","stark"],"items":[{"x":"sein","bin":1},{"x":"haben","bin":1},{"x":"laufen","bin":1},{"x":"essen","bin":1},{"x":"kaufen","bin":0},{"x":"spazieren","bin":0},{"x":"lernen","bin":0},{"x":"schreiben","bin":1}],"why":"schwach: Präteritum mit -te, Partizip ge…t (lernte, gelernt; -ieren ohne ge-). stark: Vokalwechsel (trank, getrunken). Mischform (denken – dachte – gedacht) zählt bei euch als stark."},{"id":"s97","type":"sort","q":"Schwach (regelmässig) oder stark (unregelmässig)?","bins":["schwach","stark"],"items":[{"x":"halten","bin":1},{"x":"ankern","bin":0},{"x":"assimilieren","bin":0},{"x":"bilden","bin":0},{"x":"nagen","bin":0},{"x":"bitten","bin":1},{"x":"billigen","bin":0},{"x":"atmen","bin":0}],"why":"schwach: Präteritum mit -te, Partizip ge…t (lernte, gelernt; -ieren ohne ge-). stark: Vokalwechsel (trank, getrunken). Mischform (denken – dachte – gedacht) zählt bei euch als stark."},{"id":"s98","type":"sort","q":"Schwach (regelmässig) oder stark (unregelmässig)?","bins":["schwach","stark"],"items":[{"x":"trinken","bin":1},{"x":"beenden","bin":0},{"x":"gehen","bin":1},{"x":"schlafen","bin":1},{"x":"benutzen","bin":0},{"x":"denken","bin":1},{"x":"beten","bin":0},{"x":"lesen","bin":1}],"why":"schwach: Präteritum mit -te, Partizip ge…t (lernte, gelernt; -ieren ohne ge-). stark: Vokalwechsel (trank, getrunken). Mischform (denken – dachte – gedacht) zählt bei euch als stark."},{"id":"s100","type":"sort","q":"Schwach oder stark? (Prüfungsliste Version B)","bins":["schwach","stark"],"items":[{"x":"assimilieren","bin":0},{"x":"graben","bin":1},{"x":"trinken","bin":1},{"x":"nagen","bin":0},{"x":"verderben","bin":1},{"x":"billigen","bin":0},{"x":"fechten","bin":1},{"x":"gären","bin":1}],"why":"schwach: Präteritum mit -te, Partizip ge…t (lernte, gelernt; -ieren ohne ge-). stark: Vokalwechsel (trank, getrunken). Mischform (denken – dachte – gedacht) zählt bei euch als stark."},{"id":"i111","type":"input","q":"Stammformen von <b>springen</b>: Präteritum und Partizip II (mit Komma)","answers":["sprang, gesprungen"],"why":"springen – sprang – gesprungen","loose":true},{"id":"i112","type":"input","q":"Stammformen von <b>trinken</b>: Präteritum und Partizip II (mit Komma)","answers":["trank, getrunken"],"why":"trinken – trank – getrunken","loose":true},{"id":"i113","type":"input","q":"Stammformen von <b>schreiben</b>: Präteritum und Partizip II (mit Komma)","answers":["schrieb, geschrieben"],"why":"schreiben – schrieb – geschrieben","loose":true},{"id":"i114","type":"input","q":"Stammformen von <b>gehen</b>: Präteritum und Partizip II (mit Komma)","answers":["ging, gegangen"],"why":"gehen – ging – gegangen","loose":true},{"id":"i115","type":"input","q":"Stammformen von <b>lesen</b>: Präteritum und Partizip II (mit Komma)","answers":["las, gelesen"],"why":"lesen – las – gelesen","loose":true},{"id":"i116","type":"input","q":"Stammformen von <b>denken</b>: Präteritum und Partizip II (mit Komma)","answers":["dachte, gedacht"],"why":"denken – dachte – gedacht","loose":true},{"id":"i117","type":"input","q":"Stammformen von <b>bitten</b>: Präteritum und Partizip II (mit Komma)","answers":["bat, gebeten"],"why":"bitten – bat – gebeten","loose":true},{"id":"i118","type":"input","q":"Stammformen von <b>halten</b>: Präteritum und Partizip II (mit Komma)","answers":["hielt, gehalten"],"why":"halten – hielt – gehalten","loose":true},{"id":"i119","type":"input","q":"Stammformen von <b>schlafen</b>: Präteritum und Partizip II (mit Komma)","answers":["schlief, geschlafen"],"why":"schlafen – schlief – geschlafen","loose":true},{"id":"i120","type":"input","q":"Stammformen von <b>laufen</b>: Präteritum und Partizip II (mit Komma)","answers":["lief, gelaufen"],"why":"laufen – lief – gelaufen","loose":true},{"id":"i121","type":"input","q":"Stammformen von <b>lernen</b>: Präteritum und Partizip II (mit Komma)","answers":["lernte, gelernt"],"why":"lernen – lernte – gelernt","loose":true},{"id":"i122","type":"input","q":"Stammformen von <b>reparieren</b>: Präteritum und Partizip II (mit Komma)","answers":["reparierte, repariert"],"why":"reparieren – reparierte – repariert","loose":true},{"id":"m123","type":"choice","q":"Wie viele Modi (Modalformen) hat ein Verb?","options":["2","3","4","6"],"correct":1,"why":"Indikativ (Tatsache), Konjunktiv (Wunsch), Imperativ (Befehl).","typeable":true},{"id":"m124","type":"choice","q":"«gespielt» ist …","options":["finit","infinit"],"correct":1,"why":"Partizip II = infinite Form (nicht in eine Person gesetzt).","typeable":false},{"id":"m125","type":"choice","q":"«er las» ist …","options":["finit","infinit"],"correct":0,"why":"in die Person gesetzt (er) → finit.","typeable":false},{"id":"m126","type":"choice","q":"Welches Wort ist der Verbzusatz? «Er nimmt den Anhalter mit.»","options":["nimmt","den","Anhalter","mit"],"correct":3,"why":"mitnehmen → «mit» ist der abgetrennte Verbzusatz.","typeable":false},{"id":"c127","type":"card","q":"Was ist ein Verbzusatz? Gib ein Beispiel.","a":"Ein abtrennbarer Teil des Verbs, der die Bedeutung ändert und am Satzende steht: Die Sonne geht auf (aufgehen). Er tritt ein (eintreten)."}]}]},{"id":"g2","title":"Nomen, Adjektive, Pronomen, Partikeln","units":[{"id":"w3","nr":"2.1","title":"Nomen: Kasus, Genus, Abstrakta/Konkreta","core":["Vier Fälle: <b>Nominativ</b> (wer/was?), <b>Genitiv</b> (wessen?), <b>Dativ</b> (wem?), <b>Akkusativ</b> (wen/was?).","Drei Genera: Maskulinum (der), Femininum (die), Neutrum (das). Genus ≠ natürliches Geschlecht: <i>das</i> Mädchen.","<b>Konkreta</b>: Gegenstände, Namen, Stoffe (Baum, Maria, Gold). <b>Abstrakta</b>: nicht anfassbar (Liebe, Freiheit, Langeweile)."],"rule":"Kann man es anfassen oder sehen? → Konkretum. Gefühl, Idee, Zustand → Abstraktum.","items":[{"id":"m128","type":"choice","q":"Welcher Fall fragt «wessen?»","options":["Nominativ","Genitiv","Dativ","Akkusativ"],"correct":1,"why":"Genitiv: wessen? – des Mannes.","typeable":true},{"id":"m129","type":"choice","q":"Welcher Fall fragt «wem?»","options":["Nominativ","Genitiv","Dativ","Akkusativ"],"correct":2,"why":"Dativ: wem? – dem Mann.","typeable":true},{"id":"m130","type":"choice","q":"Welcher Fall fragt «wen oder was?»","options":["Nominativ","Genitiv","Dativ","Akkusativ"],"correct":3,"why":"Akkusativ: wen/was? – den Mann.","typeable":true},{"id":"m131","type":"choice","q":"Welches <b>Genus</b> (grammatisches Geschlecht) hat «das Mädchen»?","options":["Maskulinum","Femininum","Neutrum"],"correct":2,"why":"Das Genus erkennt man am Artikel: das → Neutrum.","typeable":true},{"id":"s132","type":"sort","q":"Abstraktum oder Konkretum?","bins":["Abstrakta","Konkreta"],"items":[{"x":"der Baum","bin":1},{"x":"die Mutter","bin":1},{"x":"das GIBZ","bin":1},{"x":"die Langeweile","bin":0},{"x":"die Freude","bin":0},{"x":"der Duden","bin":1},{"x":"der Bleistift","bin":1},{"x":"die Philosophie","bin":0}],"why":"Abstrakta sind nicht gegenständlich: Freude, Langeweile, Philosophie."},{"id":"s133","type":"sort","q":"Abstraktum oder Konkretum?","bins":["Abstrakta","Konkreta"],"items":[{"x":"die Liebe","bin":0},{"x":"der Hass","bin":0},{"x":"die Freiheit","bin":0},{"x":"das Gold","bin":1},{"x":"Maria","bin":1},{"x":"Japan","bin":1},{"x":"der Stern","bin":1},{"x":"die Angst","bin":0}],"why":"Eigennamen und Stoffe (Gold) sind Konkreta."}]},{"id":"w4","nr":"2.2","title":"Adjektive: Steigerung und Besonderheiten","core":["Drei Steigerungsstufen: <b>Positiv</b> (gross), <b>Komparativ</b> (grösser), <b>Superlativ</b> (am grössten).","Unregelmässig: gut – besser – am besten · viel – mehr – am meisten · gern – lieber – am liebsten · hoch – höher – am höchsten · nah – näher – am nächsten.","Nicht steigerbar: fertig, schwanger, tot …","Ortsnamen mit <b>-er</b> werden <b>grossgeschrieben</b> und nie dekliniert: der Berner Bär, die Zuger Schule, Schweizer Käse. Mit -isch aber klein: australisch."],"rule":"Attributiv (das grosse Haus), adverbial (sie zeichnet schön), prädikativ (sie ist schön) – nur attributiv wird dekliniert.","items":[{"id":"m134","type":"choice","q":"Wie heisst die zweite Steigerungsform?","options":["Positiv","Komparativ","Superlativ"],"correct":1,"why":"Positiv – Komparativ – Superlativ.","typeable":true},{"id":"i135","type":"input","q":"Komparativ von <b>treu</b>","answers":["treuer"],"why":"treu – treuer – am treusten"},{"id":"i136","type":"input","q":"Superlativ von <b>treu</b>","answers":["am treusten","am treuesten"],"why":"treu – treuer – am treusten"},{"id":"i137","type":"input","q":"Komparativ von <b>breit</b>","answers":["breiter"],"why":"breit – breiter – am breitesten"},{"id":"i138","type":"input","q":"Superlativ von <b>breit</b>","answers":["am breitesten"],"why":"breit – breiter – am breitesten"},{"id":"i139","type":"input","q":"Komparativ von <b>viel</b>","answers":["mehr"],"why":"viel – mehr – am meisten"},{"id":"i140","type":"input","q":"Superlativ von <b>viel</b>","answers":["am meisten"],"why":"viel – mehr – am meisten"},{"id":"i141","type":"input","q":"Komparativ von <b>schnell</b>","answers":["schneller"],"why":"schnell – schneller – am schnellsten"},{"id":"i142","type":"input","q":"Superlativ von <b>schnell</b>","answers":["am schnellsten"],"why":"schnell – schneller – am schnellsten"},{"id":"i143","type":"input","q":"Komparativ von <b>teuer</b>","answers":["teurer"],"why":"teuer – teurer – am teuersten"},{"id":"i144","type":"input","q":"Superlativ von <b>teuer</b>","answers":["am teuersten"],"why":"teuer – teurer – am teuersten"},{"id":"i145","type":"input","q":"Komparativ von <b>nah</b>","answers":["näher"],"why":"nah – näher – am nächsten"},{"id":"i146","type":"input","q":"Superlativ von <b>nah</b>","answers":["am nächsten"],"why":"nah – näher – am nächsten"},{"id":"i147","type":"input","q":"Komparativ von <b>hoch</b>","answers":["höher"],"why":"hoch – höher – am höchsten"},{"id":"i148","type":"input","q":"Superlativ von <b>hoch</b>","answers":["am höchsten"],"why":"hoch – höher – am höchsten"},{"id":"i149","type":"input","q":"Komparativ von <b>gern</b>","answers":["lieber"],"why":"gern – lieber – am liebsten"},{"id":"i150","type":"input","q":"Superlativ von <b>gern</b>","answers":["am liebsten"],"why":"gern – lieber – am liebsten"},{"id":"i151","type":"input","q":"Komparativ von <b>gut</b>","answers":["besser"],"why":"gut – besser – am besten"},{"id":"i152","type":"input","q":"Superlativ von <b>gut</b>","answers":["am besten"],"why":"gut – besser – am besten"},{"id":"i153","type":"input","q":"Komparativ von <b>warm</b>","answers":["wärmer"],"why":"warm – wärmer – am wärmsten"},{"id":"i154","type":"input","q":"Superlativ von <b>warm</b>","answers":["am wärmsten"],"why":"warm – wärmer – am wärmsten"},{"id":"i155","type":"input","q":"Komparativ von <b>gross</b>","answers":["grösser"],"why":"gross – grösser – am grössten"},{"id":"i156","type":"input","q":"Superlativ von <b>gross</b>","answers":["am grössten"],"why":"gross – grösser – am grössten"},{"id":"m157","type":"choice","q":"Welches Adjektiv ist NICHT steigerbar?","options":["schnell","fertig","warm","gross"],"correct":1,"why":"fertig, schwanger: kein «fertiger» im normalen Gebrauch.","typeable":false},{"id":"m158","type":"choice","q":"Welche Schreibweise ist richtig?","options":["die berner Zeitung","die Berner Zeitung","die Bernerin Zeitung"],"correct":1,"why":"Ortsnamen mit -er: immer gross und unverändert.","typeable":false},{"id":"i159","type":"input","q":"Nenne ein Beispiel für ein grossgeschriebenes Adjektiv.","answers":["Schweizer","Berner","Zuger","Londoner","Zürcher","Kölner","Luzerner","Basler"],"why":"Adjektive aus Ortsnamen mit -er: Schweizer, Berner, Londoner …"},{"id":"m160","type":"choice","q":"«Sie zeichnet schön» – wie wird das Adjektiv verwendet?","options":["attributiv","adverbial","prädikativ"],"correct":1,"why":"Es bestimmt das Verb näher → adverbial.","typeable":false}]},{"id":"w5","nr":"2.3","title":"Pronomen: die Arten","core":["An der Prüfung musst du nur <b>erkennen</b>, dass ein Wort ein <b>Pronomen</b> ist – und <b>vier Arten nennen</b> können. Lerne diese vier: <b>Personal</b> (ich, du, mich), <b>Possessiv</b> (mein, dein, euer), <b>Demonstrativ</b> (dieser, jener), <b>Zahlpronomen</b> (eins, zwei).","Auch <b>Artikel</b> sind Pronomen: der/die/das, ein/eine. Aber Ordinalzahlen (erstens) elmässig, Fakt</b> – oder eine fertige Handlung",ex:["I play football every Sunday.","She lives in Zug.","I watched TV."]},{t:"continuous",d:"<b>gerade jetzt</b> / war gerade dabei. Form: <b>am/is/are/was/were + -ing</b>",ex:["I am playing now.","She is reading.","I was watching TV when …"]}],trick:"Kannst du «<b>gerade</b>» (oder «war gerade dabei») dazudenken? → <b>continuous</b> (be + -ing). Signalwörter: <i>now, at the moment, look!</i> → continuous. <i>always, every day, usually</i> → simple.",ask:'simple oder continuous?<br><b class="nh-big" lang="en">{x}</b>',sorts:[["He plays tennis every week.",0],["I usually walk to school.",0],["Water boils at 100 degrees.",0],["She went home.",0],["Look! It is raining.",1],["We are having lunch right now.",1],["I was sleeping when you called.",1],["They are watching a film at the moment.",1]]},{id:"nh-en-pspp",sid:"en1",name:"past simple oder present perfect?",sub:"yesterday vs. already",keys:/present perfect|past simple|\bago\b|\bsince\b|\byet\b|\bjust\b|\bever\b/i,lesson:"en-pspp",what:"Beides ist Vergangenheit. Der Unterschied: Ist der <b>Zeitpunkt fertig und genannt</b> – oder zählt das <b>Ergebnis bis jetzt</b>?",cols:[{t:"past simple",d:"<b>fertiger Zeitpunkt</b>: yesterday, last week, in 2020, … ago, when …",ex:["I <b>saw</b> him yesterday.","She <b>went</b> to Paris 2 years ago."]},{t:"present perfect",d:"<b>bis jetzt</b>, Zeitpunkt egal: ever, never, already, just, yet, since, for. Form: <b>have/has + 3. Form</b>",ex:["I <b>have</b> never <b>been</b> to Paris.","She <b>has</b> just <b>finished</b>.","We <b>have lived</b> here since 2019."]}],trick:"Steht ein <b>fertiger Zeitpunkt</b> da (yesterday, ago, last …, in 2020)? → <b>past simple</b>. Sonst (ever, never, just, yet, since, for) → <b>present perfect</b>.",ask:'Welche Zeit passt?<br><b class="nh-big" lang="en">{x}</b>',sorts:[["I ___ (see) him yesterday.",0,"yesterday → past simple: saw"],["She ___ (go) home 2 hours ago.",0,"ago → went"],["We ___ (win) the
