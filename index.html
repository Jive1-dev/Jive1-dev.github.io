,"Adjektiv","Partikel"],"correct":0,"why":"Konjugieren = in die Person setzen: ich gehe, du gehst.","typeable":true},{"id":"m102","type":"choice","q":"Welche Wortart ist <b>unveränderbar</b>?","options":["Pronomen","Partikel","Adjektiv","Nomen"],"correct":1,"why":"Partikeln (Präposition, Konjunktion, Adverb, Interjektion) verändern sich nie.","typeable":true},{"id":"m103","type":"choice","q":"Welche Wortarten sind <b>deklinierbar</b>?","options":["Nomen, Adjektiv, Pronomen","nur Verben","Partikeln","Verb und Adverb"],"correct":0,"why":"Deklinieren = nach Fall, Zahl, Geschlecht verändern.","typeable":false},{"id":"i104","type":"input","q":"Fachbegriffe für «Einzahl» und «Mehrzahl»? (mit Komma)","answers":["Singular, Plural"],"why":"Singular = Einzahl, Plural = Mehrzahl.","loose":true},{"id":"s105","type":"sort","q":"Veränderbar oder unveränderbar?","bins":["veränderbar","unveränderbar"],"items":[{"x":"laufen","bin":0},{"x":"Haus","bin":0},{"x":"schön","bin":0},{"x":"dieser","bin":0},{"x":"und","bin":1},{"x":"mit","bin":1},{"x":"oben","bin":1},{"x":"ach","bin":1}],"why":"Nur die Partikeln (und, mit, oben, ach) sind unveränderbar."},{"id":"c106","type":"card","q":"Zu welcher Wortart gehören «nichts, alles, wenig, viel, etwas»?","a":"Pronomen (generalisierende Indefinitpronomen) – obwohl sie unveränderbar sind."},{"id":"c107","type":"card","q":"Zu welcher Wortart gehört «zum» (zu + dem)?","a":"Präposition – Verschmelzungen aus Partikel und Pronomen zählen zu den Partikeln."}]},{"id":"w2","nr":"1.2","title":"Verben: Arten, schwach/stark, Stammformen","core":["<b>Vollverb</b> (Kern des Satzes), <b>Hilfsverb</b> (sein, haben, werden), <b>Modalverb</b> (dürfen, müssen, können, mögen, sollen, wollen).","<b>Schwach</b>: Präteritum -te, Partizip ge…t (lernen – lernte – gelernt). <b>Stark</b>: Vokalwechsel, Partizip -en (springen – sprang – gesprungen). Mischform (denken – dachte – gedacht) = stark.","Drei <b>Stammformen</b>: Infinitiv, Präteritum, Partizip II.","<b>Finit</b> = konjugiert (ich spiele, er las). <b>Infinit</b> = Infinitiv, Partizip I (singend), Partizip II (gespielt).","<b>Verbzusatz</b>: abtrennbarer Teil, der die Bedeutung ändert: Die Sonne geht <b>auf</b> (aufgehen). Drei <b>Modi</b>: Indikativ, Konjunktiv, Imperativ."],"rule":"Verben auf -ieren haben kein ge- im Partizip II: repariert, funktioniert.","items":[{"id":"i108","type":"input","q":"Zähle alle Hilfsverben auf (mit Komma).","answers":["sein, haben, werden","haben, sein, werden","werden, sein, haben","sein, werden, haben","haben, werden, sein","werden, haben, sein"],"why":"Hilfsverben: sein, haben, werden.","loose":true},{"id":"i109","type":"input","q":"Nenne die drei Stammformen (mit Komma).","answers":["Infinitiv, Präteritum, Partizip II","Infinitiv, Präteritum, Partizip 2"],"why":"Infinitiv – Präteritum – Partizip II (gehen – ging – gegangen).","loose":true},{"id":"s110","type":"sort","q":"Hilfsverb oder Modalverb?","bins":["Hilfsverb","Modalverb"],"items":[{"x":"sein","bin":0},{"x":"haben","bin":0},{"x":"werden","bin":0},{"x":"dürfen","bin":1},{"x":"müssen","bin":1},{"x":"können","bin":1},{"x":"sollen","bin":1},{"x":"wollen","bin":1}],"why":"Modalverben: dürfen, müssen, können, mögen, sollen, wollen."},{"id":"s96","type":"sort","q":"Schwach (regelmässig) oder stark (unregelmässig)?","bins":["schwach","stark"],"items":[{"x":"sein","bin":1},{"x":"haben","bin":1},{"x":"laufen","bin":1},{"x":"essen","bin":1},{"x":"kaufen","bin":0},{"x":"spazieren","bin":0},{"x":"lernen","bin":0},{"x":"schreiben","bin":1}],"why":"schwach: Präteritum mit -te, Partizip ge…t (lernte, gelernt; -ieren ohne ge-). stark: Vokalwechsel (trank, getrunken). Mischform (denken – dachte – gedacht) zählt bei euch als stark."},{"id":"s97","type":"sort","q":"Schwach (regelmässig) oder stark (unregelmässig)?","bins":["schwach","stark"],"items":[{"x":"halten","bin":1},{"x":"ankern","bin":0},{"x":"assimilieren","bin":0},{"x":"bilden","bin":0},{"x":"nagen","bin":0},{"x":"bitten","bin":1},{"x":"billigen","bin":0},{"x":"atmen","bin":0}],"why":"schwach: Präteritum mit -te, Partizip ge…t (lernte, gelernt; -ieren ohne ge-). stark: Vokalwechsel (trank, getrunken). Mischform (denken – dachte – gedacht) zählt bei euch als stark."},{"id":"s98","type":"sort","q":"Schwach (regelmässig) oder stark (unregelmässig)?","bins":["schwach","stark"],"items":[{"x":"trinken","bin":1},{"x":"beenden","bin":0},{"x":"gehen","bin":1},{"x":"schlafen","bin":1},{"x":"benutzen","bin":0},{"x":"denken","bin":1},{"x":"beten","bin":0},{"x":"lesen","bin":1}],"why":"schwach: Präteritum mit -te, Partizip ge…t (lernte, gelernt; -ieren ohne ge-). stark: Vokalwechsel (trank, getrunken). Mischform (denken – dachte – gedacht) zählt bei euch als stark."},{"id":"s100","type":"sort","q":"Schwach oder stark? (Prüfungsliste Version B)","bins":["schwach","stark"],"items":[{"x":"assimilieren","bin":0},{"x":"graben","bin":1},{"x":"trinken","bin":1},{"x":"nagen","bin":0},{"x":"verderben","bin":1},{"x":"billigen","bin":0},{"x":"fechten","bin":1},{"x":"gären","bin":1}],"why":"schwach: Präteritum mit -te, Partizip ge…t (lernte, gelernt; -ieren ohne ge-). stark: Vokalwechsel (trank, getrunken). Mischform (denken – dachte – gedacht) zählt bei euch als stark."},{"id":"i111","type":"input","q":"Stammformen von <b>springen</b>: Präteritum und Partizip II (mit Komma)","answers":["sprang, gesprungen"],"why":"springen – sprang – gesprungen","loose":true},{"id":"i112","type":"input","q":"Stammformen von <b>trinken</b>: Präteritum und Partizip II (mit Komma)","answers":["trank, getrunken"],"why":"trinken – trank – getrunken","loose":true},{"id":"i113","type":"input","q":"Stammformen von <b>schreiben</b>: Präteritum und Partizip II (mit Komma)","answers":["schrieb, geschrieben"],"why":"schreiben – schrieb – geschrieben","loose":true},{"id":"i114","type":"input","q":"Stammformen von <b>gehen</b>: Präteritum und Partizip II (mit Komma)","answers":["ging, gegangen"],"why":"gehen – ging – gegangen","loose":true},{"id":"i115","type":"input","q":"Stammformen von <b>lesen</b>: Präteritum und Partizip II (mit Komma)","answers":["las, gelesen"],"why":"lesen – las – gelesen","loose":true},{"id":"i116","type":"input","q":"Stammformen von <b>denken</b>: Präteritum und Partizip II (mit Komma)","answers":["dachte, gedacht"],"why":"denken – dachte – gedacht","loose":true},{"id":"i117","type":"input","q":"Stammformen von <b>bitten</b>: Präteritum und Partizip II (mit Komma)","answers":["bat, gebeten"],"why":"bitten – bat – gebeten","loose":true},{"id":"i118","type":"input","q":"Stammformen von <b>halten</b>: Präteritum und Partizip II (mit Komma)","answers":["hielt, gehalten"],"why":"halten – hielt – gehalten","loose":true},{"id":"i119","type":"input","q":"Stammformen von <b>schlafen</b>: Präteritum und Partizip II (mit Komma)","answers":["schlief, geschlafen"],"why":"schlafen – schlief – geschlafen","loose":true},{"id":"i120","type":"input","q":"Stammformen von <b>laufen</b>: Präteritum und Partizip II (mit Komma)","answers":["lief, gelaufen"],"why":"laufen – lief – gelaufen","loose":true},{"id":"i121","type":"input","q":"Stammformen von <b>lernen</b>: Präteritum und Partizip II (mit Komma)","answers":["lernte, gelernt"],"why":"lernen – lernte – gelernt","loose":true},{"id":"i122","type":"input","q":"Stammformen von <b>reparieren</b>: Präteritum und Partizip II (mit Komma)","answers":["reparierte, repariert"],"why":"reparieren – reparierte – repariert","loose":true},{"id":"m123","type":"choice","q":"Wie viele Modi (Modalformen) hat ein Verb?","options":["2","3","4","6"],"correct":1,"why":"Indikativ (Tatsache), Konjunktiv (Wunsch), Imperativ (Befehl).","typeable":true},{"id":"m124","type":"choice","q":"«gespielt» ist …","options":["finit","infinit"],"correct":1,"why":"Partizip II = infinite Form (nicht in eine Person gesetzt).","typeable":false},{"id":"m125","type":"choice","q":"«er las» ist …","options":["finit","infinit"],"correct":0,"why":"in die Person gesetzt (er) → finit.","typeable":false},{"id":"m126","type":"choice","q":"Welches Wort ist der Verbzusatz? «Er nimmt den Anhalter mit.»","options":["nimmt","den","Anhalter","mit"],"correct":3,"why":"mitnehmen → «mit» ist der abgetrennte Verbzusatz.","typeable":false},{"id":"c127","type":"card","q":"Was ist ein Verbzusatz? Gib ein Beispiel.","a":"Ein abtrennbarer Teil des Verbs, der die Bedeutung ändert und am Satzende steht: Die Sonne geht auf (aufgehen). Er tritt ein (eintreten)."}]}]},{"id":"g2","title":"Nomen, Adjektive, Pronomen, Partikeln","units":[{"id":"w3","nr":"2.1","title":"Nomen: Kasus, Genus, Abstrakta/Konkreta","core":["Vier Fälle: <b>Nominativ</b> (wer/was?), <b>Genitiv</b> (wessen?), <b>Dativ</b> (wem?), <b>Akkusativ</b> (wen/was?).","Drei Genera: Maskulinum (der), Femininum (die), Neutrum (das). Genus ≠ natürliches Geschlecht: <i>das</i> Mädchen.","<b>Konkreta</b>: Gegenstände, Namen, Stoffe (Baum, Maria, Gold). <b>Abstrakta</b>: nicht anfassbar (Liebe, Freiheit, Langeweile)."],"rule":"Kann man es anfassen oder sehen? → Konkretum. Gefühl, Idee, Zustand → Abstraktum.","items":[{"id":"m128","type":"choice","q":"Welcher Fall fragt «wessen?»","options":["Nominativ","Genitiv","Dativ","Akkusativ"],"correct":1,"why":"Genitiv: wessen? – des Mannes.","typeable":true},{"id":"m129","type":"choice","q":"Welcher Fall fragt «wem?»","options":["Nominativ","Genitiv","Dativ","Akkusativ"],"correct":2,"why":"Dativ: wem? – dem Mann.","typeable":true},{"id":"m130","type":"choice","q":"Welcher Fall fragt «wen oder was?»","options":["Nominativ","Genitiv","Dativ","Akkusativ"],"correct":3,"why":"Akkusativ: wen/was? – den Mann.","typeable":true},{"id":"m131","type":"choice","q":"Welches <b>Genus</b> (grammatisches Geschlecht) hat «das Mädchen»?","options":["Maskulinum","Femininum","Neutrum"],"correct":2,"why":"Das Genus erkennt man am Artikel: das → Neutrum.","typeable":true},{"id":"s132","type":"sort","q":"Abstraktum oder Konkretum?","bins":["Abstrakta","Konkreta"],"items":[{"x":"der Baum","bin":1},{"x":"die Mutter","bin":1},{"x":"das GIBZ","bin":1},{"x":"die Langeweile","bin":0},{"x":"die Freude","bin":0},{"x":"der Duden","bin":1},{"x":"der Bleistift","bin":1},{"x":"die Philosophie","bin":0}],"why":"Abstrakta sind nicht gegenständlich: Freude, Langeweile, Philosophie."},{"id":"s133","type":"sort","q":"Abstraktum oder Konkretum?","bins":["Abstrakta","Konkreta"],"items":[{"x":"die Liebe","bin":0},{"x":"der Hass","bin":0},{"x":"die Freiheit","bin":0},{"x":"das Gold","bin":1},{"x":"Maria","bin":1},{"x":"Japan","bin":1},{"x":"der Stern","bin":1},{"x":"die Angst","bin":0}],"why":"Eigennamen und Stoffe (Gold) sind Konkreta."}]},{"id":"w4","nr":"2.2","title":"Adjektive: Steigerung und Besonderheiten","core":["Drei Steigerungsstufen: <b>Positiv</b> (gross), <b>Komparativ</b> (grösser), <b>Superlativ</b> (am grössten).","Unregelmässig: gut – besser – am besten · viel – mehr – am meisten · gern – lieber – am liebsten · hoch – höher – am höchsten · nah – näher – am nächsten.","Nicht steigerbar: fertig, schwanger, tot …","Ortsnamen mit <b>-er</b> werden <b>grossgeschrieben</b> und nie dekliniert: der Berner Bär, die Zuger Schule, Schweizer Käse. Mit -isch aber klein: australisch."],"rule":"Attributiv (das grosse Haus), adverbial (sie zeichnet schön), prädikativ (sie ist schön) – nur attributiv wird dekliniert.","items":[{"id":"m134","type":"choice","q":"Wie heisst die zweite Steigerungsform?","options":["Positiv","Komparativ","Superlativ"],"correct":1,"why":"Positiv – Komparativ – Superlativ.","typeable":true},{"id":"i135","type":"input","q":"Komparativ von <b>treu</b>","answers":["treuer"],"why":"treu – treuer – am treusten"},{"id":"i136","type":"input","q":"Superlativ von <b>treu</b>","answers":["am treusten","am treuesten"],"why":"treu – treuer – am treusten"},{"id":"i137","type":"input","q":"Komparativ von <b>breit</b>","answers":["breiter"],"why":"breit – breiter – am breitesten"},{"id":"i138","type":"input","q":"Superlativ von <b>breit</b>","answers":["am breitesten"],"why":"breit – breiter – am breitesten"},{"id":"i139","type":"input","q":"Komparativ von <b>viel</b>","answers":["mehr"],"why":"viel – mehr – am meisten"},{"id":"i140","type":"input","q":"Superlativ von <b>viel</b>","answers":["am meisten"],"why":"viel – mehr – am meisten"},{"id":"i141","type":"input","q":"Komparativ von <b>schnell</b>","answers":["schneller"],"why":"schnell – schneller – am schnellsten"},{"id":"i142","type":"input","q":"Superlativ von <b>schnell</b>","answers":["am schnellsten"],"why":"schnell – schneller – am schnellsten"},{"id":"i143","type":"input","q":"Komparativ von <b>teuer</b>","answers":["teurer"],"why":"teuer – teurer – am teuersten"},{"id":"i144","type":"input","q":"Superlativ von <b>teuer</b>","answers":["am teuersten"],"why":"teuer – teurer – am teuersten"},{"id":"i145","type":"input","q":"Komparativ von <b>nah</b>","answers":["näher"],"why":"nah – näher – am nächsten"},{"id":"i146","type":"input","q":"Superlativ von <b>nah</b>","answers":["am nächsten"],"why":"nah – näher – am nächsten"},{"id":"i147","type":"input","q":"Komparativ von <b>hoch</b>","answers":["höher"],"why":"hoch – höher – am höchsten"},{"id":"i148","type":"input","q":"Superlativ von <b>hoch</b>","answers":["am höchsten"],"why":"hoch – höher – am höchsten"},{"id":"i149","type":"input","q":"Komparativ von <b>gern</b>","answers":["lieber"],"why":"gern – lieber – am liebsten"},{"id":"i150","type":"input","q":"Superlativ von <b>gern</b>","answers":["am liebsten"],"why":"gern – lieber – am liebsten"},{"id":"i151","type":"input","q":"Komparativ von <b>gut</b>","answers":["besser"],"why":"gut – besser – am besten"},{"id":"i152","type":"input","q":"Superlativ von <b>gut</b>","answers":["am besten"],"why":"gut – besser – am besten"},{"id":"i153","type":"input","q":"Komparativ von <b>warm</b>","answers":["wärmer"],"why":"warm – wärmer – am wärmsten"},{"id":"i154","type":"input","q":"Superlativ von <b>warm</b>","answers":["am wärmsten"],"why":"warm – wärmer – am wärmsten"},{"id":"i155","type":"input","q":"Komparativ von <b>gross</b>","answers":["grösser"],"why":"gross – grösser – am grössten"},{"id":"i156","type":"input","q":"Superlativ von <b>gross</b>","answers":["am grössten"],"why":"gross – grösser – am grössten"},{"id":"m157","type":"choice","q":"Welches Adjektiv ist NICHT steigerbar?","options":["schnell","fertig","warm","gross"],"correct":1,"why":"fertig, schwanger: kein «fertiger» im normalen Gebrauch.","typeable":false},{"id":"m158","type":"choice","q":"Welche Schreibweise ist richtig?","options":["die berner Zeitung","die Berner Zeitung","die Bernerin Zeitung"],"correct":1,"why":"Ortsnamen mit -er: immer gross und unverändert.","typeable":false},{"id":"i159","type":"input","q":"Nenne ein Beispiel für ein grossgeschriebenes Adjektiv.","answers":["Schweizer","Berner","Zuger","Londoner","Zürcher","Kölner","Luzerner","Basler"],"why":"Adjektive aus Ortsnamen mit -er: Schweizer, Berner, Londoner …"},{"id":"m160","type":"choice","q":"«Sie zeichnet schön» – wie wird das Adjektiv verwendet?","options":["attributiv","adverbial","prädikativ"],"correct":1,"why":"Es bestimmt das Verb näher → adverbial.","typeable":false}]},{"id":"w5","nr":"2.3","title":"Pronomen: die Arten","core":["Personal (ich, du, mich), Possessiv (mein, euer), Demonstrativ (dieser, jener), Relativ (der, welcher im Nebensatz), Interrogativ (wer, was, welcher), Indefinit (alle, keiner, niemand, etwas), Reflexiv (sich, mich).","Auch <b>Artikel</b> sind Pronomen: der/die/das, ein/eine. Zahlen (eins, zwei) = Zahlpronomen. Aber Ordinalzahlen (erstens) = Adjektiv!"],"rule":"Stellvertreter ODER Begleiter des Nomens → Pronomen.","items":[{"id":"m161","type":"choice","q":"Welche Pronomen-Art ist <b>dieser</b>?","options":["Personalpronomen","Possessivpronomen","Demonstrativpronomen","Relativpronomen","Interrogativpronomen","Indefinitpronomen","Reflexivpronomen"],"correct":2,"why":"dieser = Demonstrativpronomen","typeable":false},{"id":"m162","type":"choice","q":"Welche Pronomen-Art ist <b>mein</b>?","options":["Personalpronomen","Possessivpronomen","Demonstrativpronomen","Relativpronomen","Interrogativpronomen","Indefinitpronomen","Reflexivpronomen"],"correct":1,"why":"mein = Possessivpronomen","typeable":false},{"id":"m163","type":"choice","q":"Welche Pronomen-Art ist <b>sich</b>?","options":["Personalpronomen","Possessivpronomen","Demonstrativpronomen","Relativpronomen","Interrogativpronomen","Indefinitpronomen","Reflexivpronomen"],"correct":6,"why":"sich = Reflexivpronomen","typeable":false},{"id":"m164","type":"choice","q":"Welche Pronomen-Art ist <b>wer</b>?","options":["Personalpronomen","Possessivpronomen","Demonstrativpronomen","Relativpronomen","Interrogativpronomen","Indefinitpronomen","Reflexivpronomen"],"correct":4,"why":"wer = Interrogativpronomen","typeable":false},{"id":"m165","type":"choice","q":"Welche Pronomen-Art ist <b>niemand</b>?","options":["Personalpronomen","Possessivpronomen","Demonstrativpronomen","Relativpronomen","Interrogativpronomen","Indefinitpronomen","Reflexivpronomen"],"correct":5,"why":"niemand = Indefinitpronomen","typeable":false},{"id":"m166","type":"choice","q":"Welche Pronomen-Art ist <b>ich</b>?","options":["Personalpronomen","Possessivpronomen","Demonstrativpronomen","Relativpronomen","Interrogativpronomen","Indefinitpronomen","Reflexivpronomen"],"correct":0,"why":"ich = Personalpronomen","typeable":false},{"id":"m167","type":"choice","q":"Welche Pronomen-Art ist <b>welche (im Nebensatz: die Frau, welche …)</b>?","options":["Personalpronomen","Possessivpronomen","Demonstrativpronomen","Relativpronomen","Interrogativpronomen","Indefinitpronomen","Reflexivpronomen"],"correct":3,"why":"welche (im Nebensatz: die Frau, welche …) = Relativpronomen","typeable":false},{"id":"m168","type":"choice","q":"Zu welcher der fünf <b>Wortarten</b> gehört der Artikel «die»?","options":["Nomen","Pronomen","Partikel","Adjektiv"],"correct":1,"why":"Gut gedacht, falls du «Begleiter» geschrieben hast: Ein Artikel begleitet das Nomen. Gefragt "lang":"en"},{"id":"i193","type":"input","q":"Mach eine indirekte Frage (z. B. mit «Could you tell me …»):<br><b>Why did you do that?</b>","answers":["Could you tell me why you did that?","Would you mind telling me why you did that?","Do you know why you did that?","Can you tell me why you did that?"],"why":"Nach «Could you tell me / Do you know …» normale Satzstellung (Subjekt vor Verb), kein do/does/did. Ja/Nein-Fragen mit if/whether.","loose":true,"lang":"en"},{"id":"i194","type":"input","q":"Mach eine indirekte Frage (z. B. mit «Could you tell me …»):<br><b>Have you seen my phone anywhere?</b>","answers":["Could you tell me if you've seen my phone anywhere?","Could you tell me whether you've seen my phone anywhere?","Would you mind telling me if you've seen my phone anywhere?","Would you mind telling me whether you've seen my phone anywhere?","Do you know if you've seen my phone anywhere?","Do you know whether you've seen my phone anywhere?","Can you tell me if you've seen my phone anywhere?","Can you tell me whether you've seen my phone anywhere?"],"why":"Nach «Could you tell me / Do you know …» normale Satzstellung (Subjekt vor Verb), kein do/does/did. Ja/Nein-Fragen mit if/whether.","loose":true,"lang":"en"},{"id":"i195","type":"input","q":"Mach eine indirekte Frage (z. B. mit «Could you tell me …»):<br><b>When does the train leave?</b>","answers":["Could you tell me when the train leaves?","Would you mind telling me when the train leaves?","Do you know when the train leaves?","Can you tell me when the train leaves?"],"why":"Nach «Could you tell me / Do you know …» normale Satzstellung (Subjekt vor Verb), kein do/does/did. Ja/Nein-Fragen mit if/whether.","loose":true,"lang":"en"},{"id":"i196","type":"input","q":"Mach eine indirekte Frage (z. B. mit «Could you tell me …»):<br><b>How much does this cost?</b>","answers":["Could you tell me how much this costs?","Would you mind telling me how much this costs?","Do you know how much this costs?","Can you tell me how much this costs?"],"why":"Nach «Could you tell me / Do you know …» normale Satzstellung (Subjekt vor Verb), kein do/does/did. Ja/Nein-Fragen mit if/whether.","loose":true,"lang":"en"},{"id":"m197","type":"choice","q":"Which is correct?","options":["Could you tell me where is the station?","Could you tell me where the station is?","Could you tell me where does the station is?"],"correct":1,"why":"Indirect question: subject before verb.","typeable":false},{"id":"m198","type":"choice","q":"Which is correct?","options":["Do you know if she likes jazz?","Do you know does she like jazz?","Do you know if does she like jazz?"],"correct":0,"why":"if + normal word order, no does.","typeable":false}]}]},{"id":"e2","title":"Auxiliary verbs and question tags (1B)","units":[{"id":"a1","nr":"2.1","title":"Question tags","core":["Positive sentence → <b>negative tag</b>: You have a car, <b>haven’t you</b>? · Negative sentence → <b>positive tag</b>: You haven’t seen it, <b>have you</b>?","Use the <b>same auxiliary</b> as in the sentence (can → can’t, is → isn’t, will → won’t). No auxiliary? Use do/does/did: They like it, <b>don’t they</b>?","Special: I am … → <b>aren’t I</b>? · Let’s … → <b>shall we</b>? · This/That is … → isn’t <b>it</b>?"],"rule":"Plus → minus, minus → plus. Subject in the tag is always a pronoun.","items":[{"id":"m199","type":"choice","q":"You have a car, ___?","options":["haven't you","don't you","do you"],"correct":0,"why":"British English: have (possession) often takes haven’t; your worksheet key: haven’t you.","typeable":false},{"id":"m200","type":"choice","q":"She has finished her work, ___?","options":["hasn't she","didn't she","has she"],"correct":0,"why":"has finished → hasn’t she","typeable":false},{"id":"m201","type":"choice","q":"They were on time, ___?","options":["were they","weren't they","didn't they"],"correct":1,"why":"were → weren’t","typeable":false},{"id":"m202","type":"choice","q":"He can play the guitar, ___?","options":["does he","can't he","can he"],"correct":1,"why":"can → can’t","typeable":false},{"id":"m203","type":"choice","q":"They don't like spicy food, ___?","options":["don't they","do they","did they"],"correct":1,"why":"negative → positive: do they","typeable":false},{"id":"m204","type":"choice","q":"You're not leaving yet, ___?","options":["are you","didn't you","aren't you"],"correct":0,"why":"negative → positive: are you","typeable":false},{"id":"m205","type":"choice","q":"We should go now, ___?","options":["should we","shouldn't we","should not we"],"correct":1,"why":"should → shouldn’t","typeable":false},{"id":"i206","type":"input","q":"Question tag: <b>You're coming to the meeting, ___?</b>","answers":["aren't you"],"why":"are → aren’t","lang":"en"},{"id":"i207","type":"input","q":"Question tag: <b>She doesn't like coffee, ___?</b>","answers":["does she"],"why":"doesn't → does","lang":"en"},{"id":"i208","type":"input","q":"Question tag: <b>They have finished their homework, ___?</b>","answers":["haven't they"],"why":"have → haven’t","lang":"en"},{"id":"i209","type":"input","q":"Question tag: <b>It's a beautiful day, ___?</b>","answers":["isn't it"],"why":"is → isn’t","lang":"en"},{"id":"i210","type":"input","q":"Question tag: <b>He can speak Spanish, ___?</b>","answers":["can't he"],"why":"can → can’t","lang":"en"},{"id":"i211","type":"input","q":"Question tag: <b>You didn't forget the tickets, ___?</b>","answers":["did you"],"why":"didn't → did","lang":"en"},{"id":"i212","type":"input","q":"Question tag: <b>She won't be late, ___?</b>","answers":["will she"],"why":"won't → will","lang":"en"},{"id":"i213","type":"input","q":"Correct the tag: <b>You don’t know the answer, don’t you?</b> (write the correct tag or «correct»)","answers":["do you"],"why":"negative → positive tag.","lang":"en"},{"id":"i214","type":"input","q":"Correct the tag: <b>They are coming to the party, isn’t they?</b>","answers":["aren't they"],"why":"They are → aren’t they.","lang":"en"},{"id":"i215","type":"input","q":"Correct the tag: <b>He didn’t call you, didn’t he?</b>","answers":["did he"],"why":"negative → positive.","lang":"en"},{"id":"i216","type":"input","q":"Correct the tag: <b>This isn’t the right way, isn’t it?</b>","answers":["is it"],"why":"negative → positive.","lang":"en"},{"id":"i217","type":"input","q":"Correct the tag: <b>We haven’t met before, have we?</b>","answers":["correct"],"why":"Already correct.","lang":"en"},{"id":"i218","type":"input","q":"Let’s have some lunch, ___ we?","answers":["shall"],"why":"Let’s … shall we?","lang":"en"}]},{"id":"a2","nr":"2.2","title":"So/Neither, reply questions, emphasis","core":["Agreeing: <b>So do I</b> (positive) / <b>Neither have I</b> (negative) – same auxiliary as the sentence.","Reply questions show interest: I had good marks. – <b>Did you</b>? · I was born in Poland. – <b>Were you</b>?","Emphasis: stressed auxiliary: She <b>does</b> eat meat! · I <b>did</b> do the dishes!","Short answers: Were they living in London? – Yes, they <b>were</b>."],"rule":"Always look at the auxiliary of the first sentence and repeat it.","items":[{"id":"i219","type":"input","q":"A: I’ve never seen anything like this. B: ___ ___ I. (2 words)","answers":["Neither have","Nor have"],"why":"Negative → Neither + have + I.","lang":"en","loose":true},{"id":"i220","type":"input","q":"A: I would love to go to the ocean. B: ___ ___ I! (2 words)","answers":["So would"],"why":"Positive → So + would + I.","lang":"en","loose":true},{"id":"i221","type":"input","q":"A: I had very good marks this term. B: ___ you? That’s great!","answers":["Did"],"why":"Reply question: past simple → Did you?","lang":"en"},{"id":"i222","type":"input","q":"A: I used to play rugby. B: ___ you? I didn’t know that.","answers":["Did"],"why":"used to (past) → Did you?","lang":"en"},{"id":"i223","type":"input","q":"A: She doesn’t eat meat. B: She ___ eat meat, but not very often.","answers":["does"],"why":"Emphatic does.","lang":"en"},{"id":"i224","type":"input","q":"She wan
