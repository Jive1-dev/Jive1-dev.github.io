102","type":"choice","q":"Welche Wortart ist <b>unveränderbar</b>?","options":["Pronomen","Partikel","Adjektiv","Nomen"],"correct":1,"why":"Partikeln (Präposition, Konjunktion, Adverb, Interjektion) verändern sich nie.","typeable":true},{"id":"m103","type":"choice","q":"Welche Wortarten sind <b>deklinierbar</b>?","options":["Nomen, Adjektiv, Pronomen","nur Verben","Partikeln","Verb und Adverb"],"correct":0,"why":"Deklinieren = nach Fall, Zahl, Geschlecht verändern.","typeable":false},{"id":"i104","type":"input","q":"Fachbegriffe für «Einzahl» und «Mehrzahl»? (mit Komma)","answers":["Singular, Plural"],"why":"Singular = Einzahl, Plural = Mehrzahl.","loose":true},{"id":"s105","type":"sort","q":"Veränderbar oder unveränderbar?","bins":["veränderbar","unveränderbar"],"items":[{"x":"laufen","bin":0},{"x":"Haus","bin":0},{"x":"schön","bin":0},{"x":"dieser","bin":0},{"x":"und","bin":1},{"x":"mit","bin":1},{"x":"oben","bin":1},{"x":"ach","bin":1}],"why":"Nur die Partikeln (und, mit, oben, ach) sind unveränderbar."},{"id":"c106","type":"card","q":"Zu welcher Wortart gehören «nichts, alles, wenig, viel, etwas»?","a":"Pronomen – obwohl sie unveränderbar sind."},{"id":"c107","type":"card","q":"Zu welcher Wortart gehört «zum» (zu + dem)?","a":"Präposition – Verschmelzungen aus Partikel und Pronomen zählen zu den Partikeln."}]},{"id":"w2","nr":"1.2","title":"Verben: Arten, schwach/stark, Stammformen","core":["<b>Vollverb</b> (Kern des Satzes), <b>Hilfsverb</b> (sein, haben, werden), <b>Modalverb</b> (dürfen, müssen, können, mögen, sollen, wollen).","<b>Schwach</b>: Präteritum -te, Partizip ge…t (lernen – lernte – gelernt). <b>Stark</b>: Vokalwechsel, Partizip -en (springen – sprang – gesprungen). Mischform (denken – dachte – gedacht) = stark.","Drei <b>Stammformen</b>: Infinitiv, Präteritum, Partizip II.","<b>Finit</b> = konjugiert (ich spiele, er las). <b>Infinit</b> = Infinitiv, Partizip I (singend), Partizip II (gespielt).","<b>Verbzusatz</b>: abtrennbarer Teil, der die Bedeutung ändert: Die Sonne geht <b>auf</b> (aufgehen). Drei <b>Modi</b>: Indikativ, Konjunktiv, Imperativ."],"rule":"Verben auf -ieren haben kein ge- im Partizip II: repariert, funktioniert.","items":[{"id":"i108","type":"input","q":"Zähle alle Hilfsverben auf (mit Komma).","answers":["sein, haben, werden","haben, sein, werden","werden, sein, haben","sein, werden, haben","haben, werden, sein","werden, haben, sein"],"why":"Hilfsverben: sein, haben, werden.","loose":true},{"id":"i109","type":"input","q":"Nenne die drei Stammformen (mit Komma).","answers":["Infinitiv, Präteritum, Partizip II","Infinitiv, Präteritum, Partizip 2"],"why":"Infinitiv – Präteritum – Partizip II (gehen – ging – gegangen).","loose":true},{"id":"s110","type":"sort","q":"Hilfsverb oder Modalverb?","bins":["Hilfsverb","Modalverb"],"items":[{"x":"sein","bin":0},{"x":"haben","bin":0},{"x":"werden","bin":0},{"x":"dürfen","bin":1},{"x":"müssen","bin":1},{"x":"können","bin":1},{"x":"sollen","bin":1},{"x":"wollen","bin":1}],"why":"Modalverben: dürfen, müssen, können, mögen, sollen, wollen."},{"id":"s96","type":"sort","q":"Schwach (regelmässig) oder stark (unregelmässig)?","bins":["schwach","stark"],"items":[{"x":"sein","bin":1},{"x":"haben","bin":1},{"x":"laufen","bin":1},{"x":"essen","bin":1},{"x":"kaufen","bin":0},{"x":"spazieren","bin":0},{"x":"lernen","bin":0},{"x":"schreiben","bin":1}],"why":"schwach: Präteritum mit -te, Partizip ge…t (lernte, gelernt; -ieren ohne ge-). stark: Vokalwechsel (trank, getrunken). Mischform (denken – dachte – gedacht) zählt bei euch als stark."},{"id":"s97","type":"sort","q":"Schwach (regelmässig) oder stark (unregelmässig)?","bins":["schwach","stark"],"items":[{"x":"halten","bin":1},{"x":"ankern","bin":0},{"x":"assimilieren","bin":0},{"x":"bilden","bin":0},{"x":"nagen","bin":0},{"x":"bitten","bin":1},{"x":"billigen","bin":0},{"x":"atmen","bin":0}],"why":"schwach: Präteritum mit -te, Partizip ge…t (lernte, gelernt; -ieren ohne ge-). stark: Vokalwechsel (trank, getrunken). Mischform (denken – dachte – gedacht) zählt bei euch als stark."},{"id":"s98","type":"sort","q":"Schwach (regelmässig) oder stark (unregelmässig)?","bins":["schwach","stark"],"items":[{"x":"trinken","bin":1},{"x":"beenden","bin":0},{"x":"gehen","bin":1},{"x":"schlafen","bin":1},{"x":"benutzen","bin":0},{"x":"denken","bin":1},{"x":"beten","bin":0},{"x":"lesen","bin":1}],"why":"schwach: Präteritum mit -te, Partizip ge…t (lernte, gelernt; -ieren ohne ge-). stark: Vokalwechsel (trank, getrunken). Mischform (denken – dachte – gedacht) zählt bei euch als stark."},{"id":"s100","type":"sort","q":"Schwach oder stark? (Prüfungsliste Version B)","bins":["schwach","stark"],"items":[{"x":"assimilieren","bin":0},{"x":"graben","bin":1},{"x":"trinken","bin":1},{"x":"nagen","bin":0},{"x":"verderben","bin":1},{"x":"billigen","bin":0},{"x":"fechten","bin":1},{"x":"gären","bin":1}],"why":"schwach: Präteritum mit -te, Partizip ge…t (lernte, gelernt; -ieren ohne ge-). stark: Vokalwechsel (trank, getrunken). Mischform (denken – dachte – gedacht) zählt bei euch als stark."},{"id":"i111","type":"input","q":"Stammformen von <b>springen</b>: Präteritum und Partizip II (mit Komma)","answers":["sprang, gesprungen"],"why":"springen – sprang – gesprungen","loose":true},{"id":"i112","type":"input","q":"Stammformen von <b>trinken</b>: Präteritum und Partizip II (mit Komma)","answers":["trank, getrunken"],"why":"trinken – trank – getrunken","loose":true},{"id":"i113","type":"input","q":"Stammformen von <b>schreiben</b>: Präteritum und Partizip II (mit Komma)","answers":["schrieb, geschrieben"],"why":"schreiben – schrieb – geschrieben","loose":true},{"id":"i114","type":"input","q":"Stammformen von <b>gehen</b>: Präteritum und Partizip II (mit Komma)","answers":["ging, gegangen"],"why":"gehen – ging – gegangen","loose":true},{"id":"i115","type":"input","q":"Stammformen von <b>lesen</b>: Präteritum und Partizip II (mit Komma)","answers":["las, gelesen"],"why":"lesen – las – gelesen","loose":true},{"id":"i116","type":"input","q":"Stammformen von <b>denken</b>: Präteritum und Partizip II (mit Komma)","answers":["dachte, gedacht"],"why":"denken – dachte – gedacht","loose":true},{"id":"i117","type":"input","q":"Stammformen von <b>bitten</b>: Präteritum und Partizip II (mit Komma)","answers":["bat, gebeten"],"why":"bitten – bat – gebeten","loose":true},{"id":"i118","type":"input","q":"Stammformen von <b>halten</b>: Präteritum und Partizip II (mit Komma)","answers":["hielt, gehalten"],"why":"halten – hielt – gehalten","loose":true},{"id":"i119","type":"input","q":"Stammformen von <b>schlafen</b>: Präteritum und Partizip II (mit Komma)","answers":["schlief, geschlafen"],"why":"schlafen – schlief – geschlafen","loose":true},{"id":"i120","type":"input","q":"Stammformen von <b>laufen</b>: Präteritum und Partizip II (mit Komma)","answers":["lief, gelaufen"],"why":"laufen – lief – gelaufen","loose":true},{"id":"i121","type":"input","q":"Stammformen von <b>lernen</b>: Präteritum und Partizip II (mit Komma)","answers":["lernte, gelernt"],"why":"lernen – lernte – gelernt","loose":true},{"id":"i122","type":"input","q":"Stammformen von <b>reparieren</b>: Präteritum und Partizip II (mit Komma)","answers":["reparierte, repariert"],"why":"reparieren – reparierte – repariert","loose":true},{"id":"m123","type":"choice","q":"Wie viele Modi (Modalformen) hat ein Verb?","options":["2","3","4","6"],"correct":1,"why":"Indikativ (Tatsache), Konjunktiv (Wunsch), Imperativ (Befehl).","typeable":true},{"id":"m124","type":"choice","q":"«gespielt» ist …","options":["finit","infinit"],"correct":1,"why":"Partizip II = infinite Form (nicht in eine Person gesetzt).","typeable":false},{"id":"m125","type":"choice","q":"«er las» ist …","options":["finit","infinit"],"correct":0,"why":"in die Person gesetzt (er) → finit.","typeable":false},{"id":"m126","type":"choice","q":"Welches Wort ist der Verbzusatz? «Er nimmt den Anhalter mit.»","options":["nimmt","den","Anhalter","mit"],"correct":3,"why":"mitnehmen → «mit» ist der abgetrennte Verbzusatz.","typeable":false},{"id":"c127","type":"card","q":"Was ist ein Verbzusatz? Gib ein Beispiel.","a":"Ein abtrennbarer Teil des Verbs, der die Bedeutung ändert und am Satzende steht: Die Sonne geht auf (aufgehen). Er tritt ein (eintreten)."}]}]},{"id":"g2","title":"Nomen, Adjektive, Pronomen, Partikeln","units":[{"id":"w3","nr":"2.1","title":"Nomen: Kasus, Genus, Abstrakta/Konkreta","core":["Vier Fälle: <b>Nominativ</b> (wer/was?), <b>Genitiv</b> (wessen?), <b>Dativ</b> (wem?), <b>Akkusativ</b> (wen/was?).","Drei Genera: Maskulinum (der), Femininum (die), Neutrum (das). Genus ≠ natürliches Geschlecht: <i>das</i> Mädchen.","<b>Konkreta</b>: Gegenstände, Namen, Stoffe (Baum, Maria, Gold). <b>Abstrakta</b>: nicht anfassbar (Liebe, Freiheit, Langeweile)."],"rule":"Kann man es anfassen oder sehen? → Konkretum. Gefühl, Idee, Zustand → Abstraktum.","items":[{"id":"m128","type":"choice","q":"Welcher Fall fragt «wessen?»","options":["Nominativ","Genitiv","Dativ","Akkusativ"],"correct":1,"why":"Genitiv: wessen? – des Mannes.","typeable":true},{"id":"m129","type":"choice","q":"Welcher Fall fragt «wem?»","options":["Nominativ","Genitiv","Dativ","Akkusativ"],"correct":2,"why":"Dativ: wem? – dem Mann.","typeable":true},{"id":"m130","type":"choice","q":"Welcher Fall fragt «wen oder was?»","options":["Nominativ","Genitiv","Dativ","Akkusativ"],"correct":3,"why":"Akkusativ: wen/was? – den Mann.","typeable":true},{"id":"m131","type":"choice","q":"Welches <b>Genus</b> (grammatisches Geschlecht) hat «das Mädchen»?","options":["Maskulinum","Femininum","Neutrum"],"correct":2,"why":"Das Genus erkennt man am Artikel: das → Neutrum.","typeable":true},{"id":"s132","type":"sort","q":"Abstraktum oder Konkretum?","bins":["Abstrakta","Konkreta"],"items":[{"x":"der Baum","bin":1},{"x":"die Mutter","bin":1},{"x":"das GIBZ","bin":1},{"x":"die Langeweile","bin":0},{"x":"die Freude","bin":0},{"x":"der Duden","bin":1},{"x":"der Bleistift","bin":1},{"x":"die Philosophie","bin":0}],"why":"Abstrakta sind nicht gegenständlich: Freude, Langeweile, Philosophie."},{"id":"s133","type":"sort","q":"Abstraktum oder Konkretum?","bins":["Abstrakta","Konkreta"],"items":[{"x":"die Liebe","bin":0},{"x":"der Hass","bin":0},{"x":"die Freiheit","bin":0},{"x":"das Gold","bin":1},{"x":"Maria","bin":1},{"x":"Japan","bin":1},{"x":"der Stern","bin":1},{"x":"die Angst","bin":0}],"why":"Eigennamen und Stoffe (Gold) sind Konkreta."}]},{"id":"w4","nr":"2.2","title":"Adjektive: Steigerung und Besonderheiten","core":["Drei Steigerungsstufen: <b>Positiv</b> (gross), <b>Komparativ</b> (grösser), <b>Superlativ</b> (am grössten).","Unregelmässig: gut – besser – am besten · viel – mehr – am meisten · gern – lieber – am liebsten · hoch – höher – am höchsten · nah – näher – am nächsten.","Nicht steigerbar: fertig, schwanger, tot …","Ortsnamen mit <b>-er</b> werden <b>grossgeschrieben</b> und nie dekliniert: der Berner Bär, die Zuger Schule, Schweizer Käse. Mit -isch aber klein: australisch."],"rule":"Attributiv (das grosse Haus), adverbial (sie zeichnet schön), prädikativ (sie ist schön) – nur attributiv wird dekliniert.","items":[{"id":"m134","type":"choice","q":"Wie heisst die zweite Steigerungsform?","options":["Positiv","Komparativ","Superlativ"],"correct":1,"why":"Positiv – Komparativ – Superlativ.","typeable":true},{"id":"i135","type":"input","q":"Komparativ von <b>treu</b>","answers":["treuer"],"why":"treu – treuer – am treusten"},{"id":"i136","type":"input","q":"Superlativ von <b>treu</b>","answers":["am treusten","am treuesten"],"why":"treu – treuer – am treusten"},{"id":"i137","type":"input","q":"Komparativ von <b>breit</b>","answers":["breiter"],"why":"breit – breiter – am breitesten"},{"id":"i138","type":"input","q":"Superlativ von <b>breit</b>","answers":["am breitesten"],"why":"breit – breiter – am breitesten"},{"id":"i139","type":"input","q":"Komparativ von <b>viel</b>","answers":["mehr"],"why":"viel – mehr – am meisten"},{"id":"i140","type":"input","q":"Superlativ von <b>viel</b>","answers":["am meisten"],"why":"viel – mehr – am meisten"},{"id":"i141","type":"input","q":"Komparativ von <b>schnell</b>","answers":["schneller"],"why":"schnell – schneller – am schnellsten"},{"id":"i142","type":"input","q":"Superlativ von <b>schnell</b>","answers":["am schnellsten"],"why":"schnell – schneller – am schnellsten"},{"id":"i143","type":"input","q":"Komparativ von <b>teuer</b>","answers":["teurer"],"why":"teuer – teurer – am teuersten"},{"id":"i144","type":"input","q":"Superlativ von <b>teuer</b>","answers":["am teuersten"],"why":"teuer – teurer – am teuersten"},{"id":"i145","type":"input","q":"Komparativ von <b>nah</b>","answers":["näher"],"why":"nah – näher – am nächsten"},{"id":"i146","type":"input","q":"Superlativ von <b>nah</b>","answers":["am nächsten"],"why":"nah – näher – am nächsten"},{"id":"i147","type":"input","q":"Komparativ von <b>hoch</b>","answers":["höher"],"why":"hoch – höher – am höchsten"},{"id":"i148","type":"input","q":"Superlativ von <b>hoch</b>","answers":["am höchsten"],"why":"hoch – höher – am höchsten"},{"id":"i149","type":"input","q":"Komparativ von <b>gern</b>","answers":["lieber"],"why":"gern – lieber – am liebsten"},{"id":"i150","type":"input","q":"Superlativ von <b>gern</b>","answers":["am liebsten"],"why":"gern – lieber – am liebsten"},{"id":"i151","type":"input","q":"Komparativ von <b>gut</b>","answers":["besser"],"why":"gut – besser – am besten"},{"id":"i152","type":"input","q":"Superlativ von <b>gut</b>","answers":["am besten"],"why":"gut – besser – am besten"},{"id":"i153","type":"input","q":"Komparativ von <b>warm</b>","answers":["wärmer"],"why":"warm – wärmer – am wärmsten"},{"id":"i154","type":"input","q":"Superlativ von <b>warm</b>","answers":["am wärmsten"],"why":"warm – wärmer – am wärmsten"},{"id":"i155","type":"input","q":"Komparativ von <b>gross</b>","answers":["grösser"],"why":"gross – grösser – am grössten"},{"id":"i156","type":"input","q":"Superlativ von <b>gross</b>","answers":["am grössten"],"why":"gross – grösser – am grössten"},{"id":"m157","type":"choice","q":"Welches Adjektiv ist NICHT steigerbar?","options":["schnell","fertig","warm","gross"],"correct":1,"why":"fertig, schwanger: kein «fertiger» im normalen Gebrauch.","typeable":false},{"id":"m158","type":"choice","q":"Welche Schreibweise ist richtig?","options":["die berner Zeitung","die Berner Zeitung","die Bernerin Zeitung"],"correct":1,"why":"Ortsnamen mit -er: immer gross und unverändert.","typeable":false},{"id":"i159","type":"input","q":"Nenne ein Beispiel für ein grossgeschriebenes Adjektiv.","answers":["Schweizer","Berner","Zuger","Londoner","Zürcher","Kölner","Luzerner","Basler"],"why":"Adjektive aus Ortsnamen mit -er: Schweizer, Berner, Londoner …"},{"id":"m160","type":"choice","q":"«Sie zeichnet schön» – wie wird das Adjektiv verwendet?","options":["attributiv","adverbial","prädikativ"],"correct":1,"why":"Es bestimmt das Verb näher → adverbial.","typeable":false}]},{"id":"w5","nr":"2.3","title":"Pronomen: die Arten","core":["An der Prüfung musst du nur <b>erkennen</b>, dass ein Wort ein <b>Pronomen</b> ist – und <b>vier Arten nennen</b> können. Lerne diese vier: <b>Personal</b> (ich, du, mich), <b>Possessiv</b> (mein, dein, euer), <b>Demonstrativ</b> (dieser, jener), <b>Zahlpronomen</b> (eins, zwei).","Auch <b>Artikel</b> sind Pronomen: der/die/das, ein/eine. Aber Ordinalzahlen (erstens) = Adjektiv!"],"rule":"Stellvertreter ODER Begleiter des Nomens → Pronomen. Welche Unterart, musst du beim Bestimmen nicht sagen.","items":[{"id":"m161","type":"choice","q":"Welche Pronomen-Art ist <b>dieser</b>?","options":["Personalpronomen","Possessivpronomen","Demonstrativpronomen"],"correct":2,"why":"dieser = Demonstrativpronomen","typeable":false},{"id":"m162","type":"choice","q":"Welche Pronomen-Art ist <b>mein</b>?","options":["Personalpronomen","Possessivpronomen","Demonstrativpronomen"],"correct":1,"why":"mein = Possessivpronomen","typeable":false},{"id":"m166","type":"choice","q":"Welche Pronomen-Art ist <b>ich</b>?","options":["Personalpronomen","Possessivpronomen","Demonstrativpronomen"],"correct":0,"why":"ich = Personalpronomen","typeable":false},{"id":"m168","type":"choice","q":"Zu welcher der fünf <b>Wortarten</b> gehört der Artikel «die»?","options":["Nomen","Pronomen","Partikel","Adjektiv"],"correct":1,"why":"Gut gedacht, falls du «Begleiter» geschrieben hast: Ein Artikel begleitet das Nomen. Gefragt ist aber die <b>Wortart</b>, und da gehören Artikel zu den <b>Pronomen</b>. An der Prüfung schreibst du also «Pronomen».","typeable":true},{"id":"m169","type":"choice","q":"Zu welcher Wortart gehört «erstens»?","options":["Pronomen","Adverb","Adjektiv"],"correct":2,"why":"Ordinalzahlen zählen zu den Adjektiven.","typeable":false},{"id":"c170","type":"card","q":"Nenne mindestens vier Pronomen-Arten mit Beispiel.","a":"Personal (ich), Possessiv (mein), Demonstrativ (dieser), Zahlpronomen (eins)."}]},{"id":"w6","nr":"2.4","title":"Partikeln: die vier Unterarten","core":["<b>Präposition</b>: vor Nomen, verlangt einen Fall (mit, wegen, im, trotz).","<b>Konjunktion</b>: verbindet Wörter/Sätze (und, weil, obwohl, weder … noch, während + Nebensatz).","<b>Adverb</b>: sagt wie, wo, wann, warum (oben, gestern, nicht, deshalb, darüber).","<b>Interjektion</b>: Ausruf, Gefühl (ach, oh, au, ja als Antwort)."],"rule":"«während» + Nomen = Präposition (während der Saison); «während» + Nebensatz = Konjunktion (während Peter spielt).","items":[{"id":"c171","type":"card","q":"Nenne die vier Unterarten der Partikeln.","a":"Präposition (Verhältnis, verlangt Fall), Konjunktion (verbindet), Adverb (Umstand: wie/wo/wann/warum), Interjektion (Ausruf)."},{"id":"i171a","type":"input","q":"Welche Partikel-Unterart <b>verbindet</b> Wörter, Satzteile oder Sätze (und, weil, dass)?","answers":["Konjunktion","Konjunktionen","Bindewort"],"why":"Konjunktion = Bindewort: und, oder, weil, dass, wenn."},{"id":"i171b","type":"input","q":"Welche Partikel-Unterart zeigt ein <b>Verhältnis</b> an und verlangt einen <b>Fall</b> (auf, mit, wegen)?","answers":["Präposition","Präpositionen","Verhältniswort"],"why":"Präposition = Verhältniswort: auf dem Tisch (Dativ), wegen des Regens (Genitiv)."},{"id":"i171c","type":"input","q":"Welche Partikel-Unterart sagt, <b>wie, wo, wann oder warum</b> etwas passiert (oft, hier, gestern)?","answers":["Adverb","Adverbien","Umstandswort"],"why":"Adverb = Umstandswort: hier, gestern, gern, deshalb, nicht."},{"id":"i171d","type":"input","q":"Welche Partikel-Unterart ist ein <b>Ausruf</b> oder Laut (au, ach, hallo)?","answers":["Interjektion","Interjektionen","Ausrufewort"],"why":"Interjektion = Ausrufewort: au!, ach, hallo, pst."},{"id":"m172","type":"choice","q":"Welche Wortart ist das markierte Wort?<br><span class=\\"sent\\"><mark>Bis</mark> er endlich die Rede beendete, war ich eingeschlafen.</span>","options":["Nomen","Verb","Adjektiv","Pronomen","Adverb","Präposition","Konjunktion","Interjektion"],"correct":6,"why":"Konjunktion (Partikel): verbindet Wörter oder Sätze: und, wenn, denn, weder … noch, weil.","typeable":false},{"id":"m173","type":"choice","q":"Welche Wortart ist das markierte Wort?<br><span class=\\"sent\\"><mark>Bis</mark> nächstes Jahr sind diese Schuhe aus der Mode.</span>","options":["Nomen","Verb","Adjektiv","Pronomen","Adverb","Präposition","Konjunktion","Interjektion"],"correct":5,"why":"Präposition (Partikel): steht vor einem Nomen/Pronomen und verlangt einen Fall: im, auf, mit, bei, wegen.","typeable":false},{"id":"m174","type":"choice","q":"Welche Wortart ist das markierte Wort?<br><span class=\\"sent\\"><mark>Da</mark> Andrea ein teures Hobby hat, arbeitet sie in den Ferien.</span>","options":["Nomen","Verb","Adjektiv","Pronomen","Adverb","Präposition","Konjunktion","Interjektion"],"correct":6,"why":"Konjunktion (Partikel): verbindet Wörter oder Sätze: und, wenn, denn, weder … noch, weil.","typeable":false},{"id":"m175","type":"choice","q":"Welche Wortart ist das markiert e no auxiliary: <b>Who wrote</b> this? (not: Who did write)","Prepositions often go to the end: Who did you go <b>with</b>? What are you talking <b>about</b>?"],"rule":"Past simple questions: did + infinitive (Where did you go?), never «did you went».","items":[{"id":"o180","type":"order","q":"Put the question in order:","items":["Where","did","you","go","last","summer?"],"why":"question word + did + subject + infinitive"},{"id":"o181","type":"order","q":"Put the question in order:","items":["Who","did","you","go","to","the","party","with?"],"why":"Preposition at the end."},{"id":"o182","type":"order","q":"Put the question in order:","items":["How","long","have","you","been","learning","English?"],"why":"Present perfect question: have + subject + been + -ing."},{"id":"m183","type":"choice","q":"Which question is correct?","options":["Who did write this song?","Who wrote this song?","Who written this song?"],"correct":1,"why":"Subject question → no auxiliary.","typeable":false},{"id":"m184","type":"choice","q":"Which question is correct?","options":["What you are doing?","What are you doing?","What do you doing?"],"correct":1,"why":"auxiliary (are) before subject.","typeable":false}]},{"id":"q2","nr":"1.2","title":"Indirect questions","core":["Polite lead-ins: <b>Could you tell me</b> … / <b>Would you mind telling me</b> … / <b>Do you know</b> … / <b>I wonder</b> … / <b>I’d like to know</b> …","After them: <b>normal word order</b> (subject + verb) and <b>no do/does/did</b>: Where <i>does she play</i>? → Could you tell me where <i>she plays</i>?","Yes/No questions use <b>if</b> or <b>whether</b>: Does he live in Paris? → Do you know if he lives in Paris?"],"rule":"Tense and person stay the same – only the word order changes, and do/does/did disappears.","items":[{"id":"i185","type":"input","q":"Mach eine indirekte Frage (z. B. mit «Could you tell me …»):<br><b>Where does she play tennis?</b>","answers":["Could you tell me where she plays tennis?","Would you mind telling me where she plays tennis?","Do you know where she plays tennis?","Can you tell me where she plays tennis?"],"why":"Nach «Could you tell me / Do you know …» normale Satzstellung (Subjekt vor Verb), kein do/does/did. Ja/Nein-Fragen mit if/whether.","loose":true,"lang":"en"},{"id":"i186","type":"input","q":"Mach eine indirekte Frage (z. B. mit «Could you tell me …»):<br><b>Does he live in Paris?</b>","answers":["Could you tell me if he lives in Paris?","Could you tell me whether he lives in Paris?","Would you mind telling me if he lives in Paris?","Would you mind telling me whether he lives in Paris?","Do you know if he lives in Paris?","Do you know whether he lives in Paris?","Can you tell me if he lives in Paris?","Can you tell me whether he lives in Paris?"],"why":"Nach «Could you tell me / Do you know …» normale Satzstellung (Subjekt vor Verb), kein do/does/did. Ja/Nein-Fragen mit if/whether.","loose":true,"lang":"en"},{"id":"i187","type":"input","q":"Mach eine indirekte Frage (z. B. mit «Could you tell me …»):<br><b>What time did they leave?</b>","answers":["Could you tell me what time they left?","Would you mind telling me what time they left?","Do you know what time they left?","Can you tell me what time they left?"],"why":"Nach «Could you tell me / Do you know …» normale Satzstellung (Subjekt vor Verb), kein do/does/did. Ja/Nein-Fragen mit if/whether.","loose":true,"lang":"en"},{"id":"i188","type":"input","q":"Mach eine indirekte Frage (z. B. mit «Could you tell me …»):<br><b>Is he hungry?</b>","answers":["Could you tell me if he is hungry?","Could you tell me whether he is hungry?","Would you mind telling me if he is hungry?","Would you mind telling me whether he is hungry?","Do you know if he is hungry?","Do you know whether he is hungry?","Can you tell me if he is hungry?","Can you tell me whether he is hungry?"],"why":"Nach «Could you tell me / Do you know …» normale Satzstellung (Subjekt vor Verb), kein do/does/did. Ja/Nein-Fragen mit if/whether.","loose":true,"lang":"en"},{"id":"i189","type":"input","q":"Mach eine indirekte Frage (z. B. mit «Could you tell me …»):<br><b>What is this?</b>","answers":["Could you tell me what this is?","Would you mind telling me what this is?","Do you know what this is?","Can you tell me what this is?"],"why":"Nach «Could you tell me / Do you know …» normale Satzstellung (Subjekt vor Verb), kein do/does/did. Ja/Nein-Fragen mit if/whether.","loose":true,"lang":"en"},{"id":"i190","type":"input","q":"Mach eine indirekte Frage (z. B. mit «Could you tell me …»):<br><b>Did he go on holiday this summer?</b>","answers":["Could you tell me if he went on holiday this summer?","Could you tell me whether he went on holiday this summer?","Would you mind telling me if he went on holiday this summer?","Would you mind telling me whether he went on holiday this summer?","Do you know if he went on holiday this summer?","Do you know whether he went on holiday this summer?","Can you tell me if he went on holiday this summer?","Can you tell me whether he went on holiday this summer?"],"why":"Nach «Could you tell me / Do you know …» normale Satzstellung (Subjekt vor Verb), kein do/does/did. Ja/Nein-Fragen mit if/whether.","loose":true,"lang":"en"},{"id":"i191","type":"input","q":"Mach eine indirekte Frage (z. B. mit «Could you tell me …»):<br><b>Do they work in Canada?</b>","answers":["Could you tell me if they work in Canada?","Could you tell me whether they work in Canada?","Would you mind telling me if they work in Canada?","Would you mind telling me whether they work in Canada?","Do you know if they work in Canada?","Do you know whether they work in Canada?","Can you tell me if they work in Canada?","Can you tell me whether they work in Canada?"],"why":"Nach «Could you tell me / Do you know …» normale Satzstellung (Subjekt vor Verb), kein do/does/did. Ja/Nein-Fragen mit if/whether.","loose":true,"lang":"en"},{"id":"i192","type":"input","q":"Mach eine indirekte Frage (z. B. mit «Could you tell me …»):<br><b>Where did you put the remote?</b>","answers":["Could you tell me where you put the remote?","Would you mind telling me where you put the remote?","Do you know where you put the remote?","Can you tell me where you put the remote?"],"why":"Nach «Could you tell me / Do you know …» normale Satzstellung (Subjekt vor Verb), kein do/does/did. Ja/Nein-Fragen mit if/whether.","loose":true,"lang":"en"},{"id":"i193","type":"input","q":"Mach eine indirekte Frage (z. B. mit «Could you tell me …»):<br><b>Why did you do that?</b>","answers":["Could you tell me why you did that?","Would you mind telling me why you did that?","Do you know why you did that?","Can you tell me why you did that?"],"why":"Nach «Could you tell me / Do you know …» normale Satzstellung (Subjekt vor Verb), kein do/does/did. Ja/Nein-Fragen mit if/whether.","loose":true,"lang":"en"},{"id":"i194","type":"input","q":"Mach eine indirekte Frage (z. B. mit «Could you tell me …»):<br><b>Have you seen my phone anywhere?</b>","answers":["Could you tell me if you've seen my phone anywhere?","Could you tell me whether you've seen my phone anywhere?","Would you mind telling me if you've seen my phone anywhere?","Would you mind telling me whether you've seen my phone anywhere?","Do you know if you've seen my phone anywhere?","Do you know whether you've seen my phone anywhere?","Can you tell me if you've seen my phone anywhere?","Can you tell me whether you've seen my phone anywhere?"],"why":"Nach «Could you tell me / Do you know …» normale Satzstellung (Subjekt vor Verb), kein do/does/did. Ja/Nein-Fragen mit if/whether.","loose":true,"lang":"en"},{"id":"i195","type":"input","q":"Mach eine indirekte Frage (z. B. mit «Could you tell me …»):<br><b>When does the train leave?</b>","answers":["Could you tell me when the train leaves?","Would you mind telling me when the train leaves?","Do you know when the train leaves?","Can you tell me when the train leaves?"],"why":"Nach «Could you tell me / Do you know …» normale Satzstellung (Subjekt vor Verb), kein do/does/did. Ja/Nein-Fragen mit if/whether.","loose":true,"lang":"en"},{"id":"i196","type":"input","q":"Mach eine indirekte Frage (z. B. mit «Could you tell me …»):<br><b>How much does this cost?</b>","answers":["Could you tell me how much this costs?","Would you mind telling me how much this costs?","Do you know how much this costs?","Can you tell me how much this costs?"],"why":"Nach «Could you tell me / Do you know …» normale Satzstellung (Subjekt vor Verb), kein do/does/did. Ja/Nein-Fragen mit if/whether.","loose":true,"lang":"en"},{"id":"m197","type":"choice","q":"Which is correct?","options":["Could you tell me where is the station?","Could you tell me where the station is?","Could you tell me where does the station is?"],"correct":1,"why":"Indirect question: subject before verb.","typeable":false},{"id":"m198","type":"choice","q":"Which is correct?","options":["Do you know if she likes jazz?","Do you know does she like jazz?","Do you know if does she like jazz?"],"correct":0,"why":"if + normal word order, no does.","typeable":false}]}]},{"id":"e2","title":"Auxiliary verbs and question tags (1B)","units":[{"id":"a1","nr":"2.1","title":"Question tags","core":["Positive sentence → <b>negative tag</b>: You have a car, <b>haven’t you</b>? · Negative sentence → <b>positive tag</b>: You haven’t seen it, <b>have you</b>?","Use the <b>same auxiliary</b> as in the sentence (can → can’t, is → isn’t, will → won’t). No auxiliary? Use do/does/did: They like it, <b>don’t they</b>?","Special: I am … → <b>aren’t I</b>? · Let’s … → <b>shall we</b>? · This/That is … → isn’t <b>it</b>?"],"rule":"Plus → minus, minus → plus. Subject in the tag is always a pronoun.","items":[{"id":"m199","type":"choice","q":"You have a car, ___?","options":["haven't you","don't you","do you"],"correct":0,"why":"British English: have (possession) often takes haven’t; your worksheet key: haven’t you.","typeable":false},{"id":"m200","type":"choice","q":"She has finished her work, ___?","options":["hasn't she","didn't she","has she"],"correct":0,"why":"has finished → hasn’t she","typeable":false},{"id":"m201","type":"choice","q":"They were on time, ___?","options":["were they","weren't they","didn't they"],"correct":1,"why":"were → weren’t","typeable":false},{"id":"m202","type":"choice","q":"He can play the guitar, ___?","options":["does he","can't he","can he"],"correct":1,"why":"can → can’t","typeable":false},{"id":"m203","type":"choice","q":"They don't like spicy food, ___?","options":["don't they","do they","did they"],"correct":1,"why":"negative → positive: do they","typeable":false},{"id":"m204","type":"choice","q":"You're not leaving yet, ___?","options":["are you","didn't you","aren't you"],"correct":0,"why":"negative → positive: are you","typeable":false},{"id":"m205","type":"choice","q":"We should go now, ___?","options":["should we","shouldn't we","should not we"],"correct":1,"why":"should → shouldn’t","typeable":false},{"id":"i206","type":"input","q":"Question tag: <b>You're coming to the meeting, ___?</b>","answers":["aren't you"],"why":"are → aren’t","lang":"en"},{"id":"i207","type":"input","q":"Question tag: <b>She doesn't like coffee, ___?</b>","answers":["does she"],"why":"doesn't → does","lang":"en"},{"id":"i208","type":"input","q":"Question tag: <b>They have finished their homework, ___?</b>","answers":["haven't they"],"why":"have → haven’t","lang":"en"},{"id":"i209","type":"input","q":"Question tag: <b>It's a beautiful day, ___?</b>","answers":["isn't it"],"why":"is → isn’t","lang":"en"},{"id":"i210","type":"input","q":"Question tag: <b>He can speak Spanish, ___?</b>","answers":["can't he"],"why":"can → can’t","lang":"en"},{"id":"i211","type":"input","q":"Question tag: <b>You didn't forget the tickets, ___?</b>","answers":["did you"],"why":"didn't → did","lang":"en"},{"id":"i212","type":"input","q":"Question tag: <b>She won't be late, ___?</b>","answers":["will she"],"why":"won't → will","lang":"en"},{"id":"i213","type":"input","q":"Correct the tag: <b>You don’t know the answer, don’t you?</b> (write the correct tag or «correct»)","answers":["do you"],"why":"negative → positive tag.","lang":"en"},{"id":"i214","type":"input","q":"Correct the tag: <b>They are coming to the party, isn’t they?</b>","answers":["aren't they"],"why":"They are → aren’t they.","lang":"en"},{"id":"i215","type":"input","q":"Correct the tag: <b>He didn’t call you, didn’t he?</b>","answers":["did he"],"why":"negative → positive.","lang":"en"},{"id":"i216","type":"input","q":"Correct the tag: <b>This isn’t the right way, isn’t it?</b>","answers":["is it"],"why":"negative → positive.","lang":"en"},{"id":"i217","type":"input","q":"Correct the tag: <b>We haven’t met before, have we?</b>","answers":["correct"],"why":"Already correct.","lang":"en"},{"id":"i218","type":"input","q":"Let’s have some lunch, ___ we?","answers":["shall"],"why":"Let’s … shall we?","lang":"en"}]},{"id":"a2","nr":"2.2","title":"So/Neither, reply questions, emphasis","core":["Agreeing: <b>So do I</b> (positive) / <b>Neither have I</b> (negative) – same auxiliary as the sentence.","Reply questions show interest: I had good marks. – <b>Did you</b>? · I was born in Poland. – <b>Were you</b>?","Emphasis: stressed auxiliary: She <b>does</b> eat meat! · I <b>did</b> do the dishes!","Short answers: Were they living in London? – Yes, they <b>were</b>."],"rule":"Always look at the auxiliary of the first sentence and repeat it.","items":[{"id":"i219","type":"input","q":"A: I’ve never seen anything like this. B: ___ ___ I. (2 words)","answers":["Neither have","Nor have"],"why":"Negative → Neither + have + I.","lang":"en","loose":true},{"id":"i220","type":"input","q":"A: I would love to go to the ocean. B: ___ ___ I! (2 words)","answers":["So would"],"why":"Positive → So + would + I.","lang":"en","loose":true},{"id":"i221","type":"input","q":"A: I had very good marks this term. B: ___ you? That’s great!","answers":["Did"],"why":"Reply question: past simple → Did you?","lang":"en"},{"id":"i222","type":"input","q":"A: I used to play rugby. B: ___ you? I didn’t know that.","answers":["Did"],"why":"used to (past) → Did you?","lang":"en"},{"id":"i223","type":"input","q":"A: She doesn’t eat meat. B: She ___ eat meat, but not very often.","answers":["does"],"why":"Emphatic does.","lang":"en"},{"id":"i224","type":"input","q":"She wants to buy a new house but he ___.","answers":["doesn't","does not"],"why":"Avoid repetition: he doesn’t (want to).","lang":"en"},{"id":"i225","type":"input","q":"A: Were they living in London? B: Yes, they ___.","answers":["were"],"why":"Short answer with the same auxiliary.","lang":"en"},{"id":"i226","type":"input","q":"A: You didn’t do the dishes! B: I ___ do them!","answers":["did"],"why":"Emphatic did.","lang":"en"},{"id":"i227","type":"input","q":"I was born in Poland. – ___ you? That’s funny. (reply question)","answers":["Were"],"why":"was born → Were you?","lang":"en"},{"id":"i228","type":"input","q":"My girlfriend speaks Polish, but I ___.","answers":["don't","do not"],"why":"speaks (present simple) → I don’t.","lang":"en"},{"id":"i229","type":"input","q":"She’s from Lublin. – ___ she? So am I!","answers":["Is"],"why":"She’s = she is → Is she?","lang":"en"},{"id":"i230","type":"input","q":"Neither do I. Well, I ___ speak a little Polish, but not much.","answers":["do"],"why":"Emphatic do.","lang":"en"}]}],"exam":{"id":"en-exam","title":"Exam 1 – File 1A+1B","minutes":45,"intro":"Questions, indirect questions, auxiliaries & tags, past simple vs present perfect, the…the…, verbs.","questions":[{"type":"choice","q":"You have a car, ___?","options":["haven't you","don't you","do you"],"correct":0,"why":"British English: have (possession) often takes haven’t; your worksheet key: haven’t you."},{"type":"choice","q":"She has finished her work, ___?","options":["hasn't she","didn't she","has she"],"correct":0,"why":"has finished → hasn’t she"},{"type":"choice","q":"They were on time, ___?","options":["were they","weren't they","didn't they"],"correct":1,"why":"were → weren’t"},{"type":"choice","q":"He can play the guitar, ___?","options":["does he","can't he","can he"],"correct":1,"why":"can → can’t"},{"type":"choice","q":"They don't like spicy food, ___?","options":["don't they","do they","did they"],"correct":1,"why":"negative → positive: do they"},{"type":"choice","q":"You're not leaving yet, ___?","options":["are you","didn't you","aren't you"],"correct":0,"why":"negative → positive: are you"},{"type":"choice","q":"We should go now, ___?","options":["should we","shouldn't we","should not we"],"correct":1,"why":"should → shouldn’t"},{"type":"choice","q":"I ___ to London last summer.","options":["went","have gone","have been"],"correct":0,"why":"last summer = finished time → past simple."},{"type":"choice","q":"___ you ever ___ sushi?","options":["Did / eat","Have / eaten","Do / eat"],"correct":1,"why":"ever → present perfect."},{"type":"choice","q":"She ___ here since 2020.","options":["lived","has lived","lives"],"correct":1,"why":"since → present perfect."},{"type":"choice","q":"When ___ you ___ your job?","options":["have / started","did / start","did / started"],"correct":1,"why":"When …? → past simple, did + infinitive."},{"type":"choice","q":"I ___ my homework yet.","options":["didn't finish","haven't finished","don't finish"],"correct":1,"why":"yet → present perfect."},{"type":"choice","q":"They ___ married two years ago.","options":["got","have got","have gotten"],"correct":0,"why":"ago → past simple."},{"type":"choice","q":"We ___ just ___ lunch.","options":["have / had","did / have","had / had"],"correct":0,"why":"just → present perfect."},{"type":"choice","q":"Shakespeare ___ many plays.","options":["has written","wrote","writes"],"correct":1,"why":"Finished life/time → past simple."},{"type":"open","q":"Make indirect: Where did you put the remote? (Would you mind telling me …)","a":"Would you mind telling me where you put the remote?"},{"type":"open","q":"Make indirect: Have you seen my phone anywhere?","a":"Would you mind telling me if/whether you’ve seen my phone anywhere?"},{"type":"open","q":"Rewrite: If you wait longer, your food gets colder. (The … the …)","a":"The longer you wait, the colder your food gets."},{"type":"open","q":"Verb quiz: bring, buy, catch, begin – past simple and past participle + German.","a":"brought/brought (bringen) · bought/bought (kaufen) · caught/caught (fangen) · began/begun (beginnen)"},{"type":"open","q":"Vocabulary: What does <b>absent-minded</b> mean? Use it in a sentence.","a":"geistesabwesend, zerstreut"},{"type":"open","q":"Vocabulary: What does <b>laid-back</b> mean? Use it in a sentence.","a":"locker, gelassen, entspannt"},{"type":"open","q":"Vocabulary: What does <b>tight-fisted</b> mean? Use it in a sentence.","a":"geizig"},{"type":"open","q":"Vocabulary: What does <b>float</b> mean? Use it in a sentence.","a":"auf dem Wasser treiben, schweben"},{"type":"open","q":"Vocabulary: What does <b>case</b> mean? Use it in a sentence.","a":"Fall, Angelegenheit, Sache"},{"type":"open","q":"Vocabulary: What does <b>unlocked</b> mean? Use it in a sentence.","a":"unverschlossen, nicht zugesperrt"},{"type":"open","q":"Vocabulary: What does <b>wonder whether</b> mean? Use it in a sentence.","a":"sich fragen, ob"},{"type":"open","q":"Vocabulary: What does <b>embarrassed</b> mean? Use it in a sentence.","a":"verlegen"},{"type":"open","q":"Vocabulary: What does <b>light-hearted</b> mean? Use it in a sentence.","a":"unbeschwert"},{"type":"open","q":"Vocabulary: What does <b>publish</b> mean? Use it in a sentence.","a":"veröffentlichen"},{"type":"open","q":"Vocabulary: What does <b>improve</b> mean? Use it in a sentence.","a":"verbessern; optimieren"},{"type":"open","q":"Vocabulary: What does <b>selfish</b> mean? Use it in a sentence.","a":"egoistisch, selbstsüchtig"},{"type":"open","q":"Vocabulary: What does <b>innocent</b> mean? Use it in a sentence.","a":"unschuldig; harmlos"},{"type":"open","q":"Vocabulary: What does <b>occasion</b> mean? Use it in a sentence.","a":"Gelegenheit, Anlass; Ereignis"}]}},{"id":"e3","title":"Past simple vs present perfect","units":[{"id":"p1","nr":"3.1","title":"Finished time or not?","core":["<b>Past simple</b> = finished action at a finished time: yesterday, last week, in 2019, ago, when I was …: I <b>went</b> to Paris <b>last year</b>.","<b>Present perfect</b> = past action connected to now, no specific time: ever, never, just, already, yet, so far, since, for: <b>Have you ever been</b> to Paris?","Question with When …? → always past simple: When <b>did</b> you <b>arrive</b>?"],"rule":"Signal words! ago / last / yesterday / in 2019 → past simple. ever / never / yet / since / for / just → present perfect.","items":[{"id":"m231","type":"choice","q":"I ___ to London last summer.","options":["went","have gone","have been"],"correct":0,"why":"last summer = finished time → past simple.","typeable":true},{"id":"m232","type":"choice","q":"___ you ever ___ sushi?","options":["Did / eat","Have / eaten","Do / eat"],"correct":1,"why":"ever → present perfect.","typeable":false},{"id":"m233","type":"choice","q":"She ___ here since 2020.","options":["lived","has lived","lives"],"correct":1,"why":"since → present perfect.","typeable":false},{"id":"m234","type":"choice","q":"When ___ you ___ your job?","options":["have / started","did / start","did / started"],"correct":1,"why":"When …? → past simple, did + infinitive.","typeable":false},{"id":"m235","type":"choice","q":"I ___ my homework yet.","options":["didn't finish","haven't finished","don't finish"],"correct":1,"why":"yet → present perfect.","typeable":false},{"id":"m236","type":"choice","q":"They ___ married two years ago.","options":["got","have got","have gotten"],"correct":0,"why":"ago → past simple.","typeable":false},{"id":"m237","type":"choice","q":"We ___ just ___ lunch.","options":["have / had","did / have","had / had"],"correct":0,"why":"just → present perfect.","typeable":false},{"id":"m238","type":"choice","q":"Shakespeare ___ many plays.","options":["has written","wrote","writes"],"correct":1,"why":"Finished life/time → past simple.","typeable":false},{"id":"i239","type":"input","q":"I ___ (see) that film three times so far.","answers":["have seen","'ve seen"],"why":"so far → present perfect.","lang":"en","loose":true},{"id":"i240","type":"input","q":"Yesterday I ___ (buy) a new phone.","answers":["bought"],"why":"yesterday → past simple.","lang":"en"},{"id":"i241","type":"input","q":"He ___ (not / call) me yet.","answers":["hasn't called","has not called"],"why":"yet → present perfect.","lang":"en","loose":true},{"id":"i242","type":"input","q":"I ___ (know) her for ten years.","answers":["have known","'ve known"],"why":"for + period until now → present perfect.","lang":"en","loose":true}]}]},{"id":"e4","title":"The …, the … + comparative","units":[{"id":"t1","nr":"4.1","title":"The more you practise, the better you become","core":["Structure: <b>The + comparative + subject + verb, the + comparative + subject + verb</b>.","If you practise more, you become better. → <b>The more</b> you practise, <b>the better</b> you become.","less for (−): The less you worry, the more you can enjoy life."],"rule":"Comparative goes right after «the»: the harder, the earlier, the more fascinated.","items":[{"id":"i243","type":"input","q":"Rewrite: <b>If the challenge is harder, the reward becomes greater.</b>","answers":["The harder the challenge is, the greater the reward becomes.","The harder the challenge, the greater the reward.","The harder the challenge is, the greater the reward.","The harder the challenge, the greater the reward becomes."],"why":"The + comparative, the + comparative.","lang":"en","loose":true},{"id":"i244","type":"input","q":"Rewrite: <b>If we leave earlier, we will arrive sooner.</b>","answers":["The earlier we leave, the sooner we will arrive.","The earlier we leave, the sooner we'll arrive."],"why":"The earlier …, the sooner …","lang":"en","loose":true},{"id":"i245","type":"input","q":"Rewrite: <b>If I learn more about history, I become more fascinated.</b>","answers":["The more I learn about history, the more fascinated I become.","The more I learn about history, the more fascinated I get."],"why":"the more fascinated (long adjective).","lang":"en","loose":true},{"id":"i246","type":"input","q":"Rewrite: <b>The weather / get / warm (+), the tourists / be / happy (+)</b>","answers":["The warmer the weather gets, the happier the tourists are.","The warmer the weather gets, the happier the tourists will be."],"why":"warm → warmer, happy → happier.","lang":"en","loose":true},{"id":"i247","type":"input","q":"Rewrite: <b>You / worry (−), you / can / enjoy life (+)</b>","answers":["The less you worry, the more you can enjoy life."],"why":"− → less.","lang":"en","loose":true},{"id":"i248","type":"input","q":"Rewrite: <b>If you wait longer, your food gets colder.</b>","answers":["The longer you wait, the colder your food gets.","The longer you wait, the colder your food becomes."],"why":"longer, colder.","lang":"en","loose":true},{"id":"o249","type":"order","q":"Put in order: <em>The more you practise, the better you become.</em>","items":["The","more","you","practise,","the","better","you","become."],"why":"the + comparative + subject + verb"}]}]},{"id":"e5","title":"Verb quiz: irregular verbs (be → catch)","units":[{"id":"v1","nr":"5.1","title":"Irregular verbs p. 165","core":["For each verb learn: infinitive – past simple – past participle – German meaning.","Also the 3rd person (he buys) and -ing form (buying, biting: e fällt weg, beginning: n verdoppelt)."],"rule":"bring – brought – brought · buy – bought – bought · catch – caught – caught (alle mit -ought/-aught!)","items":[{"id":"i250","type":"input","q":"Past simple of <b>be</b>","answers":["was/were","was, were","was were","were/was","was","were"],"why":"be – was/were – been (sein)","lang":"en"},{"id":"i251","type":"input","q":"Past participle of <b>be</b>","answers":["been"],"why":"be – was/were – been (sein)","lang":"en"},{"id":"i252","type":"input","q":"Was heisst <b>be</b> auf Deutsch?","answers":["sein"],"why":"be = sein","lang":"de"},{"id":"i253","type":"input","q":"Past simple of <b>beat</b>","answers":["beat"],"why":"beat – beat – beaten (schlagen, besiegen)","lang":"en"},{"id":"i254","type":"input","q":"Past participle of <b>beat</b>","answers":["beaten"],"why":"beat – beat – beaten (schlagen, besiegen)","lang":"en"},{"id":"i255","type":"input","q":"Was heisst <b>beat</b> auf Deutsch?","answers":["schlagen, besiegen"],"why":"beat = schlagen, besiegen","lang":"de"},{"id":"i256","type":"input","q":"Past simple of <b>become</b>","answers":["became"],"why":"become – became – become (werden)","lang":"en"},{"id":"i257","type":"input","q":"Past participle of <b>become</b>","answers":["become"],"why":"become – became – become (werden)","lang":"en"},{"id":"i258","type":"input","q":"Was heisst <b>become</b> auf Deutsch?","answers":["werden"],"why":"become = werden","lang":"de"},{"id":"i259","type":"input","q":"Past simple of <b>begin</b>","answers":["began"],"why":"begin – began – begun (beginnen)","lang":"en"},{"id":"i260","type":"input","q":"Past participle of <b>begin</b>","answers":["begun"],"why":"begin – began – begun (beginnen)","lang":"en"},{"id":"i261","type":"input","q":"Was heisst <b>begin</b> auf Deutsch?","answers":["beginnen"],"why":"begin = beginnen","lang":"de"},{"id":"i262","type":"input","q":"Past simple of <b>bite</b>","answers":["bit"],"why":"bite – bit – bitten (beissen)","lang":"en"},{"id":"i263","type":"input","q":"Past participle of <b>bite</b>","answers":["bitten"],"why":"bite – bit – bitten (beissen)","lang":"en"},{"id":"i264","type":"input","q":"Was heisst <b>bite</b> auf Deutsch?","answers":["beissen"],"why":"bite = beissen","lang":"de"},{"id":"i265","type":"input","q":"Past simple of <b>blow</b>","answers":["blew"],"why":"blow – blew –
