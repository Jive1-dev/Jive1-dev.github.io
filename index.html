die grosse Gruppe</h3>\\n    <div class=\\"tblwrap\\"><table>\\n      <tr><th>parler</th><th>Endung</th><th>donner</th></tr>\\n      <tr><td>je parl<b>e</b></td><td class=\\"num\\">-e</td><td>je donn<b>e</b></td></tr>\\n      <tr><td>tu parl<b>es</b></td><td class=\\"num\\">-es</td><td>tu donn<b>es</b></td></tr>\\n      <tr><td>il/elle parl<b>e</b></td><td class=\\"num\\">-e</td><td>il donn<b>e</b></td></tr>\\n      <tr><td>nous parl<b>ons</b></td><td class=\\"num\\">-ons</td><td>nous donn<b>ons</b></td></tr>\\n      <tr><td>vous parl<b>ez</b></td><td class=\\"num\\">-ez</td><td>vous donn<b>ez</b></td></tr>\\n      <tr><td>ils/elles parl<b>ent</b></td><td class=\\"num\\">-ent</td><td>ils donn<b>ent</b></td></tr>\\n    </table></div>\\n    <p><b>Gesprochen klingen vier Formen gleich:</b> je parle, tu parles, il parle, ils parlent. Nur <i>nous</i> und <i>vous</i> hört man. Geschrieben musst du sie aber unterscheiden — genau darauf zielt die Prüfung.</p>\\n    <p>Verben dieser Gruppe: <i>donner, manger, jouer, regarder, aider, aimer, habiter, travailler, chercher, trouver, écouter, chanter, danser, rester, arriver, tomber…</i></p>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>-ir: zwei Muster, nicht eines</h3>\\n    <p>Das ist die Stelle, an der die meisten Punkte verloren gehen.</p>\\n    <div class=\\"tblwrap\\"><table>\\n      <tr><th></th><th>finir-Typ (lang)</th><th>sortir-Typ (kurz)</th></tr>\\n      <tr><td>je</td><td>fin<b>is</b></td><td>sor<b>s</b></td></tr>\\n      <tr><td>tu</td><td>fin<b>is</b></td><td>sor<b>s</b></td></tr>\\n      <tr><td>il/elle</td><td>fin<b>it</b></td><td>sor<b>t</b></td></tr>\\n      <tr><td>nous</td><td>fin<b>issons</b></td><td>sort<b>ons</b></td></tr>\\n      <tr><td>vous</td><td>fin<b>issez</b></td><td>sort<b>ez</b></td></tr>\\n      <tr><td>ils/elles</td><td>fin<b>issent</b></td><td>sort<b>ent</b></td></tr>\\n    </table></div>\\n    <p><b>finir-Typ</b> (mit <code>-iss-</code> im Plural): réfléchir, grandir, réagir, obéir.<br>\\n       <b>sortir-Typ</b> (Stamm verliert einen Buchstaben): dormir, mentir, partir, sentir, servir.</p>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>-re: die 3. Person ist nackt</h3>\\n    <p><code>attendre</code>, <code>descendre</code>, <code>répondre</code>, <code>défendre</code>, <code>rendre</code>, <code>vendre</code>, <code>perdre</code>.</p>\\n    <p>je répond<b>s</b> · tu répond<b>s</b> · il répond<b><span style=\\"opacity:.45\\">—</span></b> · nous répond<b>ons</b> · vous répond<b>ez</b> · ils répond<b>ent</b></p>\\n    <p><b>il répond</b> — kein <i>-t</i>, kein <i>-s</i>, nichts. Der Stamm endet ja schon auf <i>d</i>.</p>\\n  </div>","items":[{"id":"u1-r0","type":"card","q":"Konjugiere <i>jouer</i> in allen sechs Formen.","a":"je joue · tu joues · il/elle joue · nous jouons · vous jouez · ils/elles jouent"},{"id":"u1-r1","type":"card","q":"Was ist der Unterschied zwischen <i>finir</i> und <i>sortir</i> im Plural?","a":"finir schiebt <b>-iss-</b> ein: nous finissons. sortir nicht: nous sortons."},{"id":"u1-r2","type":"card","q":"Wie heisst <i>attendre</i> in der 3. Person Singular?","a":"il attend — ohne jede Endung."},{"id":"u1-r3","type":"card","q":"Nenne die sechs Endungen der -er-Gruppe.","a":"-e, -es, -e, -ons, -ez, -ent"},{"id":"u1-r4","type":"card","q":"<i>Vous ne ______ (finir) pas votre dessert ?</i>","a":"Vous ne <b>finissez</b> pas votre dessert ? — vous braucht bei finir das -iss-."},{"id":"u1-v0","type":"choice","q":"<i>Nous ______ (parler) français.</i>","options":["parle","parlons","parlez","parlent"],"correct":1,"why":"nous → -ons. Immer, in allen drei Gruppen.","typeable":true},{"id":"u1-v1","type":"choice","q":"<i>Il ______ (attendre) le bus.</i>","options":["attende","attends","attend","attendt"],"correct":2,"why":"-re-Verben bekommen in der 3. Person gar keine Endung.","typeable":true},{"id":"u1-v2","type":"order","q":"Klicke die sechs Endungen der -er-Gruppe in der richtigen Reihenfolge an.","items":["-e","-es","-e","-ons","-ez","-ent"],"why":"je, tu, il, nous, vous, ils — in genau dieser Reihenfolge."},{"id":"u1-v3","type":"input","q":"<i>Vous ne ______ (finir) pas votre dessert ?</i> — nur das Verb","answers":["finissez"],"why":"finir schiebt im Plural -iss- ein: vous finissez."},{"id":"u1-t0","type":"choice","q":"<i>nous</i> bei -er-Verben?","options":["-ez","-ons","-ent"],"correct":1,"why":"nous → -ons.","typeable":true},{"id":"u1-t1","type":"choice","q":"Was macht <i>finir</i> im Plural, was <i>sortir</i> nicht macht?","options":["Akzent setzen","-iss- einschieben","den Stamm verdoppeln"],"correct":1,"why":"nous finissons vs. nous sortons.","typeable":true},{"id":"u1-s","type":"sort","q":"Welche Gruppe? Sortiere die Verben.","bins":["-ir mit -iss-","-ir ohne -iss-"],"items":[{"x":"finir","bin":0},{"x":"sortir","bin":1},{"x":"réfléchir","bin":0},{"x":"dormir","bin":1},{"x":"grandir","bin":0},{"x":"partir","bin":1},{"x":"obéir","bin":0},{"x":"servir","bin":1}],"why":"finir, réfléchir, grandir, obéir schieben -iss- ein. sortir, dormir, partir, servir nicht."}]},{"id":"u2","nr":"1.2","title":"Présent — die unregelmässigen Verben","core":["Die vier wichtigsten: <b>être, avoir, aller, faire</b>. Die musst du blind können.","<b>aller</b> ist die Grundlage vom <b>futur composé</b>, <b>être/avoir</b> die vom <b>passé composé</b>.","Häufig: <b>dire, lire, écrire, voir, venir, mettre, prendre</b> — alle mit <b>-s, -s, -t</b> im Singular.","Kleine Stammänderungen bei <b>acheter, appeler, préférer, commencer, manger, envoyer</b>."],"rule":"<b>nous</b> und <b>vous</b> sind die Braven: sie behalten fast immer den Stamm aus dem Infinitiv. Wenn sich etwas ändert, dann meistens in den anderen vier Formen.","mnemonics":["<b>SAAF</b> — <b>s</b>uis, <b>a</b>i, vais, fais: die vier Ich-Formen von être, avoir, aller, faire.","<b>Vous êtes, vous faites, vous dites</b> — die drei <i>-tes</i>-Formen. Sonst gibt es keine.","<b>Der Akzent geht dorthin, wo man ihn hört</b>: j'ach<b>è</b>te (hörbar), nous achetons (nicht hörbar, kein Akzent)."],"body":"<div class=\\"card\\">\\n    <h3>Die vier Grossen</h3>\\n    <div class=\\"tblwrap\\"><table>\\n      <tr><th></th><th>être</th><th>avoir</th><th>aller</th><th>faire</th></tr>\\n      <tr><td>je / j'</td><td>suis</td><td>ai</td><td>vais</td><td>fais</td></tr>\\n      <tr><td>tu</td><td>es</td><td>as</td><td>vas</td><td>fais</td></tr>\\n      <tr><td>il/elle</td><td>est</td><td>a</td><td>va</td><td>fait</td></tr>\\n      <tr><td>nous</td><td>sommes</td><td>avons</td><td>allons</td><td>faisons</td></tr>\\n      <tr><td>vous</td><td><b>êtes</b></td><td>avez</td><td>allez</td><td><b>faites</b></td></tr>\\n      <tr><td>ils/elles</td><td>sont</td><td>ont</td><td>vont</td><td><b>font</b></td></tr>\\n    </table></div>\\n    <p>Die fettgedruckten sind die Ausreisser: <b>vous êtes</b>, <b>vous faites</b>, <b>ils font</b> — hier fehlt das erwartete <i>-ez</i> bzw. <i>-ent</i>.</p>\\n    <p class=\\"hint\\">Merke: <i>Je suis à l'école. J'ai un portable. Je vais à la maison. Je fais les devoirs.</i> — die vier Sätze von der Folie decken alle vier Verben ab.</p>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>Die häufigen sieben</h3>\\n    <div class=\\"tblwrap\\"><table>\\n      <tr><th></th><th>dire</th><th>lire</th><th>écrire</th><th>voir</th><th>venir</th><th>mettre</th><th>prendre</th></tr>\\n      <tr><td>je</td><td>dis</td><td>lis</td><td>écris</td><td>vois</td><td>viens</td><td>mets</td><td>prends</td></tr>\\n      <tr><td>tu</td><td>dis</td><td>lis</td><td>écris</td><td>vois</td><td>viens</td><td>mets</td><td>prends</td></tr>\\n      <tr><td>il/elle</td><td>dit</td><td>lit</td><td>écrit</td><td>voit</td><td>vient</td><td>met</td><td>prend</td></tr>\\n      <tr><td>nous</td><td>disons</td><td>lisons</td><td>écrivons</td><td>voyons</td><td>venons</td><td>mettons</td><td>prenons</td></tr>\\n      <tr><td>vous</td><td><b>dites</b></td><td>lisez</td><td>écrivez</td><td>voyez</td><td>venez</td><td>mettez</td><td>prenez</td></tr>\\n      <tr><td>ils/elles</td><td>disent</td><td>lisent</td><td>écrivent</td><td>voient</td><td><b>viennent</b></td><td>mettent</td><td><b>prennent</b></td></tr>\\n    </table></div>\\n    <p>Im Singular immer <b>-s, -s, -t</b>. Aufpassen bei <b>vous dites</b> (nicht <i>disez</i>) und bei den Doppelkonsonanten in <b>viennent</b> und <b>prennent</b>.</p>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>Stammänderungen — die kleinen Fallen</h3>\\n    <div class=\\"tblwrap\\"><table>\\n      <tr><th>Verb</th><th>was passiert</th><th>Singular + ils</th><th>nous / vous</th></tr>\\n      <tr><td>acheter</td><td>Akzent <code>è</code> kommt dazu</td><td>j'ach<b>è</b>te</td><td>nous achetons</td></tr>\\n      <tr><td>appeler</td><td>Konsonant verdoppelt</td><td>j'appe<b>ll</b>e</td><td>nous appelons</td></tr>\\n      <tr><td>préférer</td><td><code>é</code> wird zu <code>è</code></td><td>je préf<b>è</b>re</td><td>nous préférons</td></tr>\\n      <tr><td>envoyer</td><td><code>y</code> wird zu <code>i</code></td><td>j'envo<b>i</b>e</td><td>nous envoyons</td></tr>\\n      <tr><td>commencer</td><td><code>ç</code> vor <code>o</code></td><td>je commence</td><td>nous commen<b>ç</b>ons</td></tr>\\n      <tr><td>manger</td><td><code>e</code> vor <code>o</code></td><td>je mange</td><td>nous mang<b>e</b>ons</td></tr>\\n    </table></div>\\n    <p>Das Muster ist immer dasselbe: <b>nous</b> und <b>vous</b> behalten den Infinitiv-Stamm, die anderen vier ändern ihn. Bei <i>commencer</i> und <i>manger</i> ist es umgekehrt — dort ändert sich nur <b>nous</b>, damit die Aussprache weich bleibt.</p>\\n  </div>","items":[{"id":"u2-r0","type":"card","q":"être, avoir, aller, faire — jeweils <i>vous</i>.","a":"vous êtes · vous avez · vous allez · vous faites"},{"id":"u2-r1","type":"card","q":"Wie heisst <i>ils</i> bei faire, être, avoir, aller?","a":"ils font · ils sont · ils ont · ils vont"},{"id":"u2-r2","type":"card","q":"<i>prendre</i> in der 3. Person Plural?","a":"ils prennent — mit doppeltem n."},{"id":"u2-r3","type":"card","q":"Warum <i>nous mangeons</i> und nicht <i>nous mangons</i>?","a":"Damit das g weich bleibt. Vor o und a braucht g ein e, c braucht ç."},{"id":"u2-r4","type":"card","q":"<i>j'achète</i> oder <i>j'achete</i>?","a":"j'ach<b>è</b>te — Akzent grave. Aber: nous achetons, ohne Akzent."},{"id":"u2-v0","type":"choice","q":"<i>Vous ______ (faire) les devoirs.</i>","options":["faisez","faites","faisiez","fez"],"correct":1,"why":"vous faites — eine der drei -tes-Formen (êtes, faites, dites).","typeable":true},{"id":"u2-v1","type":"choice","q":"Welche Form ist richtig?","options":["nous mangons","nous mangeons","nous manjons","nous mangions"],"correct":1,"why":"Vor o braucht das g ein e, damit es weich bleibt.","typeable":true},{"id":"u2-v2","type":"order","q":"Klicke die je-Formen an: être, avoir, aller, faire.","items":["suis","ai","vais","fais"],"why":"je suis · j'ai · je vais · je fais."},{"id":"u2-v3","type":"input","q":"<i>Elle ______ (préférer) le thé.</i>","answers":["préfère","prefere"],"why":"é wird zu è, weil man den Akzent hört: elle préfère."},{"id":"u2-t0","type":"choice","q":"<i>vous</i> bei faire?","options":["faisez","faites","faisiez"],"correct":1,"why":"Eine der drei -tes-Formen.","typeable":true},{"id":"u2-t1","type":"choice","q":"<i>ils</i> bei prendre?","options":["prendent","prenent","prennent"],"correct":2,"why":"Doppeltes n.","typeable":true}]},{"id":"u3","nr":"1.3","title":"Modalverben und reflexive Verben","core":["<b>vouloir</b> (wollen), <b>pouvoir</b> (können), <b>savoir</b> (können/wissen), <b>devoir</b> (müssen).","Alle vier: <b>-x, -x, -t</b> oder <b>-s, -s, -t</b> im Singular — und danach kommt der <b>Infinitiv</b>.","<b>savoir</b> = gelernt können · <b>pouvoir</b> = dürfen/die Möglichkeit haben.","Reflexive Verben tragen immer ein Pronomen mit: <b>me, te, se, nous, vous, se</b>."],"rule":"Nach einem Modalverb kommt <b>immer der Infinitiv</b>, nie eine konjugierte Form: <i>Je veux <b>aller</b></i>, nicht <i>je veux vais</i>.","mnemonics":["<b>Die x-Zwillinge</b>: je veu<b>x</b>, je peu<b>x</b>. Sonst hat kein Verb ein x.","<b>savoir = Schule</b> (gelernt), <b>pouvoir = Polizei</b> (erlaubt).","Reflexiv: <b>me – te – se – nous – vous – se</b>. Mitte und Schluss sind gleich."],"body":"<div class=\\"card\\">\\n    <h3>Die vier Modalverben</h3>\\n    <div class=\\"tblwrap\\"><table>\\n      <tr><th></th><th>vouloir</th><th>pouvoir</th><th>savoir</th><th>devoir</th></tr>\\n      <tr><td>je</td><td>veu<b>x</b></td><td>peu<b>x</b></td><td>sais</td><td>dois</td></tr>\\n      <tr><td>tu</td><td>veu<b>x</b></td><td>peu<b>x</b></td><td>sais</td><td>dois</td></tr>\\n      <tr><td>il/elle</td><td>veut</td><td>peut</td><td>sait</td><td>doit</td></tr>\\n      <tr><td>nous</td><td>voulons</td><td>pouvons</td><td>savons</td><td>devons</td></tr>\\n      <tr><td>vous</td><td>voulez</td><td>pouvez</td><td>savez</td><td>devez</td></tr>\\n      <tr><td>ils/elles</td><td>veulent</td><td>peuvent</td><td>savent</td><td>doivent</td></tr>\\n    </table></div>\\n    <p><b>vouloir</b> und <b>pouvoir</b> haben ein <b>-x</b> bei je und tu — die einzigen beiden Verben, bei denen das vorkommt.</p>\\n    <p>Nach dem Modalverb steht immer der <b>Infinitiv</b>: <i>Je veux <b>manger</b>. Tu peux <b>venir</b> ? Nous devons <b>partir</b>.</i></p>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>savoir oder pouvoir?</h3>\\n    <p><b>Je sais nager</b> — ich kann schwimmen, weil ich es gelernt habe.<br>\\n       <b>Je peux nager</b> — ich darf schwimmen / es geht gerade (das Wasser ist frei).</p>\\n    <p>Im Deutschen ist beides „können“, im Französischen nicht. In einer Lücke entscheidet der Sinn: gelernte Fähigkeit → <b>savoir</b>, Erlaubnis oder Möglichkeit → <b>pouvoir</b>.</p>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>Reflexive Verben</h3>\\n    <p>Verben wie <i>se laver</i> (sich waschen), <i>se lever</i> (aufstehen), <i>se doucher</i> (duschen), <i>se promener</i> (spazieren) haben ein zusätzliches Pronomen, das zur Person passt.</p>\\n    <div class=\\"tblwrap\\"><table>\\n      <tr><th>se laver</th><th></th><th>deutsch</th></tr>\\n      <tr><td>je <b>me</b> lave</td><td class=\\"num\\">me</td><td>ich wasche mich</td></tr>\\n      <tr><td>tu <b>te</b> laves</td><td class=\\"num\\">te</td><td>du wäschst dich</td></tr>\\n      <tr><td>il/elle/on <b>se</b> lave</td><td class=\\"num\\">se</td><td>er/sie wäscht sich</td></tr>\\n      <tr><td>nous <b>nous</b> lavons</td><td class=\\"num\\">nous</td><td>wir waschen uns</td></tr>\\n      <tr><td>vous <b>vous</b> lavez</td><td class=\\"num\\">vous</td><td>ihr wascht euch</td></tr>\\n      <tr><td>ils/elles <b>se</b> lavent</td><td class=\\"num\\">se</td><td>sie waschen sich</td></tr>\\n    </table></div>\\n    <p>Das Pronomen steht <b>vor</b> dem Verb, nie dahinter. Vor einem Vokal wird es gekürzt: <i>je m'appelle</i>, <i>il s'appelle</i>.</p>\\n    <p><b>Wichtig fürs passé composé:</b> alle reflexiven Verben nehmen <b>être</b>. Dazu mehr in 1.6.</p>\\n  </div>","items":[{"id":"u3-r0","type":"card","q":"Welche zwei Verben haben ein <b>-x</b> bei je und tu?","a":"vouloir und pouvoir: je veux, je peux."},{"id":"u3-r1","type":"card","q":"<i>Ich kann Französisch sprechen</i> — savoir oder pouvoir?","a":"<b>Je sais parler français</b> — gelernte Fähigkeit."},{"id":"u3-r2","type":"card","q":"Konjugiere <i>se lever</i> für nous und ils.","a":"nous nous levons · ils se lèvent"},{"id":"u3-r3","type":"card","q":"Wo steht das reflexive Pronomen?","a":"Immer direkt vor dem konjugierten Verb: <i>je me lave</i>."},{"id":"u3-r4","type":"card","q":"<i>ils</i> bei devoir und pouvoir?","a":"ils doivent · ils peuvent"},{"id":"u3-v0","type":"choice","q":"<i>Je ______ nager</i> — ich habe es gelernt.","options":["peux","sais","veux","dois"],"correct":1,"why":"savoir = gelernte Fähigkeit. pouvoir wäre die Erlaubnis.","typeable":true},{"id":"u3-v1","type":"choice","q":"<i>Ils ______ (pouvoir) venir.</i>","options":["peuvent","peuvons","pouvent","peuent"],"correct":0,"why":"ils peuvent — Stamm peuv- in der 3. Person Plural.","typeable":true},{"id":"u3-v2","type":"order","q":"Baue den Satz: klicke die Teile in der richtigen Reihenfolge an.","items":["Tu","te","lèves","à six heures"],"why":"Das Reflexivpronomen steht zwischen Subjekt und Verb."},{"id":"u3-v3","type":"input","q":"Wie heisst das Reflexivpronomen bei <i>nous</i>?","answers":["nous"],"why":"me – te – se – nous – vous – se."},{"id":"u3-t0","type":"choice","q":"Welche zwei Verben haben ein -x?","options":["savoir und devoir","vouloir und pouvoir","être und avoir"],"correct":1,"why":"je veux, je peux.","typeable":true},{"id":"u3-t1","type":"choice","q":"<i>Ich kann schwimmen</i> (gelernt) —","options":["je peux nager","je sais nager"],"correct":1,"why":"savoir = gelernte Fähigkeit.","typeable":true}]},{"id":"u4","nr":"1.4","title":"Futur composé","core":["Formel: <b>aller im Présent + Infinitiv</b>. Fertig.","<i>Je <b>vais</b> parler</i> = ich werde sprechen / ich gehe gleich sprechen.","Das zweite Verb bleibt <b>immer im Infinitiv</b> — es wird nie konjugiert.","Verneinung: <b>ne … pas</b> umklammert nur <b>aller</b>: <i>Je <b>ne</b> vais <b>pas</b> parler.</i>"],"rule":"Im futur composé wird <b>nur aller</b> konjugiert. Das zweite Verb bleibt so, wie es im Wörterbuch steht.","mnemonics":["<b>Gehen + Grundform</b>. „Ich gehe essen“ heisst auf Französisch genau dasselbe wie „ich werde essen“.","<b>ne … pas klammert das kleine Verb ein</b>, nie das grosse: <i>je ne vais pas manger</i>.","Zwei Verben im Satz? Dann ist das <b>zweite immer im Infinitiv</b> — beim futur composé wie beim Modalverb."],"body":"<div class=\\"card\\">\\n    <h3>Der Bauplan</h3>\\n    <p><b>Je vais</b> = konjugierte Form von <i>aller</i> · <b>parler</b> = Infinitiv → zusammen: <mark>je vais parler</mark>.</p>\\n    <p>Das ist genau wie im Deutschen „ich gehe einkaufen“ — nur dass es im Französischen die normale Art ist, über die Zukunft zu reden.</p>\\n    <div class=\\"tblwrap\\"><table>\\n      <tr><th>Person</th><th>bejaht</th><th>verneint</th></tr>\\n      <tr><td>je</td><td>je vais manger</td><td>je ne vais pas manger</td></tr>\\n      <tr><td>tu</td><td>tu vas écrire</td><td>tu ne vas pas écrire</td></tr>\\n      <tr><td>il/elle</td><td>il va répondre</td><td>il ne va pas répondre</td></tr>\\n      <tr><td>nous</td><td>nous allons sortir</td><td>nous n'allons pas sortir</td></tr>\\n      <tr><td>vous</td><td>vous allez écouter</td><td>vous n'allez pas écouter</td></tr>\\n      <tr><td>ils/elles</td><td>ils vont chercher</td><td>ils ne vont pas chercher</td></tr>\\n    </table></div>\\n    <p>Bei <b>nous</b> und <b>vous</b> wird <i>ne</i> zu <b>n'</b>, weil <i>allons</i> und <i>allez</i> mit einem Vokal beginnen.</p>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>Umformen — so machst du es in der Prüfung</h3>\\n    <p>Steht in der Aufgabe ein Satz im Présent, machst du daraus in zwei Schritten das futur composé:</p>\\n    <ol>\\n      <li><b>Verb suchen</b> und in den <b>Infinitiv</b> zurückverwandeln: <i>nous sommes</i> → <i>être</i>.</li>\\n      <li><b>aller</b> in derselben Person davorsetzen: <i>nous <b>allons</b> être</i>.</li>\\n    </ol>\\n    <p><i>Nous sommes à la maison.</i> → <mark>Nous allons être à la maison.</mark><br>\\n       <i>Vous ne finissez pas votre dessert ?</i> → <mark>Vous n'allez pas finir votre dessert ?</mark><br>\\n       <i>Tu chantes très bien.</i> → <mark>Tu vas chanter très bien.</mark></p>\\n    <p class=\\"hint\\">Der Rest des Satzes bleibt unangetastet. Nur das Verb wird ersetzt.</p>\\n  </div>","items":[{"id":"u4-r0","type":"card","q":"Aus welchen zwei Teilen besteht das futur composé?","a":"aller im Présent + Infinitiv des Hauptverbs."},{"id":"u4-r1","type":"card","q":"<i>Nous sommes à la maison</i> ins futur composé.","a":"Nous allons être à la maison."},{"id":"u4-r2","type":"card","q":"Wo stehen <i>ne</i> und <i>pas</i>?","a":"Um <b>aller</b> herum: <i>je ne vais pas manger</i>. Der Infinitiv steht ausserhalb."},{"id":"u4-r3","type":"card","q":"Warum <i>nous n'allons pas</i> und nicht <i>nous ne allons pas</i>?","a":"Vor einem Vokal wird ne zu n'."},{"id":"u4-r4","type":"card","q":"<i>Tu chantes très bien</i> ins futur composé.","a":"Tu vas chanter très bien."},{"id":"u4-v0","type":"order","q":"Baue das futur composé: <i>nous / sortir</i>.","items":["Nous","allons","sortir"],"why":"aller konjugiert + Infinitiv."},{"id":"u4-v1","type":"choice","q":"<i>Nous sommes à la maison</i> im futur composé?","options":["Nous allons sommes à la maison.","Nous allons être à la maison.","Nous vont être à la maison.","Nous allons étions à la maison."],"correct":1,"why":"Erst zurück zum Infinitiv (être), dann aller davor.","typeable":false},{"id":"u4-v2","type":"choice","q":"Wo steht <i>pas</i>?","options":["je vais pas manger","je ne vais pas manger","je ne vais manger pas","je ne pas vais manger"],"correct":1,"why":"ne … pas umklammert nur aller.","typeable":true},{"id":"u4-v3","type":"input","q":"<i>Tu chantes très bien.</i> → futur composé (ganzer Satz)","answers":["tu vas chanter très bien","tu vas chanter tres bien","tu vas chanter très bien."],"why":"Tu vas chanter très bien."},{"id":"u4-t0","type":"choice","q":"Was wird im futur composé konjugiert?","options":["beide Verben","nur aller","nur das Hauptverb"],"correct":1,"why":"Das zweite Verb bleibt Infinitiv.","typeable":true},{"id":"u4-t1","type":"choice","q":"<i>Elle prend le train</i> → futur composé","options":["elle va prend","elle va prendre","elle vas prendre"],"correct":1,"why":"aller + Infinitiv.","typeable":true}]},{"id":"u5","nr":"1.5","title":"Passé composé I — avoir und das Partizip","core":["Formel: <b>Hilfsverb im Présent + participe passé</b>. Die meisten Verben nehmen <b>avoir</b>.","Partizip bilden: <b>-er → é</b> · <b>-(d)re → u</b> · <b>-ir → i</b>.","Mit <b>avoir</b> bleibt das Partizip <b>unverändert</b> — kein e, kein s.","Verneinung: <b>ne … pas</b> umklammert das <b>Hilfsverb</b>: <i>je <b>n'</b>ai <b>pas</b> donné</i>."],"rule":"Mit <b>avoir</b> bleibt das Partizip immer gleich. Nur mit <b>être</b> passt es sich an — das ist der ganze Unterschied.","mnemonics":["<b>é – u – i</b>: <b>er</b> gibt <b>é</b>, <b>re</b> gibt <b>u</b>, <b>ir</b> gibt <b>i</b>. Drei Buchstaben, drei Gruppen.","<b>Mit avoir friert das Partizip ein.</b> Kein e, kein s, egal wer davor steht.","<b>pas</b> steht immer <b>vor dem Partizip</b>: <i>je n'ai <b>pas</b> mangé</i>, nie <i>mangé pas</i>."],"body":"<div class=\\"card\\">\\n    <h3>avoir + Partizip</h3>\\n    <div class=\\"tblwrap\\"><table>\\n      <tr><th>Person</th><th>donner</th><th>verneint</th></tr>\\n      <tr><td>j'</td><td>ai donné</td><td>je n'ai pas donné</td></tr>\\n      <tr><td>tu</td><td>as donné</td><td>tu n'as pas donné</td></tr>\\n      <tr><td>il/elle/on</td><td>a donné</td><td>il n'a pas donné</td></tr>\\n      <tr><td>nous</td><td>avons donné</td><td>nous n'avons pas donné</td></tr>\\n      <tr><td>vous</td><td>avez donné</td><td>vous n'avez pas donné</td></tr>\\n      <tr><td>ils/elles</td><td>ont donné</td><td>ils n'ont pas donné</td></tr>\\n    </table></div>\\n    <p><b>Das Partizip ändert sich nie</b>, egal ob Männlein, Weiblein oder Mehrzahl: <i>elles ont donné</i>, nicht <i>données</i>.</p>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>Die drei Grundregeln fürs Partizip</h3>\\n    <div class=\\"tblwrap\\"><table>\\n      <tr><th>Endung</th><th>wird zu</th><th>Beispiel</th></tr>\\n      <tr><td>-er</td><td class=\\"num\\">é</td><td>parler → <b>parlé</b> · acheter → <b>acheté</b></td></tr>\\n      <tr><td>-(d)re</td><td class=\\"num\\">u</td><td>attendre → <b>attendu</b> · vendre → <b>vendu</b></td></tr>\\n      <tr><td>-ir</td><td class=\\"num\\">i</td><td>finir → <b>fini</b> · dormir → <b>dormi</b> · sentir → <b>senti</b></td></tr>\\n    </table></div>\\n    <p>Beide -ir-Typen sind hier gleich: <i>finir → fini</i>, <i>partir → parti</i>. Der Unterschied aus dem Présent verschwindet.</p>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>Die Ausnahmen — auswendig</h3>\\n    <div class=\\"tblwrap\\"><table>\\n      <tr><th>Verb</th><th>Partizip</th><th>Verb</th><th>Partizip</th></tr>\\n      <tr><td>avoir</td><td><b>eu</b></td><td>boire</td><td><b>bu</b></td></tr>\\n      <tr><td>être</td><td><b>été</b></td><td>croire</td><td><b>cru</b></td></tr>\\n      <tr><td>faire</td><td><b>fait</b></td><td>lire</td><td><b>lu</b></td></tr>\\n      <tr><td>dire</td><td><b>dit</b></td><td>plaire</td><td><b>plu</b></td></tr>\\n      <tr><td>écrire</td><td><b>écrit</b></td><td>recevoir</td><td><b>reçu</b></td></tr>\\n      <tr><td>mettre</td><td><b>mis</b></td><td>voir</td><td><b>vu</b></td></tr>\\n      <tr><td>prendre</td><td><b>pris</b></td><td>venir</td><td><b>venu</b> (être!)</td></tr>\\n      <tr><td>pouvoir</td><td><b>pu</b></td><td>vouloir</td><td><b>voulu</b></td></tr>\\n      <tr><td>savoir</td><td><b>su</b></td><td>devoir</td><td><b>dû</b></td></tr>\\n      <tr><td>aller</td><td><b>allé</b> (être!)</td><td></td><td></td></tr>\\n    </table></div>\\n    <p>Sieben davon enden auf <b>-u</b>: eu, bu, cru, lu, plu, reçu, vu — dazu pu, su, voulu, dû. Die anderen sind Einzelfälle: été, fait, dit, écrit, mis, pris.</p>\\n    <p class=\\"hint\\">Merke besonders: <b>être → il a été</b>. Das Verb <i>être</i> bildet sein eigenes passé composé mit <b>avoir</b>.</p>\\n  </div>","items":[{"id":"u5-r0","type":"card","q":"Wie bildet man das passé composé?","a":"Hilfsverb (avoir oder être) im Présent + participe passé."},{"id":"u5-r1","type":"card","q":"Partizip von parler, attendre, finir?","a":"parlé · attendu · fini"},{"id":"u5-r2","type":"card","q":"Partizip von faire, prendre, mettre, écrire?","a":"fait · pris · mis · écrit"},{"id":"u5-r3","type":"card","q":"Welches Hilfsverb nimmt <i>être</i> selbst?","a":"avoir: <i>il a été</i>."},{"id":"u5-r4","type":"card","q":"<i>Elles ont donné</i> oder <i>elles ont données</i>?","a":"<b>donné</b> — mit avoir bleibt das Partizip unverändert."},{"id":"u5-v0","type":"order","q":"Ordne zu: welche Endung gibt welches Partizip? Klicke der Reihe nach -er, -re, -ir an.","items":["-er → é","-re → u","-ir → i"],"why":"é – u – i."},{"id":"u5-v1","type":"choice","q":"Partizip von <i>prendre</i>?","options":["prendu","prens","pris","prendé"],"correct":2,"why":"prendre ist unregelmässig: pris.","typeable":true},{"id":"u5-v2","type":"choice","q":"<i>Elles ont ______ (donner)</i>","options":["donné","donnée","données","donnés"],"correct":0,"why":"Mit avoir bleibt das Partizip unverändert.","typeable":true},{"id":"u5-v3","type":"input","q":"Partizip von <i>faire</i>?","answers":["fait"],"why":"j'ai fait."},{"id":"u5-v4","type":"input","q":"Partizip von <i>être</i>?","answers":["été"],"why":"il a été — mit avoir!"},{"id":"u5-t0","type":"choice","q":"Partizip von <i>vendre</i>?","options":["vendé","vendi","vendu"],"correct":2,"why":"-re gibt -u.","typeable":true},{"id":"u5-t1","type":"choice","q":"Partizip von <i>mettre</i>?","options":["mettu","mis","mété"],"correct":1,"why":"Unregelmässig: mis.","typeable":true},{"id":"u5-s","type":"sort","q":"Welches Partizip? Sortiere die Verben.","bins":["endet auf -é","endet auf -u"],"items":[{"x":"parler","bin":0},{"x":"attendre","bin":1},{"x":"manger","bin":0},{"x":"vendre","bin":1},{"x":"regarder","bin":0},{"x":"perdre","bin":1}],"why":"-er gibt -é, -(d)re gibt -u."}]},{"id":"u6","nr":"1.6","title":"Passé composé II — être und die Angleichung","core":["Nur <b>wenige</b> Verben nehmen <b>être</b>: Bewegungsverben, <b>rester</b>, <b>devenir/mourir/naître</b> und <b>alle reflexiven</b>.","Mit <b>être</b> passt sich das Partizip an: <b>+e</b> weiblich, <b>+s</b> Mehrzahl, <b>+es</b> beides.","<i>Il est sorti · Elle est sortie · Ils sont sortis · Elles sont sorties.</i>","Alle anderen Verben — auch <b>être</b> und <b>avoir</b> selbst — nehmen <b>avoir</b>."],"rule":"Mit <b>être</b> verhält sich das Partizip wie ein <b>Adjektiv</b>: es richtet sich nach dem Subjekt. Mit <b>avoir</b> tut es gar nichts.","mnemonics":["<b>Wer geht, kommt, steigt oder bleibt, nimmt être.</b> Der Rest nimmt avoir.","<b>Reflexiv = immer être.</b> Ohne Ausnahme.","<b>être macht das Partizip zum Adjektiv</b>: elle est allé<b>e</b>, wie elle est petit<b>e</b>."],"body":"<div class=\\"card\\">\\n    <h3>Das être-Haus</h3>\\n    <p>Die Verben, die <b>être</b> nehmen, beschreiben fast alle eine <b>Bewegung von A nach B</b> — man kann sie sich als Haus vorstellen, in das man hinein- und aus dem man hinausgeht.</p>\\n    <ul>\\n      <li><b>Bewegung:</b> aller, arriver, partir, venir, entrer, sortir, monter, descendre, tomber, retourner</li>\\n      <li><b>Zustandswechsel:</b> devenir (werden), mourir (sterben), naître (geboren werden)</li>\\n      <li><b>Bleiben:</b> rester — das einzige ohne Bewegung</li>\\n      <li><b>Alle reflexiven Verben:</b> je me suis levé, elle s'est douchée</li>\\n    </ul>\\n    <p class=\\"hint\\">Alles andere nimmt <b>avoir</b>. Auch <i>être</i> selbst: <b>elle a été</b> à la maison.</p>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>Die Angleichung</h3>\\n    <div class=\\"tblwrap\\"><table>\\n      <tr><th>Person</th><th>aller</th><th>Endung</th></tr>\\n      <tr><td>je (m/f)</td><td>suis allé(e)</td><td class=\\"num\\">— / e</td></tr>\\n      <tr><td>tu (m/f)</td><td>es allé(e)</td><td class=\\"num\\">— / e</td></tr>\\n      <tr><td>il / on</td><td>est all<b>é</b></td><td class=\\"num\\">—</td></tr>\\n      <tr><td>elle</td><td>est all<b>ée</b></td><td class=\\"num\\">e</td></tr>\\n      <tr><td>nous</td><td>sommes allé(e)s</td><td class=\\"num\\">s / es</td></tr>\\n      <tr><td>vous</td><td>êtes allé(e)(s)</td><td class=\\"num\\">je nach Gruppe</td></tr>\\n      <tr><td>ils</td><td>sont all<b>és</b></td><td class=\\"num\\">s</td></tr>\\n      <tr><td>elles</td><td>sont all<b>ées</b></td><td class=\\"num\\">es</td></tr>\\n    </table></div>\\n    <p>Das funktioniert genau wie bei einem Adjektiv: <i>elle est petit<b>e</b></i> — <i>elle est all<b>ée</b></i>. Gleiche Logik, gleiche Buchstaben.</p>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>Die Verneinung</h3>\\n    <p><i>Je <b>ne</b> suis <b>pas</b> allé.</i> · <i>Elle <b>n'</b>est <b>pas</b> sortie.</i> · <i>Nous <b>ne</b> nous sommes <b>pas</b> levés.</i></p>\\n    <p><b>ne … pas</b> umklammert immer das <b>Hilfsverb</b>, nie das Partizip. Bei reflexiven Verben steht das Reflexivpronomen <b>zwischen</b> ne und dem Hilfsverb.</p>\\n  </div>","items":[{"id":"u6-r0","type":"card","q":"Nenne fünf Verben, die <b>être</b> nehmen.","a":"aller, venir, sortir, partir, arriver (auch: entrer, monter, descendre, tomber, retourner, rester, devenir, mourir, naître)."},{"id":"u6-r1","type":"card","q":"<i>Elles / sortir</i> im passé composé?","a":"Elles sont sorti<b>es</b>."},{"id":"u6-r2","type":"card","q":"Welche Verbgruppe nimmt immer <b>être</b>?","a":"Alle reflexiven Verben: <i>je me suis levé</i>."},{"id":"u6-r3","type":"card","q":"Welches Hilfsverb bei <i>rester</i>?","a":"être — <i>je suis resté</i>. Das einzige être-Verb ohne Bewegung."},{"id":"u6-r4","type":"card","q":"<i>Nous / se lever</i> verneint im passé composé?","a":"Nous ne nous sommes pas levés."},{"id":"u6-v0","type":"choice","q":"Welches Verb nimmt <b>être</b>?","options":["manger","acheter","sortir","regarder"],"correct":2,"why":"sortir ist ein Bewegungsverb — être.","typeable":true},{"id":"u6-v1","type":"choice","q":"<i>Elles ______ (sortir) samedi.</i>","options":["ont sorti","sont sorti","sont sortis","sont sorties"],"correct":3,"why":"être + weiblich Mehrzahl → sorties.","typeable":true},{"id":"u6-v2","type":"choice","q":"<i>Vous ______ (être) à l'école.</i>","options":["êtes été","avez été","êtes étés","avez étés"],"correct":1,"why":"être bildet sein passé composé mit avoir: vous avez été.","typeable":true},{"id":"u6-v3","type":"order","q":"Baue: <i>je / se lever / verneint</i>.","items":["Je","ne","me","suis","pas","levé"],"why":"ne + Reflexivpronomen + Hilfsverb + pas + Partizip."},{"id":"u6-t0","type":"choice","q":"Welches nimmt <b>avoir</b>?","options":["aller","rester","manger"],"correct":2,"why":"Nur Bewegung, rester und reflexive nehmen être.","typeable":true},{"id":"u6-t1","type":"choice","q":"<i>elles / partir</i> im p.c.?","options":["sont parti","sont partis","sont parties"],"correct":2,"why":"Weiblich Mehrzahl → -es.","typeable":true},{"id":"u6-s","type":"sort","q":"avoir oder être? Sortiere die Verben.","bins":["avoir","être"],"items":[{"x":"manger","bin":0},{"x":"aller","bin":1},{"x":"faire","bin":0},{"x":"sortir","bin":1},{"x":"acheter","bin":0},{"x":"rester","bin":1},{"x":"être","bin":0},{"x":"se lever","bin":1}],"why":"Bewegung, rester und alle reflexiven nehmen être. Alles andere — auch être selbst — nimmt avoir."}]}],"exam":{"id":"e1","title":"Prüfungssimulation — les temps","minutes":15,"intro":"15 Minuten, 14 Aufgaben zu Présent, passé composé und futur composé. Kein Nachschlagen. Die offenen Aufgaben bewertest du am Schluss selbst — sei streng.","questions":[{"type":"choice","q":"<i>Nous ______ (finir) le travail.</i>","options":["finons","finissons","finissez","finions"],"correct":1,"why":"finir schiebt im Plural -iss- ein."},{"type":"choice","q":"<i>Il ______ (répondre) à la question.</i>","options":["répond","réponds","répondt","réponde"],"correct":0,"why":"-re-Verben: 3. Person ohne Endung."},{"type":"choice","q":"<i>Vous ______ (être) à la maison.</i>","options":["es","êtes","étiez","sont"],"correct":1,"why":"vous êtes."},{"type":"choice","q":"Welche Form stimmt?","options":["nous commencons","nous commençons","nous commencions","nous commencez"],"correct":1,"why":"ç vor o, damit das c weich bleibt."},{"type":"choice","q":"<i>Ils ______ (pouvoir) venir demain.</i>","options":["peuvent","pouvent","peuvons","peuent"],"correct":0,"why":"ils peuvent."},{"type":"choice","q":"<i>Nous sommes à la maison</i> — im <b>futur composé</b>?","options":["Nous allons sommes à la maison.","Nous allons être à la maison.","Nous vont être à la maison.","Nous serons à la maison."],"correct":1,"why":"aller + Infinitiv. Erst zurück zu être."},{"type":"choice","q":"Wo stehen <i>ne</i> und <i>pas</i> im futur composé?","options":["um den Infinitiv","um aller","ganz am Schluss","vor dem Subjekt"],"correct":1,"why":"Je ne vais pas manger."},{"type":"choice","q":"Partizip von <i>attendre</i>?","options":["attendé","attendi","attendu","attendé"],"correct":2,"why":"-(d)re gibt -u."},{"type":"choice","q":"Partizip von <i>prendre</i>?","options":["prendu","pris","prené","prendi"],"correct":1,"why":"Unregelmässig: pris."},{"type":"choice","q":"<i>Elles ont ______ (donner) un cadeau.</i>","options":["donné","donnée","donnés","données"],"correct":0,"why":"Mit avoir bleibt das Partizip unverändert."},{"type":"choice","q":"<i>Elle ______ (sortir) samedi.</i>","options":["a sorti","est sorti","est sortie","a sortie"],"correct":2,"why":"sortir nimmt être, weiblich Einzahl → sortie."},{"type":"choice","q":"<i>Vous ______ (être) à l'école.</i> — passé composé","options":["êtes été","avez été","êtes étés","avez étés"],"correct":1,"why":"être bildet sein p.c. mit avoir."},{"type":"open","q":"<i>Vous ne finissez pas votre dessert ?</i> — schreib den Satz im <b>passé composé</b> und im <b>futur composé</b>.","a":"p.c.: <b>Vous n'avez pas fini votre dessert ?</b> — f.c.: <b>Vous n'allez pas finir votre dessert ?</b> In beiden Fällen umklammert ne … pas das Hilfsverb bzw. aller, nie das Partizip oder den Infinitiv."},{"type":"open","q":"Erkläre in zwei Sätzen, wann ein Verb im passé composé <b>être</b> nimmt — und was dann mit dem Partizip passiert.","a":"être nehmen die Bewegungsverben (aller, venir, arriver, partir, entrer, sortir, monter, descendre, tomber, retourner), dazu rester, devenir, mourir, naître und alle reflexiven Verben. Mit être passt sich das Partizip dem Subjekt an: +e weiblich, +s Mehrzahl, +es weiblich Mehrzahl."}]}},{"id":"d2","title":"Adjectifs · pronoms · écriture","units":[{"id":"u7","nr":"2.1","title":"Adjektive — die Form","core":["Grundregel: <b>+e</b> für weiblich, <b>+s</b> für Mehrzahl, <b>+es</b> für beides.","Endet das Adjektiv schon auf <b>-e</b>, ändert sich weiblich nichts: <i>jaune → jaune</i>.","Sondergruppen: <b>-er → -ère</b> · <b>-en → -enne</b> · <b>-x → -se</b> · <b>-f → -ve</b>.","Auf <b>-s</b> endende Adjektive bleiben im Plural gleich: <i>gris → gris</i>."],"rule":"Ein Adjektiv richtet sich nach dem <b>Nomen</b>, nicht nach dir. <i>une <b>mauvaise</b> note</i> — weil <i>note</i> weiblich ist.","mnemonics":["<b>Zuerst das Nomen anschauen, dann das Adjektiv schreiben.</b> Wer umgekehrt vorgeht, rät.","<b>x wird se, f wird ve</b> — dangereu<b>x</b> → dangereu<b>se</b>, spor<b>tif</b> → spor<b>tive</b>.","<b>bon–bonne, beau–belle, nouveau–nouvelle, vieux–vieille</b>: die vier Wilden, als Reihe lernen."],"body":"<div class=\\"card\\">\\n    <h3>Die Grundregel</h3>\\n    <div class=\\"tblwrap\\"><table>\\n      <tr><th>joli</th><th>männlich</th><th>weiblich</th></tr>\\n      <tr><td>Einzahl</td><td>joli</td><td>joli<b>e</b></td></tr>\\n      <tr><td>Mehrzahl</td><td>joli<b>s</b></td><td>joli<b>es</b></td></tr>\\n    </table></div>\\n    <p>So laufen: <i>grand, petit, immédiat, intéressant, noir, suivant, vert</i>.</p>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>Die sechs Sondergruppen</h3>\\n    <div class=\\"tblwrap\\"><table>\\n      <tr><th>endet auf</th><th>m.</th><th>f.</th><th>weitere</th></tr>\\n      <tr><td><b>-e</b></td><td>jaune</td><td>jaune</td><td>difficile, facile, jeune, rapide, rouge, tranquille</td></tr>\\n      <tr><td><b>-er</b></td><td>cher</td><td>ch<b>ère</b></td><td>entier, dernier, premier, particulier</td></tr>\\n      <tr><td><b>-en</b></td><td>italien</td><td>italie<b>nne</b></td><td>ancien, indien, alsacien</td></tr>\\n      <tr><td><b>-x</b></td><td>délicieux</td><td>délicieu<b>se</b></td><td>curieux, dangereux, heureux, sérieux, ennuyeux</td></tr>\\n      <tr><td><b>-f</b></td><td>vif</td><td>vi<b>ve</b></td><td>négatif, positif, actif, sportif</td></tr>\\n      <tr><td><b>-s</b></td><td>gris</td><td>gri<b>se</b></td><td>mauvais, suédois, hongrois</td></tr>\\n    </table></div>\\n    <p><b>Achtung im Plural:</b> <i>délicieux</i> und <i>gris</i> enden schon auf s oder x — im männlichen Plural kommt <b>nichts</b> dazu: <i>les gâteaux sont délicieux</i>, <i>des pantalons gris</i>.</p>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>Die vier Unregelmässigen, die du kennen musst</h3>\\n    <div class=\\"tblwrap\\"><table>\\n      <tr><th>m.</th><th>f.</th><th>Beispiel</th></tr>\\n      <tr><td>bon</td><td><b>bonne</b></td><td>une bonne note</td></tr>\\n      <tr><td>beau</td><td><b>belle</b></td><td>un beau jardin · une belle maison</td></tr>\\n      <tr><td>nouveau</td><td><b>nouvelle</b></td><td>un nouveau livre</td></tr>\\n      <tr><td>vieux</td><td><b>vieille</b></td><td>une vieille voiture</td></tr>\\n    </table></div>\\n  </div>","items":[{"id":"u7-r0","type":"card","q":"<i>Elle a une ______ (mauvais) note.</i>","a":"une <b>mauvaise</b> note"},{"id":"u7-r1","type":"card","q":"<i>C'est une ______ (bon) élève.</i>","a":"une <b>bonne</b> élève"},{"id":"u7-r2","type":"card","q":"<i>C'est une fille ______ (sportif).</i>","a":"une fille <b>sportive</b>"},{"id":"u7-r3","type":"card","q":"<i>Les motos sont ______ (dangereux).</i>","a":"<b>dangereuses</b> — weiblich Mehrzahl."},{"id":"u7-r4","type":"card","q":"<i>C'est la ______ (dernier) fois.</i>","a":"la <b>dernière</b> fois"},{"id":"u7-v0","type":"choice","q":"<i>Elle a une ______ (mauvais) note.</i>","options":["mauvais","mauvaise","mauvaises","mauvaisse"],"correct":1,"why":"note ist weiblich → mauvaise.","typeable":true},{"id":"u7-v1","type":"choice","q":"<i>Les motos sont ______ (dangereux).</i>","options":["dangereux","dangereuse","dangereuses","dangereuxes"],"correct":2,"why":"weiblich Mehrzahl: -x wird -se, plus s.","typeable":true},{"id":"u7-v2","type":"choice","q":"<i>Le pantalon est ______ (joli).</i>","options":["joli","jolie","jolis","jolies"],"correct":0,"why":"le pantalon ist männlich Einzahl — keine Endung.","typeable":true},{"id":"u7-v3","type":"input","q":"Weibliche Form von <i>sportif</i>?","answers":["sportive"],"why":"-f wird -ve."},{"id":"u7-v4","type":"input","q":"Weibliche Form von <i>dernier</i>?","answers":["dernière","derniere"],"why":"-er wird -ère."},{"id":"u7-t0","type":"choice","q":"<i>une histoire ______ (intéressant)</i>","options":["intéressant","intéressante","intéressantes"],"correct":1,"why":"histoire ist weiblich.","typeable":true},{"id":"u7-t1","type":"choice","q":"Weiblich von <i>heureux</i>?","options":["heureuxe","heureuse","heureuve"],"correct":1,"why":"-x wird -se.","typeable":true},{"id":"u7-s","type":"sort","q":"Männlich oder weiblich? Sortiere die Formen.","bins":["masculin","féminin"],"items":[{"x":"bon","bin":0},{"x":"bonne","bin":1},{"x":"sportive","bin":1},{"x":"dernier","bin":0},{"x":"heureuse","bin":1},{"x":"vif","bin":0}],"why":"Die weibliche Form endet fast immer auf -e."}]},{"id":"u8","nr":"2.2","title":"Adjektive — die Stellung","core":["<b>Die meisten Adjektive stehen NACH dem Nomen</b> — anders als im Deutschen.","Farben und Nationalitäten stehen <b>immer nach</b>: <i>une maison blanche</i>, <i>un homme canadien</i>.","Lange Adjektive stehen nach: <i>une histoire ennuyeuse</i>.","Nur wenige kurze, häufige Adjektive stehen <b>davor</b>."],"rule":"<b>Farbe und Herkunft immer hinten.</b> Wenn du unsicher bist: hinten ist die richtigere Wette — die Liste davor ist kurz.","mnemonics":["<b>Französisch denkt von hinten.</b> Erst die Sache, dann wie sie ist: <i>un pull vert</i>.","<b>BAGS</b> geht auch auf Deutsch: <b>B</b>ewertung, <b>A</b>lter, <b>G</b>rösse, <b>S</b>tellung in der Reihe — diese vier Sorten stehen davor.","<b>Farbe und Pass bleiben hinten.</b> Kein <i>un vert pull</i>, kein <i>un canadien homme</i>."],"body":"<div class=\\"card\\">\\n    <h3>Die Grundstellung: dahinter</h3>\\n    <p>Im Deutschen sagt man „ein <b>grüner</b> Pulli“, im Französischen <i>un pull <b>vert</b></i> — das Adjektiv rutscht hinter das Nomen.</p>\\n    <ul>\\n      <li><b>Farben:</b> une veste vert<b>e</b>, une maison blanch<b>e</b></li>\\n      <li><b>Nationalitäten:</b> un homme canadien, une fille italienne</li>\\n      <li><b>Lange Adjektive:</b> une histoire intéressante, un animal dangereux</li>\\n    </ul>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>Die Ausnahmen: davor</h3>\\n    <p>Nur wenige, <b>kurze und häufige</b> Adjektive stehen vor dem Nomen. Die lernst du als Liste:</p>\\n    <div class=\\"tblwrap\\"><table>\\n      <tr><th>Gruppe</th><th>Adjektive</th></tr>\\n      <tr><td>Bewertung</td><td>bon, mauvais, joli, beau</td></tr>\\n      <tr><td>Grösse / Länge</td><td>court, long, bas, haut</td></tr>\\n      <tr><td>Ausmass</td><td>grand, petit, gros</td></tr>\\n      <tr><td>Alter</td><td>jeune, vieux, nouveau</td></tr>\\n      <tr><td>Reihenfolge</td><td>autre, dernier</td></tr>\\n    </table></div>\\n    <p><i>un <b>petit</b> chien</i> · <i>une <b>grande</b> maison</i> · <i>une <b>bonne</b> note</i> · <i>un <b>beau</b> jardin</i> · <i>la <b>dernière</b> fois</i></p>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>Zwei Adjektive im selben Satz</h3>\\n    <p>Steht eins aus der Liste und eins nicht, gehen sie auf beide Seiten: <i>une <b>petite</b> maison <b>blanche</b></i> — ein kleines weisses Haus.</p>\\n  </div>","items":[{"id":"u8-r0","type":"card","q":"Wo steht <i>vert</i>?","a":"Nach dem Nomen: <i>un pull vert</i>. Farben stehen immer hinten."},{"id":"u8-r1","type":"card","q":"Nenne fünf Adjektive, die vor dem Nomen stehen.","a":"bon, mauvais, joli, beau, grand, petit, gros, jeune, vieux, nouveau, autre, dernier, court, long…"},{"id":"u8-r2","type":"card","q":"„eine interessante Geschichte“","a":"une histoire intéressante — langes Adjektiv, also hinten."},{"id":"u8-r3","type":"card","q":"„ein kleiner Hund“","a":"un petit chien — <i>petit</i> steht in der Liste, also davor."},{"id":"u8-r4","type":"card","q":"„ein gefährliches Tier“","a":"un animal dangereux."},{"id":"u8-v0","type":"order","q":"Bring in die richtige Reihenfolge: „ein grüner Pulli“.","items":["un","pull","vert"],"why":"Farben stehen hinter dem Nomen."},{"id":"u8-v1","type":"order","q":"Bring in die richtige Reihenfolge: „ein kleiner Hund“.","items":["un","petit","chien"],"why":"petit gehört zu den wenigen Adjektiven, die davor stehen."},{"id":"u8-v2","type":"choice","q":"Wo steht <i>intéressante</i>?","options":["vor dem Nomen","nach dem Nomen"],"correct":1,"why":"Lange Adjektive stehen hinten: une histoire intéressante.","typeable":true},{"id":"u8-v3","type":"choice","q":"Welches Adjektiv steht NICHT vor dem Nomen?","options":["bon","grand","canadien","joli"],"correct":2,"why":"Nationalitäten stehen immer nach dem Nomen.","typeable":true},{"id":"u8-t0","type":"choice","q":"Wo steht die Farbe?","options":["vor dem Nomen","nach dem Nomen"],"correct":1,"why":"Immer dahinter.","typeable":true},{"id":"u8-t1","type":"choice","q":"<i>beau</i> steht …","options":["davor","dahinter"],"correct":0,"why":"Kurz und häufig → davor.","typeable":true},{"id":"u8-s","type":"sort","q":"Vor oder nach dem Nomen?","bins":["davor","dahinter"],"items":[{"x":"petit","bin":0},{"x":"vert","bin":1},{"x":"bon","bin":0},{"x":"canadien","bin":1},{"x":"beau","bin":0},{"x":"intéressant","bin":1},{"x":"grand","bin":0},{"x":"dangereux","bin":1}],"why":"Kurz und häufig davor, Farben und Nationalitäten dahinter."}]},{"id":"u9","nr":"2.3","title":"Pronomen — Subjekt und direktes Objekt","core":["Subjektpronomen: <b>je, tu, il, elle, on, nous, vous, ils, elles</b> — sie ersetzen den, der handelt.","Direkte Objektpronomen: <b>me, te, le, la, nous, vous, les</b> — sie ersetzen das, worauf die Handlung geht.","Das Objektpronomen steht <b>vor dem Verb</b>: <i>je <b>le</b> prends</i>, nicht <i>je prends le</i>.","Vor einem Vokal: <b>le/la → l'</b> — <i>je l'aime</i>."],"rule":"Im Französischen steht das Objektpronomen <b>vor</b> dem Verb — im Deutschen dahinter. Das ist der Fehler, den man am schnellsten macht und am leichtesten abstellt.","mnemonics":["<b>me – te – le/la – nous – vous – les.</b> Vier davon sehen aus wie die Artikel: le, la, les.","<b>Das Objekt drängelt sich vor.</b> Im Französischen steht es vor dem Verb, immer.","<b>Die Verbendung verrät das Subjekt</b>: <i>-ons</i> → nous, <i>-ez</i> → vous. Damit löst du jede Subjektlücke."],"body":"<div class=\\"card\\">\\n    <h3>Die zwei Reihen nebeneinander</h3>\\n    <div class=\\"tblwrap\\"><table>\\n      <tr><th>Subjekt</th><th>direktes Objekt</th><th>Beispiel</th></tr>\\n      <tr><td>je</td><td><b>me</b> (mich)</td><td>il <b>me</b> voit — er sieht mich</td></tr>\\n      <tr><td>tu</td><td><b>te</b> (dich)</td><td>je <b>te</b> vois — ich sehe dich</td></tr>\\n      <tr><td>il</td><td><b>le</b> (ihn/es)</td><td>tu <b>le</b> vois — du siehst ihn</td></tr>\\n      <tr><td>elle</td><td><b>la</b> (sie)</td><td>nous <b>la</b> voyons — wir sehen sie</td></tr>\\n      <tr><td>nous</td><td><b>nous</b> (uns)</td><td>ils <b>nous</b> voient</td></tr>\\n      <tr><td>vous</td><td><b>vous</b> (euch)</td><td>elles <b>vous</b> voient</td></tr>\\n      <tr><td>ils / elles</td><td><b>les</b> (sie, Mz.)</td><td>vous <b>les</b> voyez</td></tr>\\n    </table></div>\\n    <p><b>nous</b> und <b>vous</b> sehen in beiden Spalten gleich aus. Am Satzbau erkennst du, welches gemeint ist: was vor dem Verb <em>und</em> vor einem zweiten Pronomen steht, ist das Objekt.</p>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>Ersetzen — so gehst du vor</h3>\\n    <p><i>Tu prends <b>la voiture</b> ?</i> → das Objekt ist weiblich Einzahl → <b>la</b> → <i>Oui, je <b>la</b> prends.</i></p>\\n    <ol>\\n      <li><b>Objekt finden:</b> Was steht nach dem Verb ohne Präposition?</li>\\n      <li><b>Geschlecht und Zahl bestimmen:</b> <i>le livre</i> → männlich → <b>le</b>. <i>des maisons</i> → Mehrzahl → <b>les</b>.</li>\\n      <li><b>Vor das Verb setzen</b> — bei zwei Verben vor das, zu dem es gehört.</li>\\n    </ol>\\n    <p><i>Il a acheté un livre. Il <b>le</b> lit dans le bus.</i> · <i>La plage est belle. Nous <b>la</b> voyons depuis l'hôtel.</i></p>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>Wo genau steht das Pronomen?</h3>\\n    <p><b>Présent:</b> je <b>le</b> prends.<br>\\n       <b>Verneint:</b> je ne <b>le</b> prends pas.<br>\\n       <b>Passé composé:</b> je <b>l'</b>ai pris — vor dem <b>Hilfsverb</b>.<br>\\n       <b>Futur composé / Modalverb:</b> je vais <b>le</b> prendre · je veux <b>le</b> prendre — vor dem <b>Infinitiv</b>.</p>\\n    <p class=\\"hint\\">Faustregel: das Pronomen klebt an dem Verb, zu dem es inhaltlich gehört.</p>\\n  </div>","items":[{"id":"u9-r0","type":"card","q":"<i>Tu prends la voiture ? Oui, je ____ prends.</i>","a":"<b>la</b> — la voiture ist weiblich Einzahl."},{"id":"u9-r1","type":"card","q":"<i>Il a acheté un livre. Il ____ lit dans le bus.</i>","a":"<b>le</b> — un livre ist männlich."},{"id":"u9-r2","type":"card","q":"<i>Nous avons construit des maisons. Nous ____ avons construites.</i>","a":"<b>les</b> — Mehrzahl."},{"id":"u9-r3","type":"card","q":"Wo steht das Objektpronomen im passé composé?","a":"Vor dem Hilfsverb: <i>je l'ai pris</i>."},{"id":"u9-r4","type":"card","q":"<i>____ (Sandra et Claudia) regardent un film.</i>","a":"<b>Elles</b> — zwei weibliche Personen."},{"id":"u9-v0","type":"choice","q":"<i>Tu prends la voiture ? Oui, je ____ prends.</i>","options":["le","la","les","lui"],"correct":1,"why":"la voiture — weiblich Einzahl.","typeable":true},{"id":"u9-v1","type":"choice","q":"<i>Il a acheté un livre. Il ____ lit dans le bus.</i>","options":["la","les","le","lui"],"correct":2,"why":"un livre — männlich Einzahl.","typeable":true},{"id":"u9-v2","type":"order","q":"Baue den Satz: <i>Nous / les / avons / construites</i>.","items":["Nous","les","avons","construites"],"why":"Das Pronomen steht vor dem Hilfsverb."},{"id":"u9-v3","type":"input","q":"<i>______ (Sandra et Claudia) regardent un film.</i>","answers":["elles"],"why":"Zwei weibliche Personen → elles."},{"id":"u9-v4","type":"input","q":"<i>______ aimons tout le monde.</i>","answers":["nous"],"why":"Die Endung -ons verrät nous."},{"id":"u9-t0","type":"choice","q":"Welches Pronomen ersetzt <i>les maisons</i>?","options":["la","le","les"],"correct":2,"why":"Mehrzahl → les.","typeable":true},{"id":"u9-t1","type":"choice","q":"Wo steht das Objektpronomen?","options":["vor dem Verb","nach dem Verb"],"correct":0,"why":"Immer davor.","typeable":true},{"id":"u9-s","type":"sort","q":"Subjekt oder Objekt? Sortiere die Pronomen.","bins":["Subjektpronomen","Objektpronomen"],"items":[{"x":"je","bin":0},{"x":"me","bin":1},{"x":"il","bin":0},{"x":"le","bin":1},{"x":"elles","bin":0},{"x":"les","bin":1},{"x":"tu","bin":0},{"x":"te","bin":1}],"why":"me, te, le, la, les stehen vor dem Verb und ersetzen das Objekt."}]},{"id":"u10","nr":"2.4","title":"Wortschatz und production écrite","core":["94 Verben aus vier Quizlet-Sets: <b>51 × -er</b>, <b>15 × -ir</b>, <b>12 × -dre</b>, <b>16 unregelmässig</b>.","Die Gruppe verrät dir die Konjugation <b>und</b> das Partizip — lerne beides zusammen.","Production écrite: <b>5 Sätze zum Bild</b>, 10 Punkte. Einfach und richtig schlägt kompliziert und falsch.","Bau in die 5 Sätze bewusst <b>alles ein, was geprüft wird</b>: Zeiten, Adjektiv, Pronomen."],"rule":"In der production écrite zählt <b>Korrektheit</b>, nicht Länge. Fünf einfache, fehlerfreie Sätze holen mehr Punkte als fünf komplizierte mit Fehlern.","mnemonics":["<b>Verb, Bedeutung, Partizip — immer als Dreierpack lernen.</b> Getrennt gelernt vergisst du zwei davon.","<b>Il y a</b> und <b>je vois</b> sind unkaputtbar. Damit fängt jede Bildbeschreibung an.","<b>Fünf einfache Sätze, in denen alles drin ist, was geprüft wird.</b> Das ist die volle Punktzahl, nicht der schöne Text."],"body":"<div class=\\"card\\">\\n    <h3>Wie du die Verben lernst</h3>\\n    <p>Lern jedes Verb nicht als Wort, sondern als <b>Dreier-Paket</b>:</p>\\n    <p><b>parler — sprechen — j'ai parlé</b> · <b>attendre — warten — j'ai attendu</b> · <b>sortir — hinausgehen — je suis sorti</b></p>\\n    <p>Damit hast du Bedeutung, Gruppe und Partizip in einem. Genau das braucht die Prüfung.</p>\\n    <p class=\\"hint\\">Im Glossar unten rechts findest du alle 94 Verben mit Übersetzung. Die <b>Paarjagd</b> im Spielbereich fragt sie dich in zufälliger Reihenfolge ab.</p>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>Die vier Sets im Überblick</h3>\\n    <div class=\\"tblwrap\\"><table>\\n      <tr><th>Set</th><th>Anzahl</th><th>Konjugation</th><th>Partizip</th></tr>\\n      <tr><td>-er</td><td class=\\"num\\">51</td><td>e, es, e, ons, ez, ent</td><td>-é</td></tr>\\n      <tr><td>-ir</td><td class=\\"num\\">15</td><td>zwei Muster (finir / sortir)</td><td>-i</td></tr>\\n      <tr><td>-dre</td><td class=\\"num\\">12</td><td>s, s, —, ons, ez, ent</td><td>-u</td></tr>\\n      <tr><td>irregulär</td><td class=\\"num\\">16</td><td>einzeln lernen</td><td>einzeln lernen</td></tr>\\n    </table></div>\\n    <p>Ein paar Verben in Set 2 und 3 fallen aus dem Muster: <i>ouvrir, couvrir, découvrir, offrir</i> gehen wie <b>-er</b>-Verben (<i>j'ouvre</i>, Partizip <b>ouvert</b>), und <i>peindre, craindre, éteindre</i> sind eigene Fälle (<i>je peins</i>, Partizip <b>peint</b>).</p>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>Production écrite — fünf Sätze, die Punkte holen</h3>\\n    <p>Du sollst ein Bild beschreiben. Halte dich an ein festes Gerüst, dann vergisst du nichts:</p>\\n    <ol>\\n      <li><b>Was man sieht:</b> <i>Sur l'image, je vois …</i> / <i>Il y a …</i></li>\\n      <li><b>Wo:</b> <i>Les personnes sont dans un parc / à la maison / dans la rue.</i></li>\\n      <li><b>Was gerade passiert (Présent):</b> <i>Un homme lit un journal et une femme parle au téléphone.</i></li>\\n      <li><b>Ein Adjektiv einbauen:</b> <i>Le jardin est très beau</i> / <i>C'est une belle journée.</i></li>\\n      <li><b>Eine zweite Zeit einbauen:</b> <i>Je pense qu'ils <b>vont manger</b> ensemble</i> (futur composé) oder <i>ils <b>ont fini</b> leur travail</i> (passé composé).</li>\\n    </ol>\\n    <p><b>Sicher punkten:</b> kurze Hauptsätze, Verben, die du sicher konjugieren kannst, ein Adjektiv mit korrekter Endung, ein Objektpronomen. <i>Il y a</i> und <i>je vois</i> sind unkaputtbar.</p>\\n    <p class=\\"hint\\">Nicht versuchen, schön zu schreiben. Versuche, <b>fehlerfrei</b> zu schreiben. Zehn Punkte gibt es für Korrektheit, nicht für Poesie.</p>\\n  </div>\\n  <div class=\\"card\\">\\n    <h3>Bausteine zum Auswendiglernen</h3>\\n    <div class=\\"tblwrap\\"><table>\\n      <tr><th>französisch</th><th>deutsch</th></tr>\\n      <tr><td>Sur l'image, il y a …</td><td>Auf dem Bild gibt es …</td></tr>\\n      <tr><td>Je vois … / On voit …</td><td>Ich sehe … / Man sieht …</td></tr>\\n      <tr><td>À gauche / à droite / au milieu</td><td>links / rechts / in der Mitte</td></tr>\\n      <tr><td>Au premier plan / à l'arrière-plan</td><td>im Vordergrund / im Hintergrund</td></tr>\\n      <tr><td>Les gens ont l'air content<b>s</b>.</td><td>Die Leute wirken zufrieden.</td></tr>\\n      <tr><td>Je pense que …</td><td>Ich denke, dass …</td></tr>\\n      <tr><td>Il fait beau / il fait froid.</td><td>Das Wetter ist schön / es ist kalt.</td></tr>\\n    </table></div>\\n  </div>","items":[{"id":"u10-r0","type":"card","q":"Partizip von <i>attendre</i>, <i>finir</i>, <i>manger</i>?","a":"attendu · fini · mangé"},{"id":"u10-r1","type":"card","q":"Was heisst <i>réfléchir</i>, <i>obéir</i>, <i>rendre</i>?","a":"nachdenken · gehorchen · zurückgeben"},{"id":"u10-r2","type":"card","q":"Wie fängst du eine Bildbeschreibung an?","a":"<i>Sur l'image, il y a …</i> oder <i>Je vois …</i>"},{"id":"u10-r3","type":"card","q":"Welche vier Sachen baust du bewusst in die 5 Sätze ein?","a":"Présent, eine zweite Zeit (p.c. oder f.c.), ein Adjektiv mit richtiger Endung, ein Objektpronomen."},{"id":"u10-r4","type":"card","q":"Was heisst <i>éteindre</i> und wie ist das Partizip?","a":"ausschalten — <i>j'ai éteint</i>."},{"id":"u10-v0","type":"choice","q":"Was heisst <i>réfléchir</i>?","options":["reagieren","nachdenken","reparieren","zurückgeben"],"correct":1,"why":"réfléchir = nachdenken, überlegen.","typeable":true},{"id":"u10-v1","type":"choice","q":"Partizip von <i>ouvrir</i>?","options":["ouvri","ouvru","ouvert","ouvré"],"correct":2,"why":"ouvrir, couvrir, découvrir, offrir enden auf -ert.","typeable":true},{"id":"u10-v2","type":"order","q":"Klicke die vier Bausteine einer guten Bildbeschreibung in sinnvoller Reihenfolge an.","items":["Sur l'image, je vois …","Les personnes sont dans …","Un homme lit un journal.","Je pense qu'ils vont manger."],"why":"Was — wo — was passiert — was du vermutest."},{"id":"u10-v3","type":"input","q":"Wie heisst <i>éteindre</i> auf Deutsch?","answers":["ausschalten","abschalten","ausmachen"],"why":"éteindre = ausschalten, Partizip éteint."}]}],"exam":{"id":"e2","title":"Prüfungssimulation — adjectifs, pronoms, écriture","minutes":18,"intro":"18 Minuten, 14 Aufgaben. Die letzten beiden sind offene Schreibaufgaben — genau wie die production écrite in der Prüfung.","questions":[{"type":"choice","q":"<i>Elle a une ______ (mauvais) note.</i>","options":["mauvais","mauvaise","mauvaises","mauvaix"],"correct":1,"why":"note ist weiblich."},{"type":"choice","q":"<i>Le pantalon est ______ (joli).</i>","options":["joli","jolie","jolis","jolies"],"correct":0,"why":"pantalon ist männlich Einzahl."},{"type":"choice","q":"<i>Tu vois la fille avec la robe ______ (noir).</i>","options":["noir","noire","noirs","noires"],"correct":1,"why":"robe ist weiblich Einzahl."},{"type":"choice","q":"<i>Ce sont mes correspondantes ______ (français).</i>","options":["français","française","françaises","françaisses"],"correct":2,"why":"weiblich Mehrzahl."},{"type":"choice","q":"<i>C'est une fille ______ (sportif).</i>","options":["sportif","sportive","sportifs","sportives"],"correct":1,"why":"-f wird -ve."},{"type":"choice","q":"<i>Les motos sont ______ (dangereux).</i>","options":["dangereux","dangereuse","dangereuses","dangereuxes"],"correct":2,"why":"-x wird -se, plus s für Mehrzahl."},{"type":"choice","q":"Welches Adjektiv steht <b>vor</b> dem Nomen?","options":["vert","canadien","petit","intéressant"],"correct":2,"why":"Kurz und häufig — petit steht in der Liste."},{"type":"choice","q":"„eine grüne Jacke“","options":["une verte veste","une veste verte","un veste vert","une veste vert"],"correct":1,"why":"Farbe hinten, weibliche Endung."},{"type":"choice","q":"<i>______ (Sandra et Claudia) regardent un film.</i>","options":["Ils","Elles","Elle","On"],"correct":1,"why":"Zwei weibliche Personen."},{"type":"choice","q":"<i>______ entrez dans le square.</i>","options":["Nous","Vous","Ils","Tu"],"correct":1,"why":"Die Endung -ez gehört zu vous."},{"type":"choice","q":"<i>Tu prends la voiture ? Oui, je ______ prends.</i>","options":["le","la","les","lui"],"correct":1,"why":"la voiture — weiblich Einzahl."},{"type":"choice","q":"<i>Il a acheté un livre. Il ______ lit dans le bus.</i>","options":["la","le","les","lui"],"correct":1,"why":"un livre — männlich Einzahl."},{"type":"open","q":"Ersetze das Objekt durch das Pronomen: <i>La plage est très belle. Nous voyons la plage depuis notre hôtel.</i>","a":"<b>Nous la voyons depuis notre hôtel.</b> — la plage ist weiblich Einzahl, das Pronomen steht vor dem konjugierten Verb."},{"type":"open","q":"Schreib fünf Sätze zu diesem Bild: <b>zwei Jugendliche sitzen auf einer Bank vor der Schule, es regnet, einer schaut aufs Handy.</b> Baue ein: ein Adjektiv, ein Objektpronomen und eine zweite Zeit (p.c. oder f.c.).","a":"Zum Beispiel: <i>Sur l'image, je vois deux jeunes devant l'école. Ils sont assis sur un banc. Il pleut et le ciel est <b>gris</b>. Un garçon regarde son portable ; il <b>le</b> tient dans la main. Je pense qu'ils <b>vont entrer</b> dans l'école.</i> — Fünf einfache Hauptsätze, alle drei Pflichtelemente drin, kein unnötiges Risiko."}]}},{"id":"pf","title":"Prüfungsformat (examen d’exercice)","units":[{"id":"pf1","nr":"3.1","title":"Sätze umformen: présent → passé composé → futur composé","core":["Genau so kommt es an der Prüfung: <b>Lücke im Présent</b> füllen, dann den <b>ganzen Satz</b> ins passé composé und ins futur composé setzen.","<b>passé composé</b> = avoir/être im Présent + Partizip. Bewegungsverben (aller, venir, partir, sortir, arriver, rester …) nehmen <b>être</b> → Partizip angleichen.","<b>futur composé</b> = aller im Présent + Infinitiv: <i>Nous allons être à la maison.</i>","<b>ne … pas</b> umklammert immer das konjugierte Verb: <i>Vous <b>n’</b>avez <b>pas</b> fini</i> · <i>Vous <b>n’</b>allez <b>pas</b> finir</i>."],"rule":"Zuerst die Présent-Form suchen, dann nur das Hilfsverb bzw. aller verneinen – nie das Partizip oder den Infinitiv.","items":[{"id":"i1","type":"input","q":"Nous ______ (être) à la maison. <small>Présent</small>","answers":["sommes"],"why":"être: je suis, tu es, il est, nous sommes, vous êtes, ils sont","lang":"fr"},{"id":"i2","type":"input","q":"Vous ne ______ (beenden = finir) pas votre dessert ? <small>Présent</small>","answers":["finissez"],"why":"finir schiebt im Plural -iss- ein: vous finissez.","lang":"fr"},{"id":"i3","type":"input","q":"Elle dit : « Tu ______ (chanter) très bien ? » <small>Présent</small>","answers":["chantes"],"why":"-er: tu -es → tu chantes.","lang":"fr"}]},{"id":"pf2","nr":"3.2","title":"Adjektive und Pronomen wie an der Prüfung","core":["Adjektiv an Nomen <b>angleichen</b>: weiblich +e, Mehrzahl +s. Sonderformen: bon → bonne, dernier → dernière, sportif → sportive, dangereux → dangereuse.","Subjektpronomen: je, tu, il, elle, nous, vous, ils, elles. Zwei Frauen = <b>elles</b>, sonst gemischt = <b>ils</b>.","Direktes Objekt: le (ihn/es), la (sie), les (sie Mz.), vor Vokal l’. Steht <b>vor</b> dem konjugierten Verb: <i>je la prends</i>."],"rule":"Pronomen-Objekt vor das Verb, im passé composé vor das Hilfsverb: nous les avons construites.","items":[{"id":"i4","type":"input","q":"Elle a une ______ (mauvais) note.","answers":["mauvaise"],"why":"note ist weiblich → mauvaise. mauvais steht vor dem Nomen.","lang":"fr"},{"id":"i5","type":"input","q":"Le pantalon est ______ (joli).","answers":["joli"],"why":"le pantalon ist männlich Einzahl → joli bleibt.","lang":"fr"},{"id":"i6","type":"input","q":"Tu vois la fille avec la robe ______ (noir) ?","answers":["noire"],"why":"la robe ist weiblich → noire. Farben stehen nach dem Nomen.","lang":"fr"},{"id":"i7","type":"input","q":"Ce sont mes correspondantes ______ (français).","answers":["françaises"],"why":"weiblich Mehrzahl → françaises.","lang":"fr"},{"id":"i8","type":"input","q":"C’est une ______ (bon) élève.","answers":["bonne"],"why":"bon → bonne (n verdoppeln).","lang":"fr"},{"id":"i9","type":"input","q":"C’est la ______ (dernier) fois que je t’appelle.","answers":["dernière"],"why":"-er → -ère: dernière.","lang":"fr"},{"id":"i10","type":"input","q":"C’est une fille ______ (sportif).","answers":["sportive"],"why":"-f → -ve: sportive.","lang":"fr"},{"id":"i11","type":"input","q":"Les motos sont ______ (dangereux).","answers":["dangereuses"],"why":"-eux → -euse, Mehrzahl → dangereuses.","lang":"fr"},{"id":"i12","type":"input","q":"Un ______ (beau) jardin et une ______ (beau) maison – schreib beide Formen mit Komma.","answers":["beau, belle"],"why":"beau → belle (weiblich), beaux (Mz.).","lang":"fr","loose":true},{"id":"i13","type":"input","q":"______ (Sandra et Claudia) regardent un film.","answers":["Elles"],"why":"Zwei Frauen → elles.","lang":"fr"},{"id":"i14","type":"input","q":"______ (Marc) veut aller en ville.","answers":["Il"],"why":"Marc → il.","lang":"fr"},{"id":"i15","type":"input","q":"______ aimons tout le monde.","answers":["Nous"],"why":"Endung -ons → nous.","lang":"fr"},{"id":"i16","type":"input","q":"______ entrez dans le square.","answers":["Vous"],"why":"Endung -ez → vous.","lang":"fr"},{"id":"i17","type":"input","q":"Toi, ______ vas jamais au cinéma ?","answers":["tu"],"why":"toi → tu vas.","lang":"fr"},{"id":"i18","type":"input","q":"Tu prends la voiture ? – Oui, je ______ prends.","answers":["la"],"why":"la voiture (weiblich) → la.","lang":"fr"},{"id":"i19","type":"input","q":"Il a acheté un livre. Il ______ lit dans le bus.","answers":["le"],"why":"un livre (männlich) → le.","lang":"fr"},{"id":"i20","type":"input","q":"On a construit des maisons ? – Nous ______ avons construites en Floride.","answers":["les"],"why":"des maisons (Mehrzahl) → les.","lang":"fr"},{"id":"i21","type":"input","q":"La plage est très belle. Nous ______ voyons depuis notre hôtel.","answers":["la"],"why":"la plage → la.","lang":"fr"},{"id":"i22","type":"input","q":"Tu vois Marc ? – Oui, je ______ vois.","answers":["le"],"why":"Marc → le (ihn).","lang":"fr"},{"id":"i23","type":"input","q":"Tu écoutes la radio ? – Oui, je ______ écoute.","answers":["l'"],"why":"la vor Vokal → l’.","lang":"fr"},{"id":"i24","type":"input","q":"Il me voit ? – Oui, il ______ voit.","answers":["te"],"why":"me (mich) → te (dich) in der Antwort.","lang":"fr"},{"id":"i25","type":"input","q":"Vous nous invitez ? – Oui, nous ______ invitons.","answers":["vous"],"why":"nous (uns) → vous (euch) in der Antwort.","lang":"fr"}]},{"id":"pf3","nr":"3.3","title":"Production écrite: ein Bild beschreiben (5 Sätze)","core":["5 Sätze, 10 Punkte: einfach, aber <b>fehlerfrei</b> schreiben lohnt sich mehr als lange Sätze.","Bausteine: <i>Sur l’image, il y a …</i> · <i>À gauche / À droite / Au milieu …</i> · <i>Au premier plan / À l’arrière-plan …</i>","Verben, die du sicher kannst: être, avoir, faire, aller, porter, regarder, jouer, manger, parler.","Adjektive angleichen (une femme <b>contente</b>) und Farben nach dem Nomen (un pull <b>vert</b>)."],"rule":"Pro Satz: Subjekt + konjugiertes Verb + Ergänzung. Ein Adjektiv pro Satz bringt Stil.","items":[{"id":"c26","type":"card","q":"Nenne 4 Satzanfänge, um ein Bild zu beschreiben.","a":"Sur l’image, il y a … · À gauche, … · À droite, … · Au premier plan / À l’arrière-plan, …"},{"id":"c27","type":"card","q":"Schreib einen Beispielsatz mit Farbe und Personenbeschreibung.","a":"À droite, il y a une jeune femme. Elle porte une robe rouge et elle est contente."},{"id":"c28","type":"card","q":"Wie sagt man «Es ist schönes Wetter» und «Die Kinder spielen Fussball»?","a":"Il fait beau. · Les enfants jouent au foot."},{"id":"o29","type":"order","q":"Baue den Satz: <em>Auf dem Bild gibt es zwei Kinder.</em>","items":["Sur","l’image,","il","y","a","deux","enfants."],"why":"il y a = es gibt."},{"id":"o30","type":"order","q":"Baue den Satz: <em>Links trägt ein Mann einen grünen Pulli.</em>","items":["À","gauche,","un","homme","porte","un","pull","vert."],"why":"Farbe nach dem Nomen: un pull vert."}]}],"exam":{"id":"pf-exam","title":"examen d’exercice","minutes":45,"intro":"Die Übungsprüfung deiner Lehrerin: Zeiten, Adjektive, Pronomen, Schreiben.","questions":[{"type":"open","q":"Nous ______ (être) à la maison. → Présent, dann passé composé und futur composé.","a":"sommes · p.c.: Nous avons été à la maison. · f.c.: Nous allons être à la maison."},{"type":"open","q":"Vous ne ______ (beenden) pas votre dessert ? → Présent, p.c., f.c.","a":"finissez · p.c.: Vous n’avez pas fini votre dessert ? · f.c.: Vous n’allez pas finir votre dessert ?"},{"type":"open","q":"Elle dit : « Tu ______ (chanter) très bien ? » → Présent, p.c., f.c.","a":"chantes · p.c.: Tu as chanté très bien ? · f.c.: Tu vas chanter très bien ?"},{"type":"choice","q":"C’est une ______ (bon) élève.","options":["bon","bonne","bone","bons"],"correct":1,"why":"bon → bonne."},{"type":"choice","q":"Les motos sont ______ (dangereux).","options":["dangereux","dangereuse","dangereuses","dangereuxes"],"correct":2,"why":"weiblich Mehrzahl → dangereuses."},{"type":"choice","q":"Tu vois la fille avec la robe ______ (noir).","options":["noir","noire","noires","noirs"],"correct":1,"why":"la robe → noire."},{"type":"choice","q":"______ (Sandra et Claudia) regardent un film.","options":["Ils","Elles","Nous","Elle"],"correct":1,"why":"zwei Frauen → elles."},{"type":"choice","q":"On a construit des maisons ? Nous ______ avons construites en Floride.","options":["la","le","les","leur"],"correct":2,"why":"des maisons → les."},{"type":"choice","q":"Il a acheté un livre. Il ______ lit dans le bus.","options":["la","le","les","lui"],"correct":1,"why":"un livre → le."},{"type":"open","q":"Production écrite: Beschreibe ein Bild in 5 Sätzen (z. B. einen Markt, eine Familie im Park).","a":"Beispiel: Sur l’image, il y a une famille dans un parc. Au premier plan, deux enfants jouent au foot. À gauche, la mère lit un livre. Le père porte un pull vert. Il fait beau et tout le monde est content."}]}},{"id":"voc","title":"Wortschatz — Verben","units":[]}]`),ld=[{term:"Présent",text:"Die Gegenwartsform. Drei regelmässige Gruppen (-er, -ir, -re) plus die unregelmässigen Verben."},{term:"Passé composé",text:"Die Vergangenheit: Hilfsverb (avoir oder être) im Présent + participe passé. <i>J'ai parlé · je suis allé.</i>"},{term:"Futur composé",text:"Die Zukunft: <i>aller</i> im Présent + Infinitiv. <i>Je vais parler.</i>"},{term:"Participe passé",text:"Die Partizipform: -er → é, -(d)re → u, -ir → i. Dazu rund 20 unregelmässige."},{term:"Hilfsverb",text:"<i>avoir</i> oder <i>être</i> — das konjugierte Verb im passé composé. Die meisten Verben nehmen avoir."},{term:"Infinitif",text:"Die Grundform, wie sie im Wörterbuch steht: <i>parler, finir, attendre</i>."},{term:"Adjectif",text:"Beschreibt ein Nomen und richtet sich nach ihm: +e weiblich, +s Mehrzahl, +es beides."},{term:"Accord",text:"Die Angleichung: das Adjektiv — und mit <i>être</i> auch das Partizip — passt sich Geschlecht und Zahl an."},{term:"Pronom sujet",text:"je, tu, il, elle, on, nous, vous, ils, elles — sie ersetzen den, der handelt."},{term:"Pronom objet direct",text:"me, te, le, la, nous, vous, les — sie ersetzen das Objekt und stehen <b>vor</b> dem Verb."},{term:"Verbe réfléchi",text:"Reflexives Verb mit me/te/se/nous/vous/se. Im passé composé immer mit <b>être</b>."},{term:"Modalverb",text:"vouloir, pouvoir, savoir, devoir — danach folgt immer der Infinitiv."},{term:"Négation",text:"<b>ne … pas</b> umklammert das konjugierte Verb, nie das Partizip oder den Infinitiv."},{term:"Das être-Haus",text:"aller, arriver, partir, venir, entrer, sortir, monter, descendre, tomber, retourner + rester, devenir, mourir, naître + alle reflexiven."},{term:"Production écrite",text:"Der Schreibteil: fünf Sätze zu einem Bild, 10 Punkte. Korrektheit zählt mehr als Länge."},{term:"Élision",text:"Vor einem Vokal fallen Buchstaben weg: <i>je → j'</i>, <i>ne → n'</i>, <i>le/la → l'</i>."},{term:"Groupe -er",text:"Die grösste Gruppe, 51 der 94 Verben. Endungen e, es, e, ons, ez, ent. Partizip auf -é."},{term:"Groupe -ir",text:"Zwei Muster: <i>finir</i> mit -iss- im Plural, <i>sortir</i> ohne. Partizip auf -i."},{term:"Groupe -dre",text:"Endungen s, s, —, ons, ez, ent. In der 3. Person Singular gar keine Endung. Partizip auf -u."},{term:"parler",text:"<b>sprechen</b> · Gruppe -er · p.c. j'ai parlé"},{term:"donner",text:"<b>geben</b> · Gruppe -er · p.c. j'ai donné"},{term:"manger",text:"<b>essen</b> · Gruppe -er · p.c. j'ai mangé"},{term:"jouer",text:"<b>spielen</b> · Gruppe -er · p.c. j'ai joué"},{term:"regarder",text:"<b>schauen</b> · Gruppe -er · p.c. j'ai regardé"},{term:"entrer",text:"<b>betreten, hereinkommen</b> · Gruppe -er · p.c. je suis entré"},{term:"aider",text:"<b>helfen</b> · Gruppe -er · p.c. j'ai aidé"},{term:"penser",text:"<b>denken</b> · Gruppe -er · p.c. j'ai pensé"},{term:"tomber",text:"<b>(hin)fallen</b> · Gruppe -er · p.c. je suis tombé"},{term:"cuisiner",text:"<b>kochen</b> · Gruppe -er · p.c. j'ai cuisiné"},{term:"commander",text:"<b>bestellen</b> · Gruppe -er · p.c. j'ai commandé"},{term:"commencer",text:"<b>anfangen</b> · Gruppe -er · p.c. j'ai commencé"},{term:"réparer",text:"<b>reparieren</b> · Gruppe -er · p.c. j'ai réparé"},{term:"rester",text:"<b>bleiben</b> · Gruppe -er · p.c. je suis resté"},{term:"écouter",text:"<b>hören</b> · Gruppe -er · p.c. j'ai écouté"},{term:"répéter",text:"<b>repetieren</b> · Gruppe -er · p.c. j'ai répété"},{term:"fermer",text:"<b>schliessen</b> · Gruppe -er · p.c. j'ai fermé"},{term:"danser",text:"<b>tanzen</b> · Gruppe -er · p.c. j'ai dansé"},{term:"aimer",text:"<b>lieben</b> · Gruppe -er · p.c. j'ai aimé"},{term:"adorer",text:"<b>lieben, vergöttern</b> · Gruppe -er · p.c. j'ai adoré"},{term:"porter",text:"<b>tragen</b> · Gruppe -er · p.c. j'ai porté"},{term:"téléphoner",text:"<b>telefonieren</b> · Gruppe -er · p.c. j'ai téléphoné"},{term:"habiter",text:"<b>wohnen</b> · Gruppe -er · p.c. j'ai habité"},{term:"couper",text:"<b>schneiden</b> · Gruppe -er · p.c. j'ai coupé"},{term:"monter",text:"<b>hinaufsteigen</b> · Gruppe -er · p.c. je suis monté"},{term:"étudier",text:"<b>lernen</b> · Gruppe -er · p.c. j'ai étudié"},{term:"chanter",text:"<b>singen</b> · Gruppe -er · p.c. j'ai chanté"},{term:"arriver",text:"<b>ankommen</b> · Gruppe -er · p.c. je suis arrivé"},{term:"casser",text:"<b>kaputt machen</b> · Gruppe -er · p.c. j'ai cassé"},{term:"travailler",text:"<b>arbeiten</b> · Gruppe -er · p.c. j'ai travaillé"},{term:"pleurer",text:"<b>weinen</b> · Gruppe -er · p.c. j'ai pleuré"},{term:"changer",text:"<b>wechseln</b> · Gruppe -er · p.c. j'ai changé"},{term:"crier",text:"<b>schreien</b> · Gruppe -er · p.c. j'ai crié"},{term:"pousser",text:"<b>stossen</b> · Gruppe -er · p.c. j'ai poussé"},{term:"marcher",text:"<b>gehen, laufen</b> · Gruppe -er · p.c. j'ai marché"},{term:"demander",text:"<b>fragen</b> · Gruppe -er · p.c. j'ai demandé"},{term:"rêver",text:"<b>träumen</b> · Gruppe -er · p.c. j'ai rêvé"},{term:"rencontrer",text:"<b>begegnen</b> · Gruppe -er · p.c. j'ai rencontré"},{term:"réserver",text:"<b>reservieren</b> · Gruppe -er · p.c. j'ai réservé"},{term:"frapper",text:"<b>schlagen</b> · Gruppe -er · p.c.
